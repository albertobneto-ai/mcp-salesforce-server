<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINTO Frota · Simulador Guiado</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy-900:#122A42;--navy-800:#1B3A5B;--navy-700:#243C60;--navy-600:#2C517D;
  --blue-700:#1A5FA8;--blue-600:#1E6FBE;--blue-500:#2F86D9;--blue-400:#5EA6E6;--blue-100:#E7F1FB;
  --red:#E4002B;--ink:#14273B;--muted:#5a6f83;--line:#D8E4F0;--line-2:#E9F0F8;
  --paper:#EAF1F8;--card:#fff;--soft:#F3F8FC;--soft-2:#E9F2FB;--ok:#1B8A5A;
  --disp:'Sora','Segoe UI',system-ui,sans-serif;--body:'Inter',system-ui,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(120% 60% at 90% -10%, rgba(94,166,230,.14), transparent 60%),
  var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}

/* APP BAR */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;
  border-radius:16px;padding:18px 24px;box-shadow:0 10px 30px rgba(18,42,66,.18);position:relative;overflow:hidden}
.appbar::after{content:"";position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(94,166,230,.22),transparent 70%)}
.appbar .brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.appbar .logo{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:1.5px;position:relative}
.appbar .logo .sw{position:absolute;left:0;right:-3px;bottom:-6px;height:7px}
.appbar .sub{font-family:var(--disp);font-weight:500;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:#9cc8f0;border-left:1px solid rgba(255,255,255,.2);padding-left:14px}
.appbar .demo{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:#cfe6fb;background:rgba(94,166,230,.16);border:1px solid rgba(94,166,230,.4);border-radius:999px;
  padding:6px 13px;position:relative;z-index:1;display:flex;align-items:center;gap:7px}
.demo .dotpulse{width:7px;height:7px;border-radius:50%;background:#5EA6E6;box-shadow:0 0 0 0 rgba(94,166,230,.6);
  animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,166,230,.55)}70%{box-shadow:0 0 0 7px rgba(94,166,230,0)}100%{box-shadow:0 0 0 0 rgba(94,166,230,0)}}

/* TABS (guias) */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}.tabs::-webkit-scrollbar-thumb{background:#c3d3e4;border-radius:3px}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  color:var(--muted);border-radius:11px;padding:10px 15px;font-family:var(--disp);font-weight:600;font-size:13px;
  cursor:pointer;transition:all .16s;white-space:nowrap;user-select:none}
.tab svg{width:17px;height:17px;color:var(--steel,#5D7185);transition:color .16s}
.tab:hover{border-color:var(--blue-300,#9CC8F0);color:var(--navy-700);transform:translateY(-1px)}
.tab.active{background:linear-gradient(135deg,var(--blue-600),var(--blue-700));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(30,111,190,.32)}
.tab.active svg{color:#fff}
.tab .step-dot{font-family:var(--disp);font-size:10px;font-weight:700;background:var(--soft-2);color:var(--blue-700);
  border-radius:6px;padding:1px 6px;margin-left:2px}
.tab.active .step-dot{background:rgba(255,255,255,.2);color:#fff}

/* LAYOUT */
.stage{display:grid;grid-template-columns:1.65fr 1fr;gap:20px;margin-top:8px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:1fr}}

/* SCREEN (janela navegador) */
.screen{background:var(--navy-900);border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(18,42,66,.20);
  border:1px solid rgba(255,255,255,.06);position:sticky;top:16px}
@media(max-width:900px){.screen{position:static}}
.chrome{display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(180deg,#1e4470,#1b3a5b)}
.chrome .dots{display:flex;gap:6px}.chrome .dots i{width:9px;height:9px;border-radius:50%}
.chrome .dots i:nth-child(1){background:#ff5f57}.chrome .dots i:nth-child(2){background:#febc2e}.chrome .dots i:nth-child(3){background:#28c840}
.chrome .url{flex:1;background:rgba(0,0,0,.22);border-radius:7px;padding:5px 12px;color:#a9c5e3;font-size:11.5px;
  font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas{position:relative;background:#0e1c2c;min-height:300px}
.canvas img{display:block;width:100%}

/* MARKERS */
.marker{position:absolute;transform:translate(-50%,-50%);z-index:5;cursor:pointer}
.marker .pin{width:26px;height:26px;border-radius:50%;background:rgba(30,111,190,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:12px;
  border:2px solid rgba(255,255,255,.75);transition:all .18s;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.marker.done .pin{background:rgba(27,138,90,.9)}
.marker.active .pin{background:var(--red);width:34px;height:34px;font-size:14px;
  box-shadow:0 0 0 6px rgba(228,0,43,.22),0 4px 12px rgba(0,0,0,.35);animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(228,0,43,.4),0 4px 12px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 12px rgba(228,0,43,0),0 4px 12px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(228,0,43,0),0 4px 12px rgba(0,0,0,.35)}}
.marker .tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);
  background:#fff;color:var(--navy-900);font-family:var(--disp);font-weight:600;font-size:12px;
  padding:7px 12px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:0;
  pointer-events:none;transition:opacity .18s;max-width:240px}
.marker .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:#fff}
.marker.active .tip{opacity:1}
@media(max-width:560px){.marker .tip{display:none}}

/* LOGIN MOCK */
.login-mock{background:#f4f6f8;min-height:440px;position:relative;padding:0}
.login-mock .topbar{height:6px;background:linear-gradient(90deg,var(--blue-600),var(--blue-400))}
.lm-inner{display:flex;flex-direction:column;align-items:center;padding:38px 20px}
.lm-logo{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:1.5px;color:var(--teal,#0A6478);
  margin-bottom:22px;position:relative}
.lm-card{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:26px 30px;width:min(360px,90%);
  box-shadow:0 6px 20px rgba(18,42,66,.08)}
.lm-banner{background:#e7f1fb;border:1px solid #c3ddf3;color:#1A5FA8;border-radius:8px;padding:9px 12px;
  font-size:12.5px;margin-bottom:16px;display:none;align-items:center;gap:8px}
.lm-banner.show{display:flex}
.lm-field{margin-bottom:14px}
.lm-field label{display:block;font-family:var(--disp);font-weight:600;font-size:12px;color:var(--navy-800);margin-bottom:5px}
.lm-field input{width:100%;border:1.5px solid #cdd8e2;border-radius:7px;padding:9px 11px;font-size:14px;
  font-family:var(--body);outline:none;transition:border-color .15s,box-shadow .15s}
.lm-field input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(47,134,217,.16)}
.lm-field.hl input{border-color:var(--red);box-shadow:0 0 0 3px rgba(228,0,43,.14)}
.lm-2fa{display:none}.lm-2fa.show{display:block}
.lm-link{font-size:12.5px;color:var(--blue-600);text-decoration:none;font-weight:600}
.lm-ver{font-size:12px;color:#8a98a6;text-align:center;margin:14px 0 4px}
.lm-btn{display:block;margin:8px auto 0;background:linear-gradient(180deg,var(--blue-500),var(--blue-600));color:#fff;
  border:none;border-radius:8px;padding:10px 30px;font-family:var(--disp);font-weight:600;font-size:14px;cursor:pointer;
  box-shadow:0 4px 12px rgba(30,111,190,.3);transition:transform .1s,box-shadow .15s}
.lm-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,111,190,.4)}
.lm-btn:active{transform:translateY(0)}
.lm-success{position:absolute;inset:0;background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
  display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;
  animation:fade .3s ease}
.lm-success.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lm-success .chk{width:74px;height:74px;border-radius:50%;background:rgba(27,138,90,.18);border:2px solid #1fbf7a;
  display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.lm-success h3{font-family:var(--disp);font-size:22px;margin:0 0 8px}
.lm-success p{color:#bcd7ef;font-size:14px;margin:0 0 18px;max-width:320px}
.lm-restart{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;
  padding:9px 18px;font-family:var(--disp);font-weight:600;font-size:13px;cursor:pointer}

/* GUIDE PANEL */
.guide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px;
  box-shadow:0 6px 20px rgba(18,42,66,.06)}
.guide .g-head{display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid var(--line-2);padding-bottom:16px;margin-bottom:16px}
.g-num{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue-600),var(--navy-700));
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:20px;
  box-shadow:0 6px 16px rgba(30,111,190,.3)}
.g-head .ht{flex:1;min-width:0}
.g-flowname{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--blue-600);display:flex;align-items:center;gap:7px;margin-bottom:3px}
.g-flowname .badge2{background:var(--red);color:#fff;font-size:9px;letter-spacing:.5px;padding:2px 7px;border-radius:5px}
.g-title{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--navy-900);margin:0;line-height:1.2}
.g-path{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px}

.g-count{display:flex;align-items:center;justify-content:space-between;font-family:var(--disp);font-size:12px;
  color:var(--muted);font-weight:600;margin-bottom:8px}
.g-count b{color:var(--blue-700)}
.progress{height:7px;background:var(--soft-2);border-radius:4px;overflow:hidden;margin-bottom:18px}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--blue-500),var(--blue-600));border-radius:4px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}

.g-desc{font-size:15px;color:var(--ink);margin:0 0 14px;min-height:44px}
.g-tip{display:flex;gap:11px;background:var(--soft);border:1px solid var(--line-2);border-left:3px solid var(--blue-500);
  border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--navy-800);margin-bottom:18px}
.g-tip.empty{display:none}
.g-tip .ti{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:linear-gradient(180deg,var(--blue-500),var(--blue-600));
  color:#fff;display:flex;align-items:center;justify-content:center}
.g-tip b{color:var(--blue-700);font-family:var(--disp)}

.g-nav{display:flex;gap:10px;margin-bottom:18px}
.g-btn{flex:1;border-radius:10px;padding:11px 14px;font-family:var(--disp);font-weight:600;font-size:14px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--navy-700);transition:all .15s;display:flex;align-items:center;
  justify-content:center;gap:8px}
.g-btn:hover:not(:disabled){border-color:var(--blue-400);background:var(--soft)}
.g-btn:disabled{opacity:.4;cursor:not-allowed}
.g-btn.primary{background:linear-gradient(135deg,var(--blue-600),var(--blue-700));color:#fff;border-color:transparent;
  box-shadow:0 5px 14px rgba(30,111,190,.3)}
.g-btn.primary:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(30,111,190,.4)}
.g-btn.done{background:linear-gradient(135deg,#1fbf7a,var(--ok));color:#fff;border-color:transparent}

.g-steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2);padding-top:6px}
.g-steps li{display:flex;align-items:flex-start;gap:12px;padding:10px 8px;border-radius:9px;cursor:pointer;transition:background .14s}
.g-steps li:hover{background:var(--soft)}
.g-steps li .n{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:11px;background:#fff;transition:all .15s}
.g-steps li .lt{font-size:13.5px;color:var(--muted);padding-top:2px;transition:color .15s}
.g-steps li.active{background:var(--blue-100)}
.g-steps li.active .n{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.g-steps li.active .lt{color:var(--navy-900);font-weight:600}
.g-steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.g-steps li.done .lt{color:var(--navy-700)}

.hint-bottom{text-align:center;font-size:12px;color:var(--muted);margin-top:22px;font-family:var(--disp)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="brand">
      <div class="logo">KINTO<svg class="sw" viewBox="0 0 120 7" preserveAspectRatio="none"><path d="M2 5 C 40 2 90 2 118 4" fill="none" stroke="#5EA6E6" stroke-width="3" stroke-linecap="round"/></svg></div>
      <div class="sub">Simulador Guiado</div>
    </div>
    <div class="demo"><span class="dotpulse"></span> Modo demonstração</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="stage">
    <div class="screen" id="screen">
      <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url"></div></div>
      <div class="canvas" id="canvas"></div>
    </div>

    <div class="guide">
      <div class="g-head">
        <div class="g-num" id="gNum">01</div>
        <div class="ht">
          <div class="g-flowname" id="gFlow"></div>
          <h2 class="g-title" id="gTitle"></h2>
          <div class="g-path" id="gPath"></div>
        </div>
      </div>
      <div class="g-count"><span>Passo <b id="gCur">1</b> de <span id="gTot">5</span></span><span id="gPct"></span></div>
      <div class="progress"><div class="bar" id="gBar"></div></div>
      <p class="g-desc" id="gDesc"></p>
      <div class="g-tip" id="gTip"><span class="ti"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18.5h5M10.5 21.5h3M12 2.5a6.2 6.2 0 0 0-4.1 10.8c.75.7 1.1 1.4 1.1 2.7h6c0-1.3.35-2 1.1-2.7A6.2 6.2 0 0 0 12 2.5z"/></svg></span><div><b>Dica.</b> <span id="gTipText"></span></div></div>
      <div class="g-nav">
        <button class="g-btn" id="gPrev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Anterior</button>
        <button class="g-btn primary" id="gNext">Próximo <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <ul class="g-steps" id="gSteps"></ul>
      <div class="hint-bottom">Navegue pelas guias no topo ou clique nos marcadores da tela.</div>
    </div>
  </div>
</div>

const state = {}; FLOWS.forEach(f => state[f.id] = 0);
let cur = FLOWS[0].id;

const $ = s => document.querySelector(s);
function flow(){ return FLOWS.find(f => f.id === cur); }

function renderTabs(){
  const el = $('#tabs'); el.innerHTML = '';
  FLOWS.forEach(f => {
    const t = document.createElement('div');
    t.className = 'tab' + (f.id === cur ? ' active' : '');
    t.innerHTML = f.icon + '<span>' + f.label + '</span><span class="step-dot">' + (state[f.id]+1) + '/' + f.steps.length + '</span>';
    t.onclick = () => { cur = f.id; renderAll(); };
    el.appendChild(t);
  });
}

function renderScreen(){
  const f = flow(); const scr = $('#screen');
  if(f.type === 'login'){
    scr.querySelector('.chrome .url').textContent = 'https://frota.kintomobility.com.br/login.aspx';
    $('#canvas').innerHTML = LOGIN_MOCK;
    wireLogin();
    placeLoginMarker();
    return;
  }
  scr.querySelector('.chrome .url').textContent = f.path;
  let html = '<img src="'+f.img+'" alt="'+f.title+'">';
  f.steps.forEach((s,i) => {
    const cls = i === state[f.id] ? 'active' : (i < state[f.id] ? 'done' : '');
    html += '<div class="marker '+cls+'" style="left:'+s.x+'%;top:'+s.y+'%" data-i="'+i+'">'
          + '<div class="tip">'+s.t+'</div><div class="pin">'+(i+1)+'</div></div>';
  });
  $('#canvas').innerHTML = html;
  $('#canvas').querySelectorAll('.marker').forEach(m => {
    m.onclick = () => { state[cur] = +m.dataset.i; renderAll(); };
  });
}

function placeLoginMarker(){
  const f = flow(); const step = f.steps[state[f.id]];
  const map = {user:'#fUser', pass:'#fPass', btn:'#lmBtn', code:'#fCode'};
  const canvas = $('#canvas'); const target = canvas.querySelector(map[step.tg]);
  const old = canvas.querySelector('.marker'); if(old) old.remove();
  const succ = document.getElementById('lmSuccess');
  if(!target || (succ && succ.classList.contains('show'))) return;
  const cr = canvas.getBoundingClientRect(); const tr = target.getBoundingClientRect();
  const x = (tr.left - cr.left + tr.width/2) / cr.width * 100;
  const y = (tr.top - cr.top + tr.height/2) / cr.height * 100;
  const m = document.createElement('div'); m.className = 'marker active';
  m.style.left = x+'%'; m.style.top = y+'%';
  m.innerHTML = '<div class="tip">'+step.t+'</div><div class="pin">'+(state[f.id]+1)+'</div>';
  canvas.appendChild(m);
}

let loginPhase = 'creds';
function wireLogin(){
  loginPhase = loginPhase || 'creds';
  const btn = $('#lmBtn'); if(!btn) return;
  // restaurar estado visual conforme fase
  if(loginPhase === 'twofa'){ $('#f2fa').classList.add('show'); $('#lmBanner').classList.add('show'); }
  if(loginPhase === 'done'){ $('#lmSuccess').classList.add('show'); }
  btn.onclick = () => {
    if(loginPhase === 'creds'){
      loginPhase = 'twofa';
      $('#f2fa').classList.add('show'); $('#lmBanner').classList.add('show');
      state[cur] = 3; renderAll(); setTimeout(()=>{ const c=$('#inCode'); if(c) c.focus(); }, 60);
    } else if(loginPhase === 'twofa'){
      loginPhase = 'done';
      $('#lmSuccess').classList.add('show');
      state[cur] = 4; renderGuide(); renderTabs();
      const m = $('#canvas .marker'); if(m) m.remove();
    }
  };
  const r = $('#lmRestart'); if(r) r.onclick = () => { loginPhase='creds'; state[cur]=0; renderAll(); };
  const hl = () => {
    ['fUser','fPass','fCode'].forEach(id=>{const e=document.getElementById(id); if(e) e.classList.remove('hl');});
    const step = flow().steps[state[cur]];
    const map = {user:'fUser', pass:'fPass', code:'fCode'};
    if(map[step.tg]){ const e=document.getElementById(map[step.tg]); if(e) e.classList.add('hl'); }
  };
  hl();
}

function renderGuide(){
  const f = flow(); const i = state[f.id]; const s = f.steps[i]; const total = f.steps.length;
  $('#gNum').textContent = String(i+1).padStart(2,'0');
  $('#gFlow').innerHTML = f.label + (f.badge ? ' <span class="badge2">'+f.badge+'</span>' : '');
  $('#gTitle').textContent = f.title;
  $('#gPath').textContent = f.path;
  $('#gCur').textContent = i+1; $('#gTot').textContent = total;
  $('#gBar').style.width = ((i+1)/total*100)+'%';
  $('#gDesc').innerHTML = s.d;
  const tip = $('#gTip');
  if(s.tip){ tip.classList.remove('empty'); $('#gTipText').innerHTML = s.tip; }
  else tip.classList.add('empty');
  // nav buttons
  const prev = $('#gPrev'), next = $('#gNext');
  prev.disabled = i === 0;
  if(i === total-1){ next.classList.add('done'); next.innerHTML = 'Fluxo concluído ' + IC_OK; }
  else { next.classList.remove('done'); next.innerHTML = 'Próximo ' + IC_NEXT; }
  // steps list
  const ul = $('#gSteps'); ul.innerHTML = '';
  f.steps.forEach((st,idx) => {
    const li = document.createElement('li');
    li.className = idx === i ? 'active' : (idx < i ? 'done' : '');
    li.innerHTML = '<span class="n">'+(idx+1)+'</span><span class="lt">'+st.t+'</span>';
    li.onclick = () => { state[cur] = idx; if(f.type==='login') syncLoginPhase(idx); renderAll(); };
    ul.appendChild(li);
  });
}

function syncLoginPhase(idx){
  if(idx <= 2) loginPhase = 'creds';
  else if(idx === 3) loginPhase = 'twofa';
  else loginPhase = 'creds'; // step 5 (idx4) volta a exigir clique -> mantemos twofa visual
  if(idx === 4) loginPhase = 'twofa';
}

function go(delta){
  const f = flow(); const total = f.steps.length; let i = state[f.id];
  if(f.type === 'login'){
    // avançar aciona o botão nas fases de ação
    if(delta > 0 && (i === 2 || i === 4)){ $('#lmBtn') && $('#lmBtn').click(); return; }
  }
  i = Math.min(total-1, Math.max(0, i + delta));
  state[f.id] = i;
  if(f.type === 'login') syncLoginPhase(i);
  renderAll();
}

function renderAll(){ renderTabs(); renderScreen(); renderGuide();
  if(flow().type==='login'){ requestAnimationFrame(placeLoginMarker); } }

// nav wiring
window.addEventListener('DOMContentLoaded', () => {
  $('#gPrev').onclick = () => go(-1);
  $('#gNext').onclick = () => go(1);
  window.addEventListener('resize', () => { if(flow().type==='login') placeLoginMarker(); });
  renderAll();
});
const IC_NEXT = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>', IC_OK = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.8 2.8L16.2 9.6"/></svg>';

</div>
`;
</script>
