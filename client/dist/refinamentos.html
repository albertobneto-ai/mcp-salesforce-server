<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ever i9 — Refinamentos</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;background:#f1f5f9;color:#1a1a2e;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#e2e8f0}
::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:3px}
button,textarea,input,select{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback} = React;
const API = window.location.origin;
function getToken(){ return localStorage.getItem('everi9_token')||''; }
async function api(path, opts={}){
  const r = await fetch(API+path, {
    ...opts,
    headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+getToken(), ...(opts.headers||{}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  return r.json();
}

const DOC_STATUS={
  none:{l:"PENDENTE",c:"#94a3b8",bg:"#f1f5f9",i:"○"},
  writing:{l:"EM ESCRITA",c:"#e6a85b",bg:"#fef9c3",i:"◐"},
  review:{l:"EM REVISAO",c:"#3b82f6",bg:"#dbeafe",i:"◑"},
  approved:{l:"APROVADA",c:"#22c55e",bg:"#dcfce7",i:"●"},
  rejected:{l:"REJEITADA",c:"#ef4444",bg:"#fee2e2",i:"✕"},
};
const MOD={
  "CONTAS":{c:"#3b82f6",bg:"#dbeafe"},
  "CONTAS / CONTATOS":{c:"#0ea5e9",bg:"#e0f2fe"},
  "CONTAS / LEAD":{c:"#3b82f6",bg:"#dbeafe"},
  "TRANSVERSAL":{c:"#f59e0b",bg:"#fef3c7"},
  "LEAD":{c:"#8b5cf6",bg:"#ede9fe"},
  "CONTATOS":{c:"#06b6d4",bg:"#cffafe"},
  "SALES MAP":{c:"#22c55e",bg:"#dcfce7"},
  "TODOS":{c:"#ef4444",bg:"#fee2e2"},
};
function fmtDate(s){if(!s)return"—";const d=new Date(s+"T12:00:00");return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).toUpperCase();}
function fmtWeekday(s){if(!s)return"";const d=new Date(s+"T12:00:00");return d.toLocaleDateString("pt-BR",{weekday:"short"}).toUpperCase();}

function AdminPanel({item,onClose,onSave}){
  if(!item)return null;
  const mc=MOD[item.module]||MOD["TODOS"];
  const updateDoc=(dt,field,value)=>{onSave(item.id,{[dt+"_"+field]:value});};
  const DocCard=({dt,label,accent})=>{
    const st=item[dt+"_status"]||"none";
    const file=item[dt+"_file"]||"";
    const notes=item[dt+"_notes"]||"";
    const ds=DOC_STATUS[st];
    return React.createElement("div",{style:{border:"1px solid #e2e8f0",borderRadius:12,padding:14,backgroundColor:"#fff",marginBottom:12}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8}},
          React.createElement("div",{style:{width:28,height:28,borderRadius:6,background:accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:"#fff"}},label),
          React.createElement("div",null,
            React.createElement("div",{style:{fontSize:13,fontWeight:700,color:"#1a1a2e"}},dt==="hf"?"Historia Funcional":"Especificacao Tecnica"),
            React.createElement("div",{style:{fontSize:10,color:"#94a3b8"}},"Prazo: "+(dt==="hf"
              ?"Escrita "+fmtDate(item.us_write_deadline)+" · Aprov "+fmtDate(item.us_approve_deadline)
              :"Escrita "+fmtDate(item.et_write_deadline)+" · Aprov "+fmtDate(item.et_approve_deadline)))
          )
        ),
        React.createElement("div",{style:{fontSize:9,fontWeight:700,color:ds.c,backgroundColor:ds.bg,padding:"3px 10px",borderRadius:20,border:"1px solid "+ds.c+"33"}},ds.i+" "+ds.l)
      ),
      React.createElement("div",{style:{marginBottom:10}},
        React.createElement("div",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:"0.08em",marginBottom:5}},"STATUS"),
        React.createElement("div",{style:{display:"flex",gap:4,flexWrap:"wrap"}},
          ...Object.entries(DOC_STATUS).map(([k,v])=>
            React.createElement("button",{key:k,onClick:()=>updateDoc(dt,"status",k),style:{
              fontSize:9,fontWeight:700,padding:"4px 10px",borderRadius:5,
              border:st===k?"2px solid "+v.c:"1px solid #e2e8f0",
              backgroundColor:st===k?v.bg:"#fff",color:st===k?v.c:"#94a3b8",cursor:"pointer"
            }},v.i+" "+v.l)
          )
        )
      ),
      React.createElement("div",{style:{marginBottom:10}},
        React.createElement("div",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:"0.08em",marginBottom:5}},"ARQUIVO"),
        file
          ? React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",backgroundColor:"#f8fafc",borderRadius:6,border:"1px solid #e2e8f0"}},
              React.createElement("span",{style:{fontSize:11,color:"#1a1a2e",flex:1}},file),
              React.createElement("button",{onClick:()=>updateDoc(dt,"file",""),style:{fontSize:9,color:"#ef4444",background:"none",border:"none",cursor:"pointer",fontWeight:700}},"REMOVER")
            )
          : React.createElement("button",{onClick:()=>{
              const name=prompt("Nome do arquivo (ex: HF-REF001.docx):");
              if(name){updateDoc(dt,"file",name);if(st==="none")updateDoc(dt,"status","writing");}
            },style:{width:"100%",padding:"12px",borderRadius:6,border:"2px dashed #cbd5e1",backgroundColor:"#f8fafc",color:"#94a3b8",fontSize:11,cursor:"pointer"}},"+ REGISTRAR ARQUIVO (.docx, .pdf, .md)")
      ),
      React.createElement("div",null,
        React.createElement("div",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:"0.08em",marginBottom:5}},"OBSERVACOES"),
        React.createElement("textarea",{value:notes,onChange:e=>updateDoc(dt,"notes",e.target.value),placeholder:"Notas...",rows:2,
          style:{width:"100%",fontSize:11,padding:"8px 10px",borderRadius:6,border:"1px solid #e2e8f0",backgroundColor:"#f8fafc",color:"#1a1a2e",resize:"vertical",boxSizing:"border-box"}})
      )
    );
  };
  const parts=Array.isArray(item.participants)?item.participants:[];
  return React.createElement("div",{style:{width:380,minWidth:380,borderLeft:"2px solid #e2e8f0",backgroundColor:"#fff",display:"flex",flexDirection:"column",overflow:"hidden"}},
    React.createElement("div",{style:{padding:"14px 16px",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"flex-start",justifyContent:"space-between"}},
      React.createElement("div",{style:{flex:1,minWidth:0}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:4}},
          React.createElement("span",{style:{fontSize:10,fontWeight:700,color:"#94a3b8",fontFamily:"monospace"}},item.ref_code),
          React.createElement("span",{style:{fontSize:8,fontWeight:700,color:mc.c,backgroundColor:mc.bg,padding:"2px 6px",borderRadius:3}},item.module)
        ),
        React.createElement("div",{style:{fontSize:15,fontWeight:700,color:"#1a1a2e",lineHeight:1.3}},item.epic),
        React.createElement("div",{style:{fontSize:11,color:"#94a3b8",marginTop:4}},"Sessao: "+fmtDate(item.session_date)+" "+item.session_time+" · "+item.resp)
      ),
      React.createElement("button",{onClick:onClose,style:{background:"none",border:"none",fontSize:18,color:"#94a3b8",cursor:"pointer"}},"x")
    ),
    React.createElement("div",{style:{padding:"10px 16px",borderBottom:"1px solid #e2e8f0"}},
      React.createElement("div",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:"0.08em",marginBottom:4}},"OBJETIVO"),
      React.createElement("div",{style:{fontSize:11,color:"#475569",lineHeight:1.5}},item.objective),
      parts.length>0&&React.createElement("div",{style:{display:"flex",gap:4,flexWrap:"wrap",marginTop:8}},
        ...parts.map(p=>React.createElement("span",{key:p,style:{fontSize:9,fontWeight:600,color:"#6366f1",backgroundColor:"#eef2ff",padding:"2px 8px",borderRadius:10}},p))
      )
    ),
    React.createElement("div",{style:{padding:"10px 16px",borderBottom:"1px solid #e2e8f0"}},
      React.createElement("div",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:"0.08em",marginBottom:6}},"PIPELINE"),
      React.createElement("div",{style:{display:"flex",gap:3}},
        ...[
          {l:"SESSAO",done:true,c:"#6366f1"},
          {l:"HF",done:item.hf_status==="approved",active:["writing","review"].includes(item.hf_status),c:"#8b5cf6"},
          {l:"APR-HF",done:item.hf_status==="approved",active:item.hf_status==="review",c:"#3b82f6"},
          {l:"ET",done:item.et_status==="approved",active:["writing","review"].includes(item.et_status),c:"#f59e0b"},
          {l:"APR-ET",done:item.et_status==="approved",active:item.et_status==="review",c:"#22c55e"},
        ].map((s,i)=>React.createElement("div",{key:i,style:{flex:1,textAlign:"center"}},
          React.createElement("div",{style:{height:5,borderRadius:3,marginBottom:3,backgroundColor:s.done?s.c:s.active?s.c+"55":"#e2e8f0"}}),
          React.createElement("span",{style:{fontSize:7,fontWeight:700,color:s.done?s.c:"#94a3b8"}},s.l)
        ))
      )
    ),
    React.createElement("div",{style:{flex:1,overflowY:"auto",padding:16}},
      React.createElement(DocCard,{dt:"hf",label:"HF",accent:"#8b5cf6"}),
      React.createElement(DocCard,{dt:"et",label:"ET",accent:"#f59e0b"})
    )
  );
}

function RefCard({item,isSelected,onClick}){
  const mc=MOD[item.module]||MOD["TODOS"];
  const hfs=DOC_STATUS[item.hf_status||"none"];
  const ets=DOC_STATUS[item.et_status||"none"];
  const hfDone=item.hf_status==="approved";
  const etDone=item.et_status==="approved";
  const allDone=hfDone&&etDone;
  return React.createElement("div",{onClick,style:{
    background:"#fff",borderRadius:12,padding:"14px 16px",cursor:"pointer",
    border:isSelected?"2px solid #6366f1":"1px solid #e2e8f0",
    boxShadow:isSelected?"0 0 16px rgba(99,102,241,0.15)":"0 1px 3px rgba(0,0,0,0.04)",
    transition:"all 0.15s",marginBottom:8
  }},
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:8}},
      React.createElement("span",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",fontFamily:"monospace"}},item.ref_code),
      React.createElement("span",{style:{fontSize:8,fontWeight:700,color:mc.c,backgroundColor:mc.bg,padding:"2px 6px",borderRadius:3}},item.module),
      allDone&&React.createElement("span",{style:{fontSize:8,fontWeight:700,color:"#22c55e",marginLeft:"auto"}},"COMPLETO")
    ),
    React.createElement("div",{style:{fontSize:13,fontWeight:600,color:"#1a1a2e",lineHeight:1.4,marginBottom:8}},item.epic),
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10,fontSize:11,color:"#64748b"}},
      React.createElement("span",null,fmtWeekday(item.session_date)+" "+fmtDate(item.session_date)),
      React.createElement("span",{style:{color:"#cbd5e1"}},"|"),
      React.createElement("span",null,item.session_time),
      item.resp&&item.resp!=="—"&&React.createElement("span",{style:{marginLeft:"auto",fontSize:10,color:"#94a3b8"}},item.resp)
    ),
    React.createElement("div",{style:{display:"flex",gap:6}},
      React.createElement("div",{style:{flex:1,display:"flex",alignItems:"center",gap:6,padding:"6px 10px",borderRadius:6,background:hfs.bg,border:"1px solid "+hfs.c+"22"}},
        React.createElement("span",{style:{fontSize:11,color:hfs.c,fontWeight:700}},hfs.i),
        React.createElement("span",{style:{fontSize:10,fontWeight:600,color:hfs.c}},"HF"),
        item.hf_file&&React.createElement("span",{style:{fontSize:8,color:"#94a3b8",marginLeft:"auto",maxWidth:60,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},item.hf_file)
      ),
      React.createElement("div",{style:{flex:1,display:"flex",alignItems:"center",gap:6,padding:"6px 10px",borderRadius:6,background:ets.bg,border:"1px solid "+ets.c+"22"}},
        React.createElement("span",{style:{fontSize:11,color:ets.c,fontWeight:700}},ets.i),
        React.createElement("span",{style:{fontSize:10,fontWeight:600,color:ets.c}},"ET"),
        item.et_file&&React.createElement("span",{style:{fontSize:8,color:"#94a3b8",marginLeft:"auto",maxWidth:60,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},item.et_file)
      )
    ),
    React.createElement("div",{style:{display:"flex",gap:2,marginTop:8}},
      ...[
        {d:item.us_write_deadline,l:"US-E",c:"#8b5cf6"},
        {d:item.us_approve_deadline,l:"US-A",c:"#3b82f6"},
        {d:item.et_write_deadline,l:"ET-E",c:"#f59e0b"},
        {d:item.et_approve_deadline,l:"ET-A",c:"#22c55e"},
      ].map((p,i)=>React.createElement("div",{key:i,style:{flex:1,textAlign:"center",padding:"3px 0",borderRadius:4,background:p.c+"12",fontSize:8,fontWeight:700,color:p.c}},
        React.createElement("div",null,p.l),
        React.createElement("div",{style:{fontSize:9,fontWeight:500,color:"#64748b",marginTop:1}},fmtDate(p.d))
      ))
    )
  );
}

function App(){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selectedId,setSelectedId]=useState(null);
  const [filterMod,setFilterMod]=useState("TODOS");

  const load=async()=>{
    setLoading(true);
    try{
      const d=await api('/api/gp/refinements');
      if(d.refinements) setItems(d.refinements.map(r=>({...r,
        session_date:r.session_date?.slice(0,10),
        us_write_deadline:r.us_write_deadline?.slice(0,10),
        us_approve_deadline:r.us_approve_deadline?.slice(0,10),
        et_write_deadline:r.et_write_deadline?.slice(0,10),
        et_approve_deadline:r.et_approve_deadline?.slice(0,10),
      })));
    }catch(e){console.error(e);}
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const seed=async()=>{
    if(!confirm("Carregar agenda Fase 1 (14 sessoes)?"))return;
    await api('/api/gp/refinements/seed',{method:'POST',body:{}});
    await load();
  };

  const savePatch=async(id,patch)=>{
    const d=await api('/api/gp/refinements/'+id,{method:'PATCH',body:patch});
    if(d.refinement){
      setItems(p=>p.map(r=>r.id===id?{...r,...patch,
        session_date:d.refinement.session_date?.slice(0,10),
        us_write_deadline:d.refinement.us_write_deadline?.slice(0,10),
        us_approve_deadline:d.refinement.us_approve_deadline?.slice(0,10),
        et_write_deadline:d.refinement.et_write_deadline?.slice(0,10),
        et_approve_deadline:d.refinement.et_approve_deadline?.slice(0,10),
      }:r));
    }
  };

  const modules=useMemo(()=>{const s=new Set(items.map(r=>r.module));return["TODOS",...s];},[items]);
  const filtered=useMemo(()=>filterMod==="TODOS"?items:items.filter(r=>r.module===filterMod),[items,filterMod]);
  const selectedItem=items.find(r=>r.id===selectedId)||null;
  const hfOk=items.filter(r=>r.hf_status==="approved").length;
  const etOk=items.filter(r=>r.et_status==="approved").length;

  // Group by week
  const groups=useMemo(()=>{
    const map={};
    filtered.forEach(r=>{
      const d=new Date(r.session_date+"T12:00:00");
      const mon=d.getDate()<=7?"W1":d.getDate()<=14?"W2":d.getDate()<=21?"W3":"W4";
      const label=(d.getMonth()===5?"Jun":"Jul")+" "+mon;
      if(!map[label])map[label]=[];
      map[label].push(r);
    });
    return Object.entries(map);
  },[filtered]);

  const closeOverlay=()=>{
    try{window.parent.postMessage('ref-closed','*');}catch(e){}
    try{window.close();}catch(e){}
  };

  if(loading) return React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontSize:14,color:"#94a3b8"}},"Carregando...");
  if(!items.length) return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:16}},
    React.createElement("div",{style:{fontSize:16,fontWeight:700}},"Nenhum refinamento cadastrado"),
    React.createElement("button",{onClick:seed,style:{padding:"10px 24px",borderRadius:8,border:"none",background:"#6366f1",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"CARREGAR AGENDA FASE 1")
  );

  return React.createElement("div",{style:{fontFamily:"'Outfit',system-ui,sans-serif",backgroundColor:"#f1f5f9",height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}},
    // HEADER
    React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 20px",backgroundColor:"#fff",borderBottom:"1px solid #e2e8f0"}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
        React.createElement("div",{style:{width:32,height:32,borderRadius:8,background:"#6366f1",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:"#fff"}},"RF"),
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:15,fontWeight:700}},"Refinamentos — Fase 1"),
          React.createElement("div",{style:{fontSize:11,color:"#94a3b8"}},items.length+" sessoes · Jun-Jul 2026")
        )
      ),
      React.createElement("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        ...[{l:"HF",c:hfOk,cl:"#8b5cf6"},{l:"ET",c:etOk,cl:"#f59e0b"}].map(s=>
          React.createElement("div",{key:s.l,style:{display:"flex",alignItems:"center",gap:4,padding:"5px 12px",backgroundColor:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0"}},
            React.createElement("div",{style:{width:8,height:8,borderRadius:2,backgroundColor:s.cl}}),
            React.createElement("span",{style:{fontSize:11,fontWeight:700}},s.c+"/"+items.length),
            React.createElement("span",{style:{fontSize:10,color:"#94a3b8"}},s.l+" OK")
          )
        ),
        React.createElement("button",{onClick:closeOverlay,style:{marginLeft:8,fontSize:11,fontWeight:700,padding:"6px 14px",borderRadius:6,border:"1px solid #e2e8f0",backgroundColor:"#fff",color:"#64748b",cursor:"pointer"}},"FECHAR")
      )
    ),
    // FILTER
    React.createElement("div",{style:{display:"flex",gap:4,padding:"8px 20px",borderBottom:"1px solid #e2e8f0",backgroundColor:"#fff",overflowX:"auto"}},
      ...modules.map(m=>{
        const mc=MOD[m]||MOD["TODOS"];
        const isA=filterMod===m;
        return React.createElement("button",{key:m,onClick:()=>setFilterMod(m),style:{
          fontSize:10,fontWeight:700,padding:"4px 12px",borderRadius:6,cursor:"pointer",whiteSpace:"nowrap",
          border:isA?"1.5px solid "+mc.c:"1px solid #e2e8f0",
          backgroundColor:isA?mc.bg:"#fff",color:isA?mc.c:"#94a3b8"
        }},m);
      })
    ),
    // BODY
    React.createElement("div",{style:{flex:1,display:"flex",overflow:"hidden"}},
      // CARDS
      React.createElement("div",{style:{flex:1,overflowY:"auto",padding:20}},
        ...groups.map(([week,refs])=>
          React.createElement("div",{key:week,style:{marginBottom:20}},
            React.createElement("div",{style:{fontSize:11,fontWeight:700,color:"#6366f1",letterSpacing:"0.1em",marginBottom:8,padding:"4px 0",borderBottom:"1px solid #e2e8f0"}},week+" — "+refs.length+" sessoes"),
            React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))",gap:10}},
              ...refs.map(r=>React.createElement(RefCard,{key:r.id,item:r,isSelected:selectedId===r.id,onClick:()=>{setSelectedId(r.id);}}))
            )
          )
        )
      ),
      // ADMIN PANEL
      selectedItem&&React.createElement(AdminPanel,{item:selectedItem,onClose:()=>setSelectedId(null),onSave:savePatch})
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
