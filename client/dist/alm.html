<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ever i9 — ALM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #00897B; --teal-l: #4DB6AC; --teal-d: #00695C;
    --dk: #2D2D2D; --dc: #363636; --dh: #404040;
    --bg: #E8E8E8; --w: #FFFFFF; --g: #AAAAAA; --bd: #4A4A4A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--w); min-height:100vh; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--dk); border-radius:3px; }
  ::-webkit-scrollbar-thumb { background:var(--bd); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--g); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeOut { from{opacity:1} to{opacity:0} }
  .toast { animation: fadeIn 0.2s ease; }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

const T='#00897B',TL='#4DB6AC',DK='#2D2D2D',DC='#363636',DH='#404040',BG='#E8E8E8',W='#FFF',G='#AAA',BD='#4A4A4A';
const PRI={critical:'#E53935',high:'#FB8C00',medium:'#039BE5',low:'#78909C'};

const STAGES=[
  {key:'backlog',label:'Backlog',color:'#78909C',icon:'📋',action:'Iniciar Refinamento',next:'refinamento'},
  {key:'refinamento',label:'Refinamento Funcional',color:'#AB47BC',icon:'🔍',action:'Concluir Refinamento',next:'hf',desc:'Analise e refine os requisitos funcionais'},
  {key:'hf',label:'Escrita HF',color:'#7E57C2',icon:'📄',action:'Concluir HF',next:'spec',desc:'Escreva e anexe a História Funcional',uploadHint:'Upload da HF (.docx)'},
  {key:'spec',label:'Escrita Spec Técnica',color:'#5C6BC0',icon:'📐',action:'Concluir Spec',next:'dev',desc:'Use /devops {US} no chat para gerar spec + deploy',devops:true},
  {key:'dev',label:'Desenvolvimento',color:'#039BE5',icon:'⚙️',action:'Concluir Dev',next:'testes',desc:'Desenvolvimento e deploy dos componentes'},
  {key:'testes',label:'Testes',color:'#00897B',icon:'🧪',action:'Concluir Testes',next:'deploy',desc:'Execução de testes e validação QA'},
  {key:'deploy',label:'Deploy',color:'#F4511E',icon:'🚀',action:'Concluir Deploy',next:'homologacao',desc:'Deploy na org e validação técnica'},
  {key:'homologacao',label:'Homologação',color:'#43A047',icon:'✅',action:null,next:null,desc:'Validação final pelo negócio'},
  {key:'bugfix',label:'Em Bugfix',color:'#FF5252',icon:'🐛',action:'Concluir Bugfix',next:null,desc:'Correção de bug reportado'},
];
const SM={};STAGES.forEach((s,i)=>{SM[s.key]={...s,idx:i}});

const EPICS=[
  {id:'EP-01',name:'Conta Master',desc:'Gestão completa Account B2B',owner:'Alberto',s:'2026-05-01',e:'2026-07-31',color:'#5C6BC0'},
  {id:'EP-02',name:'Dupla Convivência',desc:'Integração CRM Legado ↔ Salesforce',owner:'Alberto',s:'2026-06-15',e:'2026-09-30',color:'#AB47BC'},
  {id:'EP-03',name:'Leads & SE',desc:'Captação e roteamento de leads B2B',owner:'Alberto',s:'2026-06-01',e:'2026-08-31',color:'#F4511E'},
  {id:'EP-04',name:'Agentforce',desc:'Agentes IA para enrichment',owner:'Alberto',s:'2026-06-10',e:'2026-08-15',color:'#00897B'},
];

const mk=(us,t,ep,stg,pr,a,sp,pd,ad,cr,files,arts)=>({us,title:t,epicId:ep,stage:stg,prevStage:null,priority:pr,assignee:a,sprint:sp,plannedDate:pd,actualDate:ad,created:cr,files:files||[],artifacts:arts||{hf:false,spec:false,deploy:false,qa:false,adr:false,cenario:false,zip:false}});
const A1={hf:true,spec:true,deploy:true,qa:true,adr:true,cenario:true,zip:true};

const INIT=[
  mk('CRMB2B-50A','Campos Account + RTs + CNAE + NJ + VRs','EP-01','homologacao','high','Alberto','Sprint 10','2026-05-20','2026-05-18','2026-05-10',[{name:'HF_50A.docx',type:'hf',date:'2026-05-11',version:'v1.0'}],A1),
  mk('CRMB2B-50B','Apex Serasa + Flows + QA + VRs','EP-01','homologacao','high','Alberto','Sprint 10','2026-05-25','2026-05-22','2026-05-15',[],A1),
  mk('CRMB2B-83','Flows ativação + QA + Flexipage','EP-01','homologacao','high','Alberto','Sprint 11','2026-06-05','2026-06-02','2026-05-25',[],A1),
  mk('CRMB2B-84','ListView BackOffice + PS + FLS','EP-01','homologacao','medium','Alberto','Sprint 11','2026-06-08','2026-06-05','2026-05-28',[],A1),
  mk('CRMB2B-85','SerasaRetryBatch + CMDT + CRON','EP-01','homologacao','medium','Alberto','Sprint 11','2026-06-10','2026-06-08','2026-06-01',[],A1),
  mk('CRMB2B-90','MatchingRules + DuplicateRules','EP-01','homologacao','high','Alberto','Sprint 12','2026-06-18','2026-06-16','2026-06-10',[],A1),
  mk('CRMB2B-91','Enriquecimento Automático Serasa','EP-01','spec','high','Alberto','Sprint 12','2026-06-25',null,'2026-06-17',[{name:'HF_CRMB2B-91.docx',type:'hf',date:'2026-06-18',version:'v1.0'}],{hf:true,spec:false,deploy:false,qa:false,adr:false,cenario:false,zip:false}),
  mk('CRMB2B-92','Account Scoring Model','EP-01','hf','medium','Alberto','Sprint 12','2026-06-28',null,'2026-06-18'),
  mk('CRMB2B-93','Dashboard Gerencial Contas','EP-01','refinamento','medium','Alberto','Sprint 12','2026-06-30',null,'2026-06-19'),
  mk('CRMB2B-94','Integração CDC MuleSoft Account','EP-02','backlog','high','','','2026-07-15',null,'2026-06-20'),
  mk('CRMB2B-95','Data Cloud Activation Target','EP-02','backlog','high','','','2026-07-20',null,'2026-06-20'),
  mk('CRMB2B-96','Lead Routing por Região','EP-03','deploy','critical','Alberto','Sprint 12','2026-06-22',null,'2026-06-14',[{name:'HF_96.docx',type:'hf',date:'2026-06-14',version:'v1.0'}],{hf:true,spec:true,deploy:true,qa:false,adr:false,cenario:false,zip:false}),
  mk('CRMB2B-97','Agentforce B2B Enrichment Fix','EP-04','bugfix','critical','Alberto','Sprint 12','2026-06-20',null,'2026-06-15',[{name:'HF_97.docx',type:'hf',date:'2026-06-15',version:'v1.0'},{name:'BugFix_97.docx',type:'bugfix',date:'2026-06-19',version:'v1.0'}],{hf:true,spec:true,deploy:false,qa:false,adr:false,cenario:false,zip:false}),
];

/* ── Shared Components ── */
const Badge=({text,color,s})=><span style={{background:color||T,color:W,padding:s?'2px 8px':'4px 12px',borderRadius:4,fontSize:s?10:12,fontWeight:600,whiteSpace:'nowrap',lineHeight:s?'16px':'20px',display:'inline-block'}}>{text}</span>;

const Card=({title,badge,children,accent,noPad})=>(
  <div style={{background:DC,borderRadius:10,overflow:'hidden',display:'flex',flexDirection:'column'}}>
    {title&&<div style={{padding:'12px 16px',borderBottom:`1px solid ${BD}`,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,borderLeft:`4px solid ${accent||T}`,minHeight:44}}><span style={{color:W,fontWeight:700,fontSize:13}}>{title}</span>{badge}</div>}
    <div style={{padding:noPad?0:'14px 16px',flex:1}}>{children}</div>
  </div>
);

const MC=({label,value,sub,color})=>(
  <div style={{background:DC,borderRadius:10,padding:'16px 18px',borderLeft:`4px solid ${color||T}`,display:'flex',flexDirection:'column',gap:3}}>
    <span style={{color:G,fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:.8}}>{label}</span>
    <span style={{color:W,fontSize:28,fontWeight:800,lineHeight:1}}>{value}</span>
    {sub&&<span style={{color:TL,fontSize:11}}>{sub}</span>}
  </div>
);

const Btn=({children,onClick,color,outline,s,disabled})=>(
  <button onClick={disabled?undefined:onClick} style={{background:disabled?BD:outline?'transparent':(color||T),color:disabled?G:W,border:outline?`1px solid ${color||T}`:'none',borderRadius:6,padding:s?'5px 12px':'9px 18px',cursor:disabled?'not-allowed':'pointer',fontSize:s?11:13,fontWeight:600,display:'inline-flex',alignItems:'center',gap:5,opacity:disabled?0.5:1,transition:'opacity .15s'}}>{children}</button>
);

const MBar=({value,max,color})=><div style={{background:BD,borderRadius:3,height:6,flex:1,minWidth:40}}><div style={{background:color||T,borderRadius:3,height:6,width:`${Math.min((value/Math.max(max,1))*100,100)}%`,transition:'width .3s'}}/></div>;

const ADot=({has})=><div style={{width:18,height:18,borderRadius:3,background:has?'#43A047':'#4A4A4A',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:W,flexShrink:0}}>{has?'✓':'–'}</div>;

const Gauge=({value,label})=>{
  const angle=-90+(Math.min(value,100)/100)*180;
  const cs=['#E53935','#FB8C00','#FDD835','#7CB342','#43A047'];
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
      <svg viewBox="0 0 120 68" width="108" height="62">{cs.map((c,i)=>{const sA=-90+i*36,eA=sA+36,r=46,cx=60,cy=58;return<path key={i} d={`M ${cx+r*Math.cos(sA*Math.PI/180)} ${cy+r*Math.sin(sA*Math.PI/180)} A ${r} ${r} 0 0 1 ${cx+r*Math.cos(eA*Math.PI/180)} ${cy+r*Math.sin(eA*Math.PI/180)}`} stroke={c} strokeWidth="9" fill="none"/>})}<line x1="60" y1="58" x2={60+32*Math.cos(angle*Math.PI/180)} y2={58+32*Math.sin(angle*Math.PI/180)} stroke={W} strokeWidth="2.5" strokeLinecap="round"/><circle cx="60" cy="58" r="4" fill={DC} stroke={W} strokeWidth="2"/></svg>
      <span style={{color:W,fontSize:18,fontWeight:800}}>{value}%</span>
      <span style={{color:G,fontSize:9,textTransform:'uppercase',letterSpacing:.5}}>{label}</span>
    </div>
  );
};

const Modal=({title,children,onClose})=>(
  <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}} onClick={onClose}>
    <div style={{background:DC,borderRadius:12,width:540,maxHeight:'85vh',overflow:'auto',boxShadow:'0 20px 60px rgba(0,0,0,.5)'}} onClick={e=>e.stopPropagation()}>
      <div style={{padding:'14px 18px',borderBottom:`1px solid ${BD}`,display:'flex',justifyContent:'space-between',alignItems:'center',borderLeft:`4px solid ${T}`}}>
        <span style={{color:W,fontWeight:700,fontSize:14}}>{title}</span>
        <button onClick={onClose} style={{background:'none',border:'none',color:G,fontSize:18,cursor:'pointer',padding:4}}>✕</button>
      </div>
      <div style={{padding:18}}>{children}</div>
    </div>
  </div>
);

const FF=({label,children})=><div style={{marginBottom:12}}><label style={{color:G,fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:5}}>{label}</label>{children}</div>;
const Inp=({value,onChange,placeholder,type})=><input type={type||'text'} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:'100%',background:DK,border:`1px solid ${BD}`,borderRadius:6,padding:'9px 11px',color:W,fontSize:12,outline:'none',boxSizing:'border-box'}}/>;
const Sel=({value,onChange,options})=><select value={value} onChange={e=>onChange(e.target.value)} style={{width:'100%',background:DK,border:`1px solid ${BD}`,borderRadius:6,padding:'9px 11px',color:W,fontSize:12,outline:'none',boxSizing:'border-box'}}>{options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>;

const UploadZone=({label,color,onUpload})=>(
  <div style={{border:`2px dashed ${color||BD}`,borderRadius:8,padding:14,textAlign:'center',cursor:'pointer',background:`${color||BD}10`,transition:'border-color .2s'}} onClick={onUpload} onMouseEnter={e=>e.currentTarget.style.borderColor=W} onMouseLeave={e=>e.currentTarget.style.borderColor=color||BD}>
    <div style={{fontSize:20}}>📎</div>
    <div style={{color:W,fontSize:11,marginTop:3,fontWeight:600}}>{label||'Upload de arquivo'}</div>
    <div style={{color:G,fontSize:10,marginTop:2}}>Arraste ou clique para selecionar</div>
  </div>
);

const FileList=({files})=>{
  const ic={hf:'📄',spec:'📐',adr:'📑',cenario:'✅',zip:'📦',bugfix:'🐛',other:'📎'};
  if(!files.length)return<div style={{color:G,fontSize:11,textAlign:'center',padding:10}}>Nenhum documento</div>;
  return<div style={{display:'flex',flexDirection:'column',gap:2}}>{files.map((f,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',background:i%2===0?DK:'transparent',borderRadius:4}}><span style={{fontSize:14}}>{ic[f.type]||ic.other}</span><span style={{color:W,fontSize:11,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</span>{f.version&&<Badge text={f.version} color={DH} s/>}<Badge text={f.type} color={(SM[f.type]||{}).color||T} s/><span style={{color:G,fontSize:10}}>{f.date}</span><Btn s color={T}>↓</Btn></div>)}</div>;
};

const StageProgress=({cur})=>{
  const idx=(SM[cur]||{}).idx||0;const main=STAGES.filter(s=>s.key!=='bugfix');const bug=cur==='bugfix';
  return<div style={{display:'flex',alignItems:'center',gap:0,justifyContent:'center'}}>{main.map((s,i)=>{const done=!bug&&i<idx;const act=!bug&&i===idx;return<div key={s.key} style={{display:'flex',alignItems:'center'}}><div style={{width:act?28:20,height:act?28:20,borderRadius:'50%',background:done?s.color:act?s.color:BD,display:'flex',alignItems:'center',justifyContent:'center',fontSize:act?13:10,border:act?`2px solid ${W}`:'none',boxShadow:act?`0 0 8px ${s.color}80`:'none',transition:'all .2s'}} title={s.label}>{done?<span style={{color:W,fontSize:8,fontWeight:800}}>✓</span>:<span>{s.icon}</span>}</div>{i<main.length-1&&<div style={{width:14,height:2,background:done?main[i+1].color:BD,borderRadius:1}}/>}</div>})}{bug&&<><div style={{width:14,height:2,background:'#FF5252',borderRadius:1,marginLeft:2}}/><div style={{width:28,height:28,borderRadius:'50%',background:'#FF5252',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,border:`2px solid ${W}`,boxShadow:'0 0 8px #FF525280'}}>🐛</div></>}</div>;
};

/* ── Calendar ── */
function GPCalendar({stories,year,month,onStory}){
  const[cY,sY]=useState(year);const[cM,sM]=useState(month);
  const dim=new Date(cY,cM+1,0).getDate();const fd=new Date(cY,cM,1).getDay();
  const mn=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dn=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const sd=useMemo(()=>{const m={};stories.forEach(st=>{if(!st.plannedDate)return;const[y,mo,da]=st.plannedDate.split('-').map(Number);if(y===cY&&mo-1===cM){if(!m[da])m[da]=[];m[da].push(st)}});return m},[stories,cY,cM]);
  const prev=()=>{if(cM===0){sM(11);sY(cY-1)}else sM(cM-1)};
  const next=()=>{if(cM===11){sM(0);sY(cY+1)}else sM(cM+1)};
  const cells=[];for(let i=0;i<fd;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
  const td=new Date();const isT=d=>d&&cY===td.getFullYear()&&cM===td.getMonth()&&d===td.getDate();

  return(
    <Card title="Calendário" accent={T}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <button onClick={prev} style={{background:DH,border:'none',color:W,borderRadius:6,padding:'5px 12px',cursor:'pointer',fontSize:16,fontWeight:700}}>‹</button>
        <span style={{color:W,fontSize:14,fontWeight:700}}>{mn[cM]} {cY}</span>
        <button onClick={next} style={{background:DH,border:'none',color:W,borderRadius:6,padding:'5px 12px',cursor:'pointer',fontSize:16,fontWeight:700}}>›</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
        {dn.map(d=><div key={d} style={{textAlign:'center',color:G,fontSize:9,fontWeight:700,padding:3,textTransform:'uppercase'}}>{d}</div>)}
        {cells.map((d,i)=>{const sts=d?(sd[d]||[]):[];return(
          <div key={i} style={{background:d?(isT(d)?`${T}25`:DK):'transparent',borderRadius:6,minHeight:58,padding:3,border:isT(d)?`2px solid ${T}`:`1px solid ${d?BD:'transparent'}`}}>
            {d&&<div style={{color:isT(d)?TL:G,fontSize:10,fontWeight:600,marginBottom:2}}>{d}</div>}
            <div style={{display:'flex',flexDirection:'column',gap:1}}>
              {sts.slice(0,3).map(st=>{const sg=SM[st.stage];return(
                <div key={st.us} onClick={()=>onStory(st.us)} style={{display:'flex',alignItems:'center',gap:3,cursor:'pointer',padding:'1px 3px',borderRadius:3,background:`${(sg||{}).color||G}25`}} title={`${st.us}: ${st.title}`}>
                  <div style={{width:7,height:7,borderRadius:'50%',background:(sg||{}).color||G,flexShrink:0}}/>
                  <span style={{color:W,fontSize:8,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{st.us.replace('CRMB2B-','')}</span>
                </div>
              )})}
              {sts.length>3&&<span style={{color:G,fontSize:8,textAlign:'center'}}>+{sts.length-3}</span>}
            </div>
          </div>
        )})}
      </div>
      <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap',justifyContent:'center'}}>
        {STAGES.map(s=><div key={s.key} style={{display:'flex',alignItems:'center',gap:3}}><div style={{width:7,height:7,borderRadius:'50%',background:s.color}}/><span style={{color:G,fontSize:8}}>{s.label}</span></div>)}
      </div>
    </Card>
  );
}

/* ── GP Dashboard ── */
function GPDash({stories,epics,onStory,onEpic,onNewE,onNewS}){
  const total=stories.length;const hom=stories.filter(s=>s.stage==='homologacao').length;
  const late=stories.filter(s=>s.plannedDate&&!s.actualDate&&new Date(s.plannedDate)<new Date()).length;
  const active=stories.filter(s=>!['backlog','homologacao'].includes(s.stage)).length;
  const bugs=stories.filter(s=>s.stage==='bugfix').length;
  const byS=useMemo(()=>{const m={};STAGES.forEach(s=>m[s.key]=0);stories.forEach(s=>m[s.stage]++);return m},[stories]);
  const[tab,setTab]=useState('pipeline');

  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10}}>
        <MC label="Total" value={total} sub={`${epics.length} épicos`} color={T}/>
        <MC label="Andamento" value={active} color="#039BE5"/>
        <MC label="Homologadas" value={hom} sub={`${((hom/total)*100).toFixed(0)}%`} color="#43A047"/>
        <MC label="Bugfix" value={bugs} sub={bugs>0?'Em correção':'Nenhum'} color="#FF5252"/>
        <MC label="Atrasadas" value={late} sub={late>0?'Atenção':'OK'} color={late>0?'#E53935':'#78909C'}/>
      </div>

      <div style={{display:'flex',gap:2,background:DK,borderRadius:8,padding:3,alignSelf:'flex-start'}}>
        {[{k:'pipeline',l:'Pipeline',i:'▦'},{k:'calendar',l:'Calendário',i:'📅'}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{background:tab===t.k?T:'transparent',color:tab===t.k?W:G,border:'none',borderRadius:6,padding:'6px 14px',cursor:'pointer',fontSize:11,fontWeight:600,display:'flex',alignItems:'center',gap:4}}><span>{t.i}</span>{t.l}</button>
        ))}
      </div>

      {tab==='pipeline'&&(
        <Card title="Pipeline do Projeto" accent={T}>
          <div style={{display:'grid',gridTemplateColumns:`repeat(${STAGES.length},1fr)`,gap:4}}>
            {STAGES.map((stg,i)=>(
              <div key={stg.key} style={{background:DK,borderRadius:8,padding:'10px 4px',display:'flex',flexDirection:'column',alignItems:'center',gap:4,borderTop:`3px solid ${stg.color}`,position:'relative',minHeight:90}}>
                <span style={{fontSize:16}}>{stg.icon}</span>
                <span style={{color:W,fontSize:8,fontWeight:700,textAlign:'center',lineHeight:1.2,minHeight:20,display:'flex',alignItems:'center'}}>{stg.label}</span>
                <span style={{background:stg.color,color:W,borderRadius:10,padding:'2px 9px',fontSize:16,fontWeight:800}}>{byS[stg.key]}</span>
                {i<STAGES.length-1&&stg.key!=='homologacao'&&<div style={{position:'absolute',right:-6,top:'50%',transform:'translateY(-50%)',color:G,fontSize:11,zIndex:1}}>›</div>}
              </div>
            ))}
          </div>
        </Card>
      )}

      {tab==='calendar'&&<GPCalendar stories={stories} year={2026} month={5} onStory={onStory}/>}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Card title="Épicos" badge={<Btn s onClick={onNewE}>+ Épico</Btn>}>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {epics.map(ep=>{const es=stories.filter(s=>s.epicId===ep.id);const d=es.filter(s=>s.stage==='homologacao').length;const pct=es.length>0?((d/es.length)*100).toFixed(0):0;return(

  function setBug(us){setStories(p=>p.map(s=>s.us!==us?s:{...s,prevStage:s.stage,stage:'bugfix'}));tt(`${us} → Bugfix 🐛`,'#FF5252')}
  function resBug(us){setStories(p=>p.map(s=>s.us!==us?s:{...s,stage:s.prevStage||'dev',prevStage:null}));tt(`${us} → Bugfix resolvido ✓`,'#43A047')}
  function goStory(us){setSelUs(us);setArchV('detail');setPanel('arch')}

      <div style={{background:`linear-gradient(135deg,${DK},${DH})`,padding:'0 16px',display:'flex',alignItems:'center',justifyContent:'space-between',height:48,boxShadow:'0 2px 8px rgba(0,0,0,.3)',position:'sticky',top:0,zIndex:100}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{background:T,color:W,padding:'3px 9px',borderRadius:5,fontWeight:800,fontSize:13}}>i9</div>
          <span style={{color:W,fontWeight:700,fontSize:14}}>ALM</span>
          <div style={{display:'flex',gap:2,background:'rgba(255,255,255,.08)',borderRadius:7,padding:2,marginLeft:8}}>
            {[{k:'gp',l:'GP',i:'📊'},{k:'arch',l:'Arquiteto',i:'⚙️'}].map(p=><button key={p.k} onClick={()=>{setPanel(p.k);if(p.k==='gp')setGpV('dash');else{setArchV('dash');setSelUs(null)}}} style={{background:panel===p.k?T:'transparent',color:panel===p.k?W:G,border:'none',borderRadius:5,padding:'5px 12px',cursor:'pointer',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',gap:4}}><span>{p.i}</span>{p.l}</button>)}
          </div>
        </div>
        {panel==='arch'&&<div style={{display:'flex',gap:2,background:'rgba(255,255,255,.06)',borderRadius:7,padding:2}}>{aN.map(n=><button key={n.k} onClick={()=>{setArchV(n.k);setSelUs(null)}} style={{background:(archV===n.k||(archV==='detail'&&n.k==='board'))?T:'transparent',color:(archV===n.k||(archV==='detail'&&n.k==='board'))?W:G,border:'none',borderRadius:5,padding:'5px 12px',cursor:'pointer',fontSize:11,fontWeight:600,display:'flex',alignItems:'center',gap:4}}><span style={{fontSize:12}}>{n.i}</span>{n.l}</button>)}</div>}
        <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{color:G,fontSize:10}}>CRM B2B Algar</span><div style={{width:30,height:30,borderRadius:'50%',background:T,display:'flex',alignItems:'center',justifyContent:'center',color:W,fontWeight:700,fontSize:12}}>AB</div></div>
      </div>

      <div style={{maxWidth:1400,margin:'0 auto',padding:'14px 16px'}}>
        {panel==='gp'&&gpV==='dash'&&<GPDash stories={stories} epics={epics} onStory={goStory} onEpic={id=>{setSelEp(id);setGpV('epic')}} onNewE={()=>setShowNE(true)} onNewS={()=>setShowNS(true)}/>}
        {panel==='gp'&&gpV==='epic'&&selEp&&<GPEpicDetail epic={epics.find(e=>e.id===selEp)} stories={stories} onBack={()=>setGpV('dash')} onStory={goStory}/>}
        {panel==='arch'&&archV==='dash'&&<ArchDash stories={stories} onSelect={st=>{setSelUs(st.us);setArchV('detail')}}/>}
        {panel==='arch'&&archV==='board'&&<ArchBoard stories={stories} onSelect={st=>{setSelUs(st.us);setArchV('detail')}}/>}
        {panel==='arch'&&archV==='detail'&&selStory&&<ArchDetail item={selStory} epics={epics} onBack={()=>setArchV('board')} onAdvance={advance} onUpload={upload} onBugfix={setBug} onBugfixResolve={resBug}/>}
        {panel==='arch'&&archV==='matrix'&&<ArchMatrix stories={stories}/>}
      </div>

      {showNE&&<Modal title="Novo Épico" onClose={()=>setShowNE(false)}><FF label="Nome"><Inp value={fe.name} onChange={v=>setFe({...fe,name:v})} placeholder="Ex: Conta Master"/></FF><FF label="Descrição"><Inp value={fe.desc} onChange={v=>setFe({...fe,desc:v})} placeholder="Descrição"/></FF><FF label="Owner"><Inp value={fe.owner} onChange={v=>setFe({...fe,owner:v})}/></FF><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}><FF label="Início"><Inp type="date" value={fe.s} onChange={v=>setFe({...fe,s:v})}/></FF><FF label="Fim"><Inp type="date" value={fe.e} onChange={v=>setFe({...fe,e:v})}/></FF></div><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:8}}><Btn outline onClick={()=>setShowNE(false)}>Cancelar</Btn><Btn onClick={()=>{setShowNE(false);tt('Épico criado!',T)}}>Criar</Btn></div></Modal>}
      {showNS&&<Modal title="Nova História" onClose={()=>setShowNS(false)}><div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:8}}><FF label="US"><Inp value={fs.us} onChange={v=>setFs({...fs,us:v})} placeholder="CRMB2B-XX"/></FF><FF label="Título"><Inp value={fs.title} onChange={v=>setFs({...fs,title:v})} placeholder="Título"/></FF></div><FF label="Épico"><Sel value={fs.epicId} onChange={v=>setFs({...fs,epicId:v})} options={epics.map(e=>({v:e.id,l:e.name}))}/></FF><div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}><FF label="Prioridade"><Sel value={fs.priority} onChange={v=>setFs({...fs,priority:v})} options={[{v:'critical',l:'Critical'},{v:'high',l:'High'},{v:'medium',l:'Medium'},{v:'low',l:'Low'}]}/></FF><FF label="Responsável"><Inp value={fs.assignee} onChange={v=>setFs({...fs,assignee:v})}/></FF><FF label="Prevista"><Inp type="date" value={fs.planned} onChange={v=>setFs({...fs,planned:v})}/></FF></div><FF label="Sprint"><Inp value={fs.sprint} onChange={v=>setFs({...fs,sprint:v})} placeholder="Sprint 12"/></FF><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:8}}><Btn outline onClick={()=>setShowNS(false)}>Cancelar</Btn><Btn onClick={()=>{setShowNS(false);tt('História criada!',T)}}>Criar</Btn></div></Modal>}

      <div style={{background:DK,padding:'8px 16px',textAlign:'center',color:G,fontSize:10,marginTop:16}}>EVER I9 ALM · CRM B2B Algar Telecom · Confidencial</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
