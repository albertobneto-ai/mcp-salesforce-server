<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Ever i9 — Spec AI Platform</title>
    <script type="module" crossorigin src="/assets/index-BQ-vFvcN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BOQReWeI.css">
  </head>
  <body>
    <div id="root"></div>
  <script>
(function(){
  function gr(){try{return JSON.parse(localStorage.getItem('everi9_user')||'{}').role||'';}catch(e){return'';}}

  /* === Data Cloud Overlay === */
  var ov=document.createElement('div');ov.id='dc-overlay';ov.style.cssText='position:fixed;inset:0;z-index:1050;display:none;';
  var ifr=document.createElement('iframe');ifr.style.cssText='width:100%;height:100%;border:none;';
  ov.appendChild(ifr);document.body.appendChild(ov);

  /* === CRM Algar Overlay === */
  var ov2=document.createElement('div');ov2.id='crm-overlay';ov2.style.cssText='position:fixed;inset:0;z-index:1050;display:none;';
  var ifr2=document.createElement('iframe');ifr2.style.cssText='width:100%;height:100%;border:none;';
  ov2.appendChild(ifr2);document.body.appendChild(ov2);

  /* === Squad Agentes SF Overlay (admin only) === */
  var ov3=document.createElement('div');ov3.id='squad-overlay';ov3.style.cssText='position:fixed;inset:0;z-index:1050;display:none;';
  var ifr3=document.createElement('iframe');ifr3.style.cssText='width:100%;height:100%;border:none;';
  ov3.appendChild(ifr3);document.body.appendChild(ov3);

  /* === Message handler for all overlays === */
  window.addEventListener('message',function(e){
    if(e.data==='dc-closed')ov.style.display='none';
    if(e.data==='crm-closed')ov2.style.display='none';
    if(e.data==='squad-closed')ov3.style.display='none';
  });

  /* === Role-based redirects === */
  var roleRedirected=false;
  var roleCheck=setInterval(function(){
    if(roleRedirected)return;
    var role=gr();
    var hasToken=!!localStorage.getItem('everi9_token');
    if(!role||!hasToken)return;

    /* Squad roles: redirect to standalone /squad.html */
    var squadRoles=['funcional','architect','desenvolvedor','developer'];
    if(squadRoles.indexOf(role)>=0){
      roleRedirected=true;
      clearInterval(roleCheck);
      window.location.href='/squad.html';
      return;
    }

    /* Gerente de Projetos: auto-open GP panel, hide chat, close=logout */
    var gpRoles=['gp','gerente_projetos','gerente projetos','project_manager'];
    if(gpRoles.indexOf(role)>=0){
      roleRedirected=true;
      clearInterval(roleCheck);
      /* Esconde toda a UI principal exceto o GP */
      var style=document.createElement('style');
      style.textContent='body>div#root>*:not([class*="gp"]):not([class*="GP"]){opacity:0;pointer-events:none;position:absolute;} .gp-close-override{display:none!important;}';
      document.head.appendChild(style);
      /* Auto-clica no botão GP quando disponível */
      var gpAutoClick=setInterval(function(){
        var bs=document.querySelectorAll('button');
        for(var i=0;i<bs.length;i++){
          if(bs[i].textContent.trim()==='GP'){
            bs[i].click();
            clearInterval(gpAutoClick);
            /* Interceptar fechamento do GP para fazer logout */
            setTimeout(function(){
              var closeBtn=document.querySelector('[title="Fechar GP"],[title="Voltar"]');
              if(closeBtn){
                closeBtn.addEventListener('click',function(ev){
                  ev.preventDefault();ev.stopPropagation();
                  if(confirm('Deseja sair e encerrar a sessão?')){
                    localStorage.removeItem('everi9_token');
                    localStorage.removeItem('everi9_user');
                    window.location.href='/';
                  }
                },true);
              }
            },1000);
            break;
          }
        }
      },800);
    }
  },1000);

  /* === Inject sidebar buttons === */
  setInterval(function(){
    var role=gr();if(!role)return;
    var isAdmin=role==='admin'||role==='architect';
    var bs=document.querySelectorAll('button'),gp=null;
    for(var i=0;i<bs.length;i++){if(bs[i].textContent.trim()==='GP'){gp=bs[i];break;}}
    if(!gp)return;

    /* DC button (admin/architect only) */
    if(isAdmin&&!document.getElementById('dc-sidebar-btn')){
      var b=document.createElement('button');b.id='dc-sidebar-btn';b.title='Data Cloud Sandbox';
      b.onclick=function(ev){ev.stopPropagation();ov.style.display='block';ifr.src='/datacloud.html';};
      b.style.cssText='background:none;border:1px solid rgba(6,182,212,.25);border-radius:8px;padding:6px 14px;color:#06b6d4;font-size:13px;cursor:pointer;font-family:Outfit,sans-serif;font-weight:600;';
      b.textContent='\u2601\uFE0F DC';
      gp.parentNode.insertBefore(b,gp);
    }

    /* CRM Algar button (admin/architect only) */
    if(isAdmin&&!document.getElementById('crm-sidebar-btn')){
      var dcBtn=document.getElementById('dc-sidebar-btn');
      var b2=document.createElement('button');b2.id='crm-sidebar-btn';b2.title='CRM Algar Telecom — Emulador Dupla Convivência';
      b2.onclick=function(ev){ev.stopPropagation();ov2.style.display='block';ifr2.src='/crm-algar.html';};
      b2.style.cssText='background:none;border:1px solid rgba(0,166,81,.25);border-radius:8px;padding:6px 14px;color:#00A651;font-size:13px;cursor:pointer;font-family:Outfit,sans-serif;font-weight:600;';
      b2.textContent='\uD83D\uDCDE CRM';
      if(dcBtn&&dcBtn.nextSibling){dcBtn.parentNode.insertBefore(b2,dcBtn.nextSibling);}
      else if(dcBtn){dcBtn.parentNode.insertBefore(b2,gp);}
      else{gp.parentNode.insertBefore(b2,gp);}
    }

    /* Squad Agentes button (all roles) */
    if(!document.getElementById('squad-sidebar-btn')){
      var crmBtn=document.getElementById('crm-sidebar-btn');
      var b3=document.createElement('button');b3.id='squad-sidebar-btn';b3.title='Squad Agentes SF — Pipeline AI';
      b3.onclick=function(ev){ev.stopPropagation();ov3.style.display='block';ifr3.src='/squad.html';};
      b3.style.cssText='background:none;border:1px solid rgba(139,92,246,.3);border-radius:8px;padding:6px 14px;color:#a78bfa;font-size:13px;cursor:pointer;font-family:Outfit,sans-serif;font-weight:600;';
      b3.textContent='\u25C8 Squad';
      if(gp){
        if(crmBtn&&crmBtn.nextSibling){crmBtn.parentNode.insertBefore(b3,crmBtn.nextSibling);}
        else if(crmBtn){crmBtn.parentNode.insertBefore(b3,gp);}
        else{gp.parentNode.insertBefore(b3,gp);}
      }else{
        /* Fallback: injetar no header para perfis sem GP */
        var hdr=document.querySelector('header')||document.querySelector('[class*="header"]')||document.querySelector('nav');
        if(hdr){hdr.appendChild(b3);}
      }
    }
  },800);
})();
</script></body>
</html>
