<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Algar Telecom</title>
<link rel="icon" href="https://login.salesforce.com/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--ag:#4a8c6a;--ag2:#3d7558;--ag3:#5ba17a;--aglt:#e3f5ef;--agbg:#edf7f3;--hdr:#4a8c3f;--hdr2:#3d7534;--bg:#f5f5f5;--w:#ffffff;--t:#333333;--t2:#666666;--t3:#999999;--b:#dddddd;--b2:#e0e0e0;--link:#1a73c8;--err:#cc0000;--warn:#e67e00;--ok:#2d8c2d;--f:'Open Sans',Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t);font-size:12px;overflow-x:hidden;height:100vh;display:flex;flex-direction:column}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
/* Header */
.hdr{height:44px;background:linear-gradient(180deg,#5a9a7d,#488c6a);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:6px}
.hdr-l svg{display:block}
.hdr-r{display:flex;align-items:center;gap:10px}
.hdr-av{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid rgba(255,255,255,.4)}
.hdr-av img{width:100%;height:100%}
.hdr-av-i{font-size:14px;color:var(--ag)}
.hdr-name{color:#fff;font-size:12px;font-weight:700;letter-spacing:.3px}
.hdr-close{background:none;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:4px 12px;color:rgba(255,255,255,.8);font-size:11px;cursor:pointer;font-family:var(--f)}
.hdr-close:hover{background:rgba(255,255,255,.15)}
/* Submenu */
.submenu{height:28px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px;flex-shrink:0}
.submenu a{color:var(--t2);font-weight:600;display:flex;align-items:center;gap:3px}
.submenu a:hover{color:var(--ag)}
.submenu .sep{color:var(--b)}
/* Content */
.content{flex:1;overflow:auto;padding:12px 16px}
/* Dados do Cliente */
.sec-title{font-size:13px;font-weight:700;color:var(--link);margin-bottom:8px}
.data-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--w);border:1px solid var(--b);border-radius:3px;margin-bottom:12px}
.data-row{display:flex;padding:4px 10px;border-bottom:1px solid #f0f0f0;font-size:11px}
.data-lbl{color:var(--t2);font-weight:600;min-width:130px;flex-shrink:0}
.data-val{color:var(--t);font-weight:700}
.data-val-link{color:var(--link);font-weight:700;cursor:pointer}
/* Info Tabs */
.info-tabs{display:flex;margin-bottom:0;border-bottom:none}
.itab{padding:7px 18px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--b);border-bottom:none;background:#f0f0f0;color:var(--t2);margin-right:2px;border-radius:4px 4px 0 0;display:flex;align-items:center;gap:5px}
.itab.a{background:var(--ag);color:#fff;border-color:var(--ag)}
.itab:hover:not(.a){background:#e8e8e8}
.itab-icon{font-size:10px}
/* Table card */
.tcard{background:var(--w);border:1px solid var(--b);border-radius:0 4px 4px 4px;padding:12px;margin-bottom:14px}
.tcard-h{font-size:12px;font-weight:700;color:var(--t);margin-bottom:8px}
.tcard-sub{font-size:11px;color:var(--t2);margin-bottom:6px}
.stat-line{display:flex;gap:16px;font-size:11px;margin-bottom:6px}
.stat-g{color:var(--ok);font-weight:600}.stat-r{color:var(--err);font-weight:600}
/* Tables */
.ctbl{width:100%;border-collapse:collapse;font-size:11px;border:1px solid var(--b)}
.ctbl th{background:var(--aglt);padding:5px 8px;text-align:left;font-weight:700;color:var(--t);border:1px solid var(--b);white-space:nowrap;font-size:10px}
.ctbl td{padding:5px 8px;border:1px solid #eee;white-space:nowrap}
.ctbl tr:hover td{background:#f9f9f9}
.ctbl .link{color:var(--link);cursor:pointer;text-decoration:underline}
/* Status badges */
.st{padding:1px 6px;border-radius:2px;font-size:10px;font-weight:700;display:inline-block}
.st-ativo{background:#d4edda;color:#155724}.st-cancel{background:#f8d7da;color:#721c24}.st-aberto{background:#fff3cd;color:#856404}.st-migrado{background:#e2e3e5;color:#383d41}.st-aguard{background:#cce5ff;color:#004085}.st-sync{background:#d4edda;color:#155724}.st-pend{background:#fff3cd;color:#856404}.st-nosync{background:#e2e3e5;color:#6c757d}
/* Dual bar */
.dual-bar{background:linear-gradient(90deg,rgba(245,124,0,.08),rgba(0,166,81,.05),rgba(1,118,211,.08));border:1px solid var(--b);border-radius:4px;padding:8px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;font-size:11px}
.dual-l{display:flex;align-items:center;gap:6px}
.dual-badge{padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700}
.dual-lg{background:#fff3e0;color:#e65100}.dual-sf{background:#e3f2fd;color:#0d47a1}.dual-snk{background:#e8f5e9;color:#2e7d32}
.dual-arr{color:var(--ag);font-weight:700;font-size:14px}
/* Produto table */
.ptbl{width:100%;border-collapse:collapse;font-size:11px;border:1px solid var(--b);margin-top:8px}
.ptbl th{background:var(--agbg);padding:4px 8px;text-align:left;font-weight:700;color:var(--t);border:1px solid var(--b);font-size:10px;white-space:nowrap}
.ptbl td{padding:4px 8px;border:1px solid #eee;font-size:11px}
.ptbl tr:hover td{background:#fafafa}
/* Footer */
.ftr{height:28px;background:#f0f0f0;border-top:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:10px;color:var(--t3);flex-shrink:0}
.ftr-btn{padding:3px 12px;background:var(--ag);color:#fff;border:none;border-radius:3px;font-size:10px;font-weight:600;cursor:pointer;font-family:var(--f)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--w);border-radius:6px;width:92%;max-width:640px;max-height:80vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal-hd{padding:10px 16px;background:var(--ag);color:#fff;display:flex;align-items:center;justify-content:space-between;border-radius:6px 6px 0 0}
.modal-hd h3{font-size:14px;font-weight:700}
.modal-bd{padding:16px}
.modal-gd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-fl{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.modal-fv{font-size:12px;color:var(--t);font-weight:600}
.modal-ft{padding:10px 16px;border-top:1px solid var(--b);display:flex;gap:8px}
.mbtn{flex:1;padding:8px;border:none;border-radius:4px;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--f)}
.mbtn-sf{background:#1565c0;color:#fff}.mbtn-lg{background:#e65100;color:#fff}.mbtn-x{background:#f5f5f5;color:var(--t);border:1px solid var(--b)}
/* Sidebar collapse for navigation */
.left-nav{width:160px;background:var(--w);border-right:1px solid var(--b);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.lnav-h{padding:8px 12px;background:var(--aglt);border-bottom:1px solid var(--b);font-size:10px;font-weight:700;color:var(--ag);text-transform:uppercase;letter-spacing:1px}
.lnav-i{padding:8px 12px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--t2);border-left:3px solid transparent;transition:all .1s}
.lnav-i:hover{background:var(--aglt);color:var(--t)}
.lnav-i.a{background:var(--aglt);color:var(--ag);font-weight:700;border-left-color:var(--ag)}
.lnav-i .ic{font-size:13px;width:16px;text-align:center}
.lnav-ft{margin-top:auto;padding:8px 12px;font-size:9px;color:var(--t3);border-top:1px solid var(--b)}
/* Filters */
.flt-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.flt-row label{font-size:10px;color:var(--t2);font-weight:600}
.flt-row select,.flt-row input{padding:3px 8px;border:1px solid var(--b);border-radius:3px;font-size:11px;font-family:var(--f)}
.flt-btn{padding:3px 10px;border:1px solid var(--b);border-radius:3px;font-size:10px;font-weight:600;cursor:pointer;font-family:var(--f);background:var(--w)}
.flt-btn.a{background:var(--ag);color:#fff;border-color:var(--ag)}
.flt-btn:hover:not(.a){background:#f0f0f0}
/* KPI row */
.kpi-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpi-box{background:var(--w);border:1px solid var(--b);border-radius:4px;padding:10px 14px;flex:1;min-width:120px;border-left:3px solid var(--ag)}
.kpi-n{font-size:22px;font-weight:700;color:var(--ag)}
.kpi-l{font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;
const API="https://mcp-sf-provisioning-462dd29c2455.herokuapp.com/api/snowflake";
const fmt=v=>{if(v==null)return"—";if(typeof v==="number")return v>=1e6?`R$ ${(v/1e6).toFixed(2)}M`:v>=1e3?`R$ ${(v/1e3).toFixed(0)}K`:`R$ ${v.toLocaleString("pt-BR")}`;return v};
const fS=v=>v>=1e6?`${(v/1e6).toFixed(1)}M`:v>=1e3?`${(v/1e3).toFixed(0)}K`:v;
const dt=s=>s?new Date(s).toLocaleDateString("pt-BR"):"—";

function App(){
  const [nav,setNav]=useState("cliente");
  const [tab,setTab]=useState("contratos");
  const [loading,setLoading]=useState(true);
  const [leg,setLeg]=useState({a:[],c:[],l:[],o:[]});
  const [crm,setCrm]=useState({a:[],c:[],l:[],o:[]});
  const [ov,setOv]=useState(null);
  const [sel,setSel]=useState(null);
  const [selT,setSelT]=useState(null);
  const [selClient,setSelClient]=useState(null);
  const [slog,setSlog]=useState([]);
  const [flt,setFlt]=useState("TODOS");

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const ex=async sql=>{const r=await fetch(API+"/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sql})});const d=await r.json();return d.status==="ok"?d.data:[]};
      const o=await fetch(API+"/overview").then(r=>r.json());
      const [la,lc,ll,lo,ca,cc,cl,co]=await Promise.all([
        ex("SELECT * FROM LEGACY_ACCOUNTS ORDER BY NAME"),ex("SELECT * FROM LEGACY_CONTACTS ORDER BY LAST_NAME"),
        ex("SELECT * FROM LEGACY_LEADS ORDER BY SCORE DESC"),ex("SELECT * FROM LEGACY_OPPORTUNITIES ORDER BY AMOUNT DESC"),
        ex("SELECT * FROM CRM_ACCOUNTS ORDER BY NAME"),ex("SELECT * FROM CRM_CONTACTS LIMIT 30"),
        ex("SELECT * FROM CRM_LEADS LIMIT 20"),ex("SELECT * FROM CRM_OPPORTUNITIES ORDER BY AMOUNT DESC")]);
      setLeg({a:la,c:lc,l:ll,o:lo});setCrm({a:ca,c:cc,l:cl,o:co});setOv(o.data||o);
      if(la.length>0)setSelClient(la[0]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[]);
  useEffect(()=>{load()},[load]);

  const doSync=(rec,dir)=>{const e={time:new Date().toLocaleTimeString("pt-BR"),dir,name:rec.NAME||`${rec.FIRST_NAME} ${rec.LAST_NAME}`,id:rec.LEGACY_ID||rec.SF_ID};setSlog(p=>[e,...p].slice(0,20));setSel(null)};

  const allA=useMemo(()=>{const it=[];leg.a.forEach(a=>it.push({...a,_o:"LEGACY",_s:a.SYNC_STATUS,_id:a.LEGACY_ID}));crm.a.forEach(a=>{if(!it.find(x=>x.SF_ID===a.SF_ID))it.push({...a,_o:"SF",_s:"SYNCED",_id:a.SF_ID})});return flt==="TODOS"?it:flt==="LEGACY"?it.filter(i=>i._o==="LEGACY"):it.filter(i=>i._o==="SF")},[leg.a,crm.a,flt]);
  const allL=useMemo(()=>{const it=[];leg.l.forEach(l=>it.push({...l,_o:"LEGACY",_s:l.SYNC_STATUS,_id:l.LEGACY_ID}));crm.l.forEach(l=>{if(!it.find(x=>x.SF_ID===l.SF_ID))it.push({...l,_o:"SF",_s:"SYNCED",_id:l.SF_ID})});return flt==="TODOS"?it:flt==="LEGACY"?it.filter(i=>i._o==="LEGACY"):it.filter(i=>i._o==="SF")},[leg.l,crm.l,flt]);
  const allO=useMemo(()=>{const it=[];leg.o.forEach(o=>it.push({...o,_o:"LEGACY",_s:o.SYNC_STATUS,_id:o.LEGACY_ID}));crm.o.forEach(o=>{if(!it.find(x=>x.SF_ID===o.SF_ID))it.push({...o,_o:"SF",_s:"SYNCED",_id:o.SF_ID})});return flt==="TODOS"?it:flt==="LEGACY"?it.filter(i=>i._o==="LEGACY"):it.filter(i=>i._o==="SF")},[leg.o,crm.o,flt]);

  const navItems=[{id:"cliente",i:"👤",l:"Dados do Cliente"},{id:"contratos",i:"📋",l:"Contratos"},{id:"servicos",i:"🔧",l:"Serviços"},{id:"leads",i:"📊",l:"Leads"},{id:"oportunidades",i:"💰",l:"Oportunidades"},{id:"faturamento",i:"💳",l:"Faturamento"},{id:"sync",i:"🔄",l:"Dupla Convivência"}];

  const stMap=s=>s==="SYNCED"?"st-sync":s==="PENDING"?"st-pend":"st-nosync";
  const stLabel=s=>s==="SYNCED"?"Sincronizado":s==="PENDING"?"Pendente":"Não Sync";
  const stStatus=s=>s==="ATIVO"||s==="Active"?"st-ativo":s==="CANCELADO"||s==="Cancelled"?"st-cancel":s==="AGUARDANDO ATIVACAO"?"st-aguard":s==="MIGRADO"?"st-migrado":"st-aberto";

  // Client for detail view
  const cl=selClient||leg.a[0]||{};
  const clContacts=(leg.c||[]).filter(c=>c.ACCOUNT_LEGACY_ID===cl.LEGACY_ID);
  const clOpps=(leg.o||[]).filter(o=>o.ACCOUNT_LEGACY_ID===cl.LEGACY_ID);

  // Product lines (simulated from opp data)
  const productLines=useMemo(()=>{
    const lines=[];
    allO.forEach(o=>{
      lines.push({
        status:o.STAGE==="Closed Won"?"ATIVO":o.STAGE==="Closed Lost"?"CANCELADO":o.PROBABILITY>=50?"ATIVO":"AGUARDANDO ATIVACAO",
        contrato:o._id,linhaP:o.PRODUCT==="MPLS Dedicado"||o.PRODUCT==="Fiber Backbone"?"COMUNICACAO DADOS":o.PRODUCT==="UCaaS"?"TELEFONIA FIXA":"TELEFONIA MOVEL",
        identificador:o._id?.replace(/[A-Z-]/g,"").slice(0,8)||"—",
        nome:o.NAME,endereco:o._o==="LEGACY"?"—":"—",situacao:o._o==="LEGACY"?"Legacy":"Salesforce",
        sync:o._s,origin:o._o,raw:o
      });
    });
    return lines.slice(0,12);
  },[allO]);

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      {/* ═══ HEADER ═══ */}
      <div className="hdr">
        <div className="hdr-l">
          <svg width="140" height="38" viewBox="0 0 140 38" xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}>
            <text x="0" y="26" fontFamily="Arial Black, Arial, sans-serif" fontWeight="900" fontSize="28" fill="#ffffff" letterSpacing="-0.5">Algar</text>
            <polygon points="97,8 110,16.5 97,25" fill="#ffffff"/>
            <polygon points="110,8 123,16.5 110,25" fill="#ffffff"/>
            <text x="62" y="36" fontFamily="Arial, sans-serif" fontWeight="600" fontSize="12" fill="rgba(255,255,255,0.85)" letterSpacing="1">Telecom</text>
          </svg>
        </div>
        <div className="hdr-r">
          <div className="hdr-av"><span className="hdr-av-i">👤</span></div>
          <span className="hdr-name">ADMINISTRADOR EVER I9</span>
          <button className="hdr-close" onClick={()=>window.parent.postMessage("crm-closed","*")}>✕ Fechar</button>
        </div>
      </div>

      {/* ═══ SUBMENU ═══ */}
      <div className="submenu">
        <a href="#" onClick={e=>e.preventDefault()}>▼ Telefones Úteis</a>
        <a href="#" onClick={e=>e.preventDefault()}>▼ Links Úteis</a>
        <a href="#" onClick={e=>e.preventDefault()}>▼ Quadro de Avisos</a>
        <span className="sep">|</span>
        <span style={{color:"var(--t3)"}}>Dupla Convivência:</span>
        <span className="dual-badge dual-lg">▣ Legacy</span>
        <span style={{color:"var(--ag)",fontWeight:700}}>⇄</span>
        <span className="dual-badge dual-sf">☁ Salesforce</span>
        <span className="dual-badge dual-snk">❄ Snowflake</span>
      </div>

      {/* ═══ BODY ═══ */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* LEFT NAV */}
        <div className="left-nav">
          <div className="lnav-h">Navegação</div>
          {navItems.map(n=><div key={n.id} className={`lnav-i${nav===n.id?" a":""}`} onClick={()=>setNav(n.id)}><span className="ic">{n.i}</span>{n.l}</div>)}
          <div className="lnav-ft">
            <div>Snowflake: rajlbkg-yk87012</div>
            <div>Org: DevHub Hyperforce</div>
            <div style={{color:"var(--ok)"}}>● Online</div>
          </div>
        </div>

        {/* MAIN CONTENT */}
        <div className="content">
          {loading?(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"50vh",gap:12}}>
              <div style={{width:32,height:32,border:"3px solid var(--b)",borderTopColor:"var(--ag)",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
              <div style={{color:"var(--t3)",fontSize:11}}>Carregando dados Snowflake + Salesforce...</div>
              <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
            </div>
          ):(
          <>
          {/* ═══ DADOS DO CLIENTE ═══ */}
          {nav==="cliente"&&<div>
            <div className="sec-title">Dados do Cliente</div>

            {/* Client selector */}
            <div className="flt-row">
              <label>Cliente:</label>
              <select value={cl.LEGACY_ID||""} onChange={e=>{const f=leg.a.find(a=>a.LEGACY_ID===e.target.value);if(f)setSelClient(f)}} style={{minWidth:200}}>
                {leg.a.map(a=><option key={a.LEGACY_ID} value={a.LEGACY_ID}>{a.NAME}</option>)}
              </select>
              <span className={`st ${stMap(cl.SYNC_STATUS)}`}>{stLabel(cl.SYNC_STATUS)}</span>
            </div>

            {/* Data fields - matching the real CRM layout */}
            <div style={{background:"var(--w)",border:"1px solid var(--b)",borderRadius:3,padding:10,marginBottom:12}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"2px 20px"}}>
                <div className="data-row"><span className="data-lbl">Nome do Cliente:</span><span className="data-val">{cl.NAME||"—"}</span></div>
                <div className="data-row"><span className="data-lbl">Programa Ligação:</span><span className="data-val">—</span></div>
                <div className="data-row" style={{gridRow:"span 2"}}/>
                <div className="data-row"><span className="data-lbl">CPF/CNPJ:</span><span className="data-val-link">{cl.CNPJ||"—"}</span></div>
                <div className="data-row"><span className="data-lbl">Tipo de Cliente:</span><span className="data-val">{cl.TYPE==="Enterprise"?"PESSOA JURIDICA":"PESSOA FISICA"}</span></div>
                <div className="data-row"><span className="data-lbl">Segmento:</span><span className="data-val">{cl.SEGMENT||"CORPORATIVO"}</span></div>
                <div className="data-row"><span className="data-lbl">Grupo de Relacionamento:</span><span className="data-val">—</span></div>
                <div className="data-row"><span className="data-lbl">Sub Segmento:</span><span className="data-val">{cl.TYPE==="Enterprise"?"PREMIUM":"GOLD"}</span></div>
                <div className="data-row"><span className="data-lbl">Senha:</span><span className="data-val">—</span></div>
                <div className="data-row"><span className="data-lbl">Situação:</span><span className="data-val" style={{color:"var(--ok)"}}>ATIVO</span></div>
                <div className="data-row"><span className="data-lbl">Telefone atual:</span><span className="data-val">(34) 99912-3456</span></div>
                <div className="data-row" style={{gridColumn:"1/-1"}}><span className="data-lbl">Subscrição (Contrato) atual:</span><span className="data-val">{cl.LEGACY_ID||"—"}</span></div>
                <div className="data-row" style={{gridColumn:"1/-1"}}><span className="data-lbl">Endereço:</span><span className="data-val">{cl.BILLING_CITY||"—"} - {cl.BILLING_STATE||"—"}</span></div>
              </div>
            </div>

            {/* Dual coexistence indicator */}
            <div className="dual-bar">
              <div className="dual-l">
                <span className="dual-badge dual-lg">▣ Legacy CRM</span>
                <span className="dual-arr">→</span>
                <span className="dual-badge dual-snk">❄ Snowflake</span>
                <span className="dual-arr">→</span>
                <span className="dual-badge dual-sf">☁ Salesforce</span>
              </div>
              <div>
                <span style={{fontSize:10,color:"var(--ok)",fontWeight:600}}>● SF_ID: {cl.SF_ID||"Não sincronizado"}</span>
              </div>
            </div>

            {/* Informações tabs */}
            <div style={{fontSize:13,fontWeight:700,color:"var(--link)",marginBottom:6}}>Informações</div>
            <div className="info-tabs">
              {[{id:"contratos",i:"📋",l:"Cliente"},{id:"ctab",i:"📄",l:"Contratos"},{id:"servicos",i:"🔧",l:"Serviços"},{id:"fat",i:"💳",l:"Faturamento-Cobrança"},{id:"pre",i:"📱",l:"Pré-Pago"}].map(t=>
                <div key={t.id} className={`itab${tab===t.id?" a":""}`} onClick={()=>setTab(t.id)}>
                  <span className="itab-icon">{t.i}</span>{t.l}
                </div>
              )}
            </div>

            <div className="tcard">
              {tab==="contratos"&&<div>
                <div className="tcard-h">Atendimentos em Aberto - Cliente</div>
                <div className="stat-line">
                  <span className="stat-g">+ Casos: 0</span>
                  <span className="stat-r">— Ordens de Serviço: {clOpps.length}</span>
                </div>
                <div className="tcard-sub">{clOpps.length} items found, displaying all items.</div>
                <table className="ctbl"><thead><tr><th>Protocolo</th><th>Telefone</th><th>Linha Produto</th><th>Subscrição</th><th>Serviço</th><th>Status</th><th>Data Solicitação</th><th>Origem</th><th>Sync</th></tr></thead>
                <tbody>{clOpps.length>0?clOpps.map((o,i)=><tr key={i}>
                  <td className="link">{o.LEGACY_ID}</td><td>(34) 99912-3456</td><td>{o.PRODUCT}</td><td>{o.LEGACY_ID}</td><td>{o.NAME}</td>
                  <td><span className="st st-aberto">ABERTO</span></td><td>{dt(o.CLOSE_DATE)}</td>
                  <td><span className="dual-badge dual-lg" style={{fontSize:9}}>Legacy</span></td>
                  <td><span className={`st ${stMap(o.SYNC_STATUS)}`} style={{fontSize:9}}>{stLabel(o.SYNC_STATUS)}</span></td>
                </tr>):<tr><td colSpan={9} style={{textAlign:"center",padding:12,color:"var(--t3)"}}>Nenhum atendimento em aberto</td></tr>}</tbody></table>

                <div style={{marginTop:12}}>
                  <div className="stat-line"><span className="stat-g">+ Oportunidades em Aberto: {clOpps.filter(o=>o.STAGE!=="Closed Won").length}</span></div>
                  <div className="stat-line"><span className="stat-g">+ Pedidos de Venda em Aberto: 0</span></div>
                  <div className="stat-line"><span className="stat-g">+ Faturas Vencidas: 0</span></div>
                </div>
              </div>}
              {tab==="ctab"&&<div>
                <div className="tcard-h">Contratos do Cliente</div>
                <table className="ctbl"><thead><tr><th>Contrato</th><th>Status</th><th>Valor</th><th>Início</th><th>Término</th></tr></thead>
                <tbody>{(ov?.contracts||[]).map((c,i)=><tr key={i}><td className="link">{c.NAME}</td><td><span className={`st ${c.STATUS==="Active"?"st-ativo":"st-aguard"}`}>{c.STATUS}</span></td><td>{fmt(c.VALUE)}</td><td>{dt(c.START_DATE)}</td><td>{dt(c.END_DATE)}</td></tr>)}</tbody></table>
              </div>}
              {tab==="servicos"&&<div><div className="tcard-h">Serviços Ativos</div><p style={{color:"var(--t3)"}}>Serviços disponíveis via integração Salesforce.</p></div>}
              {tab==="fat"&&<div><div className="tcard-h">Faturamento e Cobrança</div><p style={{color:"var(--t3)"}}>Dados de faturamento via ERP TOTVS / Snowflake.</p></div>}
              {tab==="pre"&&<div><div className="tcard-h">Pré-Pago</div><p style={{color:"var(--t3)"}}>Informações de pré-pago não disponíveis.</p></div>}
            </div>

            {/* Products table - matching the real CRM */}
            <div className="flt-row">
              <label>Identificador</label><input style={{width:80}}/>
              <label>Circuito</label><input style={{width:80}}/>
              <label>Nº Vinculado</label><input style={{width:80}}/>
              <label>Por Status</label>
              <select><option>TODOS</option><option>ATIVO</option><option>CANCELADO</option><option>MIGRADO</option></select>
            </div>

            <table className="ptbl"><thead><tr><th>Status ▲</th><th>Contratos</th><th>Linha de Produtos</th><th>Identificador</th><th>Nome do Produto</th><th>Endereço</th><th>Origem</th><th>Sync</th><th>Ações</th></tr></thead>
            <tbody>{productLines.filter(p=>p.raw.ACCOUNT_LEGACY_ID===cl.LEGACY_ID||allO.length<5).slice(0,8).map((p,i)=><tr key={i}>
              <td><span className={`st ${stStatus(p.status)}`}>{p.status}</span></td>
              <td className="link">{p.contrato}</td><td>{p.linhaP}</td><td>{p.identificador}</td>
              <td>{p.nome}</td><td>{p.endereco}</td>
              <td><span className={`dual-badge ${p.origin==="LEGACY"?"dual-lg":"dual-sf"}`} style={{fontSize:9}}>{p.origin==="LEGACY"?"Legacy":"Salesforce"}</span></td>
              <td><span className={`st ${stMap(p.sync)}`} style={{fontSize:9}}>{stLabel(p.sync)}</span></td>
              <td><a href="#" onClick={e=>{e.preventDefault();setSel(p.raw);setSelT("opp")}} style={{fontSize:10}}>Interação</a> <a href="#" onClick={e=>e.preventDefault()} style={{fontSize:10}}>Serviços</a></td>
            </tr>)}</tbody></table>
          </div>}

          {/* ═══ CONTRATOS ═══ */}
          {nav==="contratos"&&<div>
            <div className="sec-title">Contratos</div>
            <table className="ctbl"><thead><tr><th>ID</th><th>Contrato</th><th>Conta</th><th>Status</th><th>Valor</th><th>Início</th><th>Término</th></tr></thead>
            <tbody>{(ov?.contracts||[]).map((r,i)=><tr key={i}><td style={{fontFamily:"monospace",fontSize:10}}>{r.ID}</td><td className="link">{r.NAME}</td><td>{r.ACCOUNT_ID}</td><td><span className={`st ${r.STATUS==="Active"?"st-ativo":"st-aguard"}`}>{r.STATUS}</span></td><td style={{fontWeight:700}}>{fmt(r.VALUE)}</td><td>{dt(r.START_DATE)}</td><td>{dt(r.END_DATE)}</td></tr>)}</tbody></table>
          </div>}

          {/* ═══ SERVIÇOS (Accounts) ═══ */}
          {nav==="servicos"&&<div>
            <div className="sec-title">Contas — Visão Consolidada</div>
            <div className="flt-row">{[{id:"TODOS",l:"Todos"},{id:"LEGACY",l:"Legacy"},{id:"SF",l:"Salesforce"}].map(f=><button key={f.id} className={`flt-btn${flt===f.id?" a":""}`} onClick={()=>setFlt(f.id)}>{f.l}</button>)}</div>
            <div className="kpi-row">
              <div className="kpi-box"><div className="kpi-n">{leg.a.length}</div><div className="kpi-l">Legacy</div></div>
              <div className="kpi-box" style={{borderLeftColor:"#1565c0"}}><div className="kpi-n" style={{color:"#1565c0"}}>{crm.a.length}</div><div className="kpi-l">Salesforce</div></div>
              <div className="kpi-box" style={{borderLeftColor:"var(--ok)"}}><div className="kpi-n" style={{color:"var(--ok)"}}>{leg.a.filter(a=>a.SYNC_STATUS==="SYNCED").length}</div><div className="kpi-l">Sincronizadas</div></div>
            </div>
            <table className="ctbl"><thead><tr><th>Origem</th><th>ID</th><th>Nome</th><th>CNPJ</th><th>Indústria</th><th>Cidade/UF</th><th>Receita</th><th>Sync</th></tr></thead>
            <tbody>{allA.map((r,i)=><tr key={i} onClick={()=>{setSel(r);setSelT("acc")}}>
              <td><span className={`dual-badge ${r._o==="LEGACY"?"dual-lg":"dual-sf"}`} style={{fontSize:9}}>{r._o==="LEGACY"?"▣ Legacy":"☁ SF"}</span></td>
              <td style={{fontSize:10,fontFamily:"monospace",color:"var(--t3)"}}>{r._id}</td>
              <td className="link" style={{fontWeight:700}}>{r.NAME}</td><td>{r.CNPJ||"—"}</td><td>{r.INDUSTRY||"—"}</td>
              <td>{r.BILLING_CITY||r.CITY||"—"}/{r.BILLING_STATE||r.STATE||""}</td>
              <td style={{fontWeight:700}}>{fmt(r.ANNUAL_REVENUE||r.REVENUE)}</td>
              <td><span className={`st ${stMap(r._s)}`}>{stLabel(r._s)}</span></td>
            </tr>)}</tbody></table>
          </div>}

          {/* ═══ LEADS ═══ */}
          {nav==="leads"&&<div>
            <div className="sec-title">Leads</div>
            <div className="flt-row">{[{id:"TODOS",l:"Todos"},{id:"LEGACY",l:"Legacy"},{id:"SF",l:"Salesforce"}].map(f=><button key={f.id} className={`flt-btn${flt===f.id?" a":""}`} onClick={()=>setFlt(f.id)}>{f.l}</button>)}</div>
            <div className="kpi-row">
              <div className="kpi-box"><div className="kpi-n">{allL.filter(l=>l.RATING==="Hot").length}</div><div className="kpi-l">Hot</div></div>
              <div className="kpi-box" style={{borderLeftColor:"var(--warn)"}}><div className="kpi-n" style={{color:"var(--warn)"}}>{allL.filter(l=>l.RATING==="Warm").length}</div><div className="kpi-l">Warm</div></div>
              <div className="kpi-box" style={{borderLeftColor:"#1565c0"}}><div className="kpi-n" style={{color:"#1565c0"}}>{allL.filter(l=>l.RATING==="Cold").length}</div><div className="kpi-l">Cold</div></div>
            </div>
            <table className="ctbl"><thead><tr><th>Origem</th><th>Nome</th><th>Empresa</th><th>Cargo</th><th>Status</th><th>Rating</th><th>Score</th><th>Canal</th><th>Sync</th></tr></thead>
            <tbody>{allL.map((r,i)=><tr key={i} onClick={()=>{setSel(r);setSelT("lead")}}>
              <td><span className={`dual-badge ${r._o==="LEGACY"?"dual-lg":"dual-sf"}`} style={{fontSize:9}}>{r._o==="LEGACY"?"▣ Legacy":"☁ SF"}</span></td>
              <td className="link" style={{fontWeight:700}}>{r.FIRST_NAME} {r.LAST_NAME}</td><td>{r.COMPANY||"—"}</td><td>{r.TITLE||"—"}</td>
              <td><span className={`st ${r.STATUS==="Open"?"st-aberto":r.STATUS==="Working"?"st-aguard":"st-migrado"}`}>{r.STATUS||"—"}</span></td>
              <td style={{color:r.RATING==="Hot"?"var(--err)":r.RATING==="Warm"?"var(--warn)":"#1565c0",fontWeight:700}}>{r.RATING||"—"}</td>
              <td>{r.SCORE||"—"}</td><td>{r.CHANNEL||"—"}</td>
              <td><span className={`st ${stMap(r._s)}`}>{stLabel(r._s)}</span></td>
            </tr>)}</tbody></table>
          </div>}

          {/* ═══ OPORTUNIDADES ═══ */}
          {nav==="oportunidades"&&<div>
            <div className="sec-title">Oportunidades</div>
            <div className="flt-row">{[{id:"TODOS",l:"Todos"},{id:"LEGACY",l:"Legacy"},{id:"SF",l:"Salesforce"}].map(f=><button key={f.id} className={`flt-btn${flt===f.id?" a":""}`} onClick={()=>setFlt(f.id)}>{f.l}</button>)}</div>
            <div className="kpi-row">
              <div className="kpi-box"><div className="kpi-n">R${fS(allO.filter(o=>o.STAGE!=="Closed Won"&&o.STAGE!=="Closed Lost").reduce((a,o)=>a+(o.AMOUNT||0),0))}</div><div className="kpi-l">Pipeline Aberto</div></div>
              <div className="kpi-box" style={{borderLeftColor:"var(--ok)"}}><div className="kpi-n" style={{color:"var(--ok)"}}>{allO.filter(o=>o.STAGE==="Closed Won").length}</div><div className="kpi-l">Won</div></div>
              <div className="kpi-box" style={{borderLeftColor:"var(--warn)"}}><div className="kpi-n" style={{color:"var(--warn)"}}>{allO.length}</div><div className="kpi-l">Total</div></div>
            </div>
            <table className="ctbl"><thead><tr><th>Origem</th><th>Nome</th><th>Produto</th><th>Estágio</th><th>Valor</th><th>Prob</th><th>Fechamento</th><th>Tipo</th><th>Sync</th></tr></thead>
            <tbody>{allO.map((r,i)=><tr key={i} onClick={()=>{setSel(r);setSelT("opp")}}>
              <td><span className={`dual-badge ${r._o==="LEGACY"?"dual-lg":"dual-sf"}`} style={{fontSize:9}}>{r._o==="LEGACY"?"▣ Legacy":"☁ SF"}</span></td>
              <td className="link" style={{fontWeight:700}}>{r.NAME}</td><td>{r.PRODUCT||"—"}</td>
              <td><span className={`st ${r.STAGE==="Closed Won"?"st-ativo":r.STAGE==="Closed Lost"?"st-cancel":"st-aberto"}`}>{r.STAGE}</span></td>
              <td style={{fontWeight:700}}>{fmt(r.AMOUNT)}</td>
              <td>{r.PROBABILITY||0}%</td><td>{dt(r.CLOSE_DATE)}</td><td>{r.TYPE||"—"}</td>
              <td><span className={`st ${stMap(r._s)}`}>{stLabel(r._s)}</span></td>
            </tr>)}</tbody></table>
          </div>}

          {/* ═══ FATURAMENTO ═══ */}
          {nav==="faturamento"&&<div><div className="sec-title">Faturamento e Cobrança</div><p style={{color:"var(--t3)"}}>Dados de faturamento disponíveis via integração ERP TOTVS / Snowflake.</p></div>}

          {/* ═══ SYNC CENTER ═══ */}
          {nav==="sync"&&<div>
            <div className="sec-title">Dupla Convivência — Centro de Sincronização</div>
            <div className="dual-bar">
              <div className="dual-l">
                <span className="dual-badge dual-lg">▣ Legacy CRM ({leg.a.length+leg.l.length+leg.o.length})</span>
                <span className="dual-arr">⇄</span>
                <span className="dual-badge dual-snk">❄ Snowflake</span>
                <span className="dual-arr">⇄</span>
                <span className="dual-badge dual-sf">☁ Salesforce ({crm.a.length+crm.l.length+crm.o.length})</span>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div style={{background:"var(--w)",border:"1px solid var(--b)",borderRadius:4,padding:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"#e65100",marginBottom:8}}>▣ LEGACY → ☁ SALESFORCE</div>
                {[{l:"Contas",sy:leg.a.filter(a=>a.SYNC_STATUS==="SYNCED").length,t:leg.a.length},{l:"Contatos",sy:leg.c.filter(c=>c.SYNC_STATUS==="SYNCED").length,t:leg.c.length},{l:"Leads",sy:leg.l.filter(l=>l.SYNC_STATUS==="SYNCED").length,t:leg.l.length},{l:"Oportunidades",sy:leg.o.filter(o=>o.SYNC_STATUS==="SYNCED").length,t:leg.o.length}].map((it,i)=>
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f0f0f0",fontSize:11}}>
                    <span>{it.l}</span>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <div style={{width:60,height:5,borderRadius:3,background:"#e0e0e0"}}><div style={{width:`${it.t?(it.sy/it.t)*100:0}%`,height:"100%",borderRadius:3,background:"var(--ok)"}}/></div>
                      <span style={{fontSize:10,color:"var(--ok)",fontWeight:600}}>{it.sy}/{it.t}</span>
                    </div>
                  </div>
                )}
              </div>
              <div style={{background:"var(--w)",border:"1px solid var(--b)",borderRadius:4,padding:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"#1565c0",marginBottom:8}}>☁ SALESFORCE → ▣ LEGACY</div>
                {[{l:"Contas",t:crm.a.length},{l:"Contatos",t:crm.c.length},{l:"Leads",t:crm.l.length},{l:"Oportunidades",t:crm.o.length}].map((it,i)=>
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f0f0f0",fontSize:11}}>
                    <span>{it.l}</span><span style={{fontSize:10,color:"#1565c0",fontWeight:600}}>{it.t} registros</span>
                  </div>
                )}
              </div>
            </div>
            {/* Sync Log */}
            {slog.length>0&&<div style={{background:"var(--w)",border:"1px solid var(--b)",borderRadius:4,padding:12}}>
              <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Log de Sincronizações</div>
              {slog.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid #f0f0f0",fontSize:11}}>
                <span style={{fontFamily:"monospace",color:"var(--t3)",width:55}}>{s.time}</span>
                <span style={{fontFamily:"monospace",color:"var(--t3)",width:60}}>{s.id}</span>
                <span style={{flex:1}}>{s.name}</span>
                <span className={`dual-badge ${s.dir==="TO_SF"?"dual-sf":"dual-lg"}`} style={{fontSize:9}}>{s.dir==="TO_SF"?"→ Salesforce":"→ Legacy"}</span>
                <span style={{color:"var(--ok)",fontSize:10}}>● OK</span>
              </div>)}
            </div>}
          </div>}
          </>)}
        </div>
      </div>

      {/* ═══ FOOTER ═══ */}
      <div className="ftr">
        <span>© 2015 Algar CRM — Emulador Dupla Convivência v1.0</span>
        <button className="ftr-btn" onClick={load}>AlgarCRM Mob</button>
      </div>

      {/* ═══ DETAIL MODAL ═══ */}
      {sel&&<div className="modal-bg" onClick={()=>setSel(null)}>
        <div className="modal" onClick={e=>e.stopPropagation()}>
          <div className="modal-hd">
            <h3>{sel.NAME||`${sel.FIRST_NAME} ${sel.LAST_NAME}`}</h3>
            <button style={{background:"none",border:"none",color:"#fff",fontSize:16,cursor:"pointer"}} onClick={()=>setSel(null)}>✕</button>
          </div>
          <div className="modal-bd">
            <div style={{display:"flex",gap:6,marginBottom:12}}>
              <span className={`dual-badge ${sel._o==="LEGACY"?"dual-lg":"dual-sf"}`}>{sel._o==="LEGACY"?"▣ Legacy CRM":"☁ Salesforce"}</span>
              <span className={`st ${stMap(sel._s)}`}>{stLabel(sel._s)}</span>
            </div>
            <div className="modal-gd">
              {(selT==="acc"?[{l:"ID",v:sel._id},{l:"CNPJ",v:sel.CNPJ},{l:"Indústria",v:sel.INDUSTRY},{l:"Tipo",v:sel.TYPE},{l:"Cidade",v:`${sel.BILLING_CITY||sel.CITY||"—"}/${sel.BILLING_STATE||sel.STATE||""}`},{l:"Receita",v:fmt(sel.ANNUAL_REVENUE||sel.REVENUE)},{l:"Segmento",v:sel.SEGMENT},{l:"Sistema",v:sel.LEGACY_SYSTEM},{l:"SF_ID",v:sel.SF_ID},{l:"Última Sync",v:dt(sel.LAST_SYNC)}]
              :selT==="lead"?[{l:"ID",v:sel._id},{l:"Email",v:sel.EMAIL},{l:"Telefone",v:sel.PHONE},{l:"Empresa",v:sel.COMPANY},{l:"Cargo",v:sel.TITLE},{l:"Status",v:sel.STATUS},{l:"Rating",v:sel.RATING},{l:"Score",v:sel.SCORE},{l:"Canal",v:sel.CHANNEL},{l:"SF_ID",v:sel.SF_ID}]
              :[{l:"ID",v:sel._id},{l:"Produto",v:sel.PRODUCT},{l:"Estágio",v:sel.STAGE},{l:"Valor",v:fmt(sel.AMOUNT)},{l:"Probabilidade",v:`${sel.PROBABILITY||0}%`},{l:"Tipo",v:sel.TYPE},{l:"Fechamento",v:dt(sel.CLOSE_DATE)},{l:"SF_ID",v:sel.SF_ID},{l:"Sistema",v:sel.LEGACY_SYSTEM},{l:"Última Sync",v:dt(sel.LAST_SYNC)}]
              ).map((f,i)=><div key={i}><div className="modal-fl">{f.l}</div><div className="modal-fv">{f.v||"—"}</div></div>)}
            </div>
          </div>
          <div className="modal-ft">
            <button className="mbtn mbtn-sf" onClick={()=>doSync(sel,"TO_SF")}>☁ Enviar para Salesforce</button>
            <button className="mbtn mbtn-lg" onClick={()=>doSync(sel,"TO_LEGACY")}>▣ Enviar para Legacy CRM</button>
            <button className="mbtn mbtn-x" onClick={()=>setSel(null)}>Fechar</button>
          </div>
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
