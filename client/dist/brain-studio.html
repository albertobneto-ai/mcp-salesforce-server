/* Storage - uses localStorage for standalone page */
function load(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null}catch{return null}}
function save(key,data){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){console.error(e)}}

/* Markdown-lite renderer */
function renderMd(text,notes){
  if(!text)return"";
  let html=text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/^### (.+)$/gm,'<h4 style="color:#d4d4d8;margin:12px 0 4px;font-size:14px">$1</h4>')
    .replace(/^## (.+)$/gm,'<h3 style="color:#e4e4e7;margin:14px 0 6px;font-size:15px">$1</h3>')
    .replace(/^# (.+)$/gm,'<h2 style="color:#fafafa;margin:16px 0 8px;font-size:17px">$1</h2>')
    .replace(/\*\*(.+?)\*\*/g,'<strong style="color:#e4e4e7">$1</strong>')
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/`(.+?)`/g,'<code style="background:#1a1a1a;padding:1px 5px;border-radius:3px;font-size:12px;color:#a1a1aa">$1</code>')
    .replace(/^- (.+)$/gm,'<div style="padding-left:12px">\u2022 $1</div>')
    .replace(/\[\[(.+?)\]\]/g,(_,name)=>{
      const found=notes&&notes.find(n=>n.title.toLowerCase()===name.toLowerCase());
      return found?'<span style="color:#38bdf8;cursor:pointer;text-decoration:underline" data-link="'+found.id+'">'+name+'</span>':'<span style="color:#ef4444;opacity:0.7">'+name+'</span>';
    });
  return html.replace(/\n/g,"<br/>");
}

const S={
  input:{width:"100%",background:"#000",border:"1px solid #27272a",borderRadius:"8px",padding:"10px 12px",color:"#d4d4d8",fontSize:"14px",outline:"none",boxSizing:"border-box"},
  btn:{borderRadius:"8px",padding:"9px 18px",fontSize:"13px",fontWeight:"600",cursor:"pointer",border:"none",letterSpacing:"0.01em"},
};

function Chip({label,count,active,onClick,color="#fafafa"}){
  return h("button",{onClick,style:{background:active?color+"1a":"transparent",border:"1px solid "+(active?color+"44":"#1f1f1f"),color:active?color:"#52525b",borderRadius:"20px",padding:"4px 12px",fontSize:"11px",fontWeight:"500",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px"}},
    label," ",h("span",{style:{background:active?color+"22":"#18181b",color:active?color:"#52525b",borderRadius:"10px",padding:"1px 6px",fontSize:"10px",fontWeight:"600"}},count)
  );
}

function TagPill({tag,onClick,active}){
  return h("button",{onClick,style:{background:active?"#38bdf822":"#0a0a0a",border:"1px solid "+(active?"#38bdf844":"#1f1f1f"),color:active?"#38bdf8":"#52525b",borderRadius:"4px",padding:"2px 8px",fontSize:"10px",cursor:"pointer",fontWeight:"500"}},"#"+tag);
}

function Label({children}){return h("div",{style:{fontSize:"11px",color:"#52525b",marginBottom:"3px",fontWeight:"500"}},children)}

function Btn({children,onClick,ghost}){
  return h("button",{onClick,style:{...S.btn,background:ghost?"transparent":"#fafafa",color:ghost?"#71717a":"#000",border:ghost?"1px solid #27272a":"none"}},children);
}

function SmBtn({children,onClick,danger,title}){
  return h("button",{onClick,title,style:{background:"transparent",border:"1px solid "+(danger?"#7f1d1d":"#1f1f1f"),color:danger?"#ef4444":"#52525b",borderRadius:"6px",width:"28px",height:"28px",fontSize:"13px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},children);
}

function Empty({msg,icon,sub}){
  return h("div",{style:{textAlign:"center",padding:"60px",color:"#3f3f46"}},
    h("div",{style:{fontSize:"36px",marginBottom:"10px",opacity:0.4}},icon),
    h("div",{style:{fontSize:"14px"}},msg),
    sub&&h("div",{style:{fontSize:"12px",marginTop:"6px",color:"#27272a"}},sub)
  );
}

function InputField({value,onChange,placeholder,style:s,type,rows,autoFocus}){
  const props={value,onChange:e=>onChange(e.target.value),placeholder,style:{...S.input,...(s||{})},autoFocus};
  if(type==="date")props.type="date";
  if(rows)return h("textarea",{...props,rows,style:{...props.style,resize:"vertical"}});
  return h("input",props);
}

function SelectField({value,onChange,options,style:s}){
  return h("select",{value,onChange:e=>onChange(e.target.value),style:{...S.input,...(s||{})}},
    options.map(o=>h("option",{key:typeof o==="string"?o:o.value,value:typeof o==="string"?o:o.value},typeof o==="string"?o:o.label))
  );
}

/* ════ ATIVIDADES ════ */
function Atividades({tasks,setTasks}){
  const[filter,setFilter]=useState("Todas");
  const[showForm,setShowForm]=useState(false);
  const[editId,setEditId]=useState(null);
  const[confirmDel,setConfirmDel]=useState(null);
  const[form,setForm]=useState({title:"",description:"",priority:"media",status:"Pendente",dueDate:"",category:""});

  const resetForm=()=>{setForm({title:"",description:"",priority:"media",status:"Pendente",dueDate:"",category:""});setEditId(null);setShowForm(false)};

  const handleSave=()=>{
    if(!form.title.trim())return;
    const now=new Date().toISOString();
    if(editId){setTasks(tasks.map(t=>t.id===editId?{...t,...form,updatedAt:now}:t))}
    else{setTasks([{id:genId(),...form,createdAt:now,updatedAt:now},...tasks])}
    resetForm();
  };

  const handleEdit=t=>{setForm({title:t.title,description:t.description||"",priority:t.priority,status:t.status,dueDate:t.dueDate||"",category:t.category||""});setEditId(t.id);setShowForm(true)};
  const handleDelete=id=>{setTasks(tasks.filter(t=>t.id!==id));setConfirmDel(null)};
  const toggleStatus=id=>{setTasks(tasks.map(t=>{if(t.id!==id)return t;const i=STATUS_OPTIONS.indexOf(t.status);return{...t,status:STATUS_OPTIONS[(i+1)%STATUS_OPTIONS.length],updatedAt:new Date().toISOString()}}))};
  const filtered=filter==="Todas"?tasks:tasks.filter(t=>t.status===filter);
  const counts=STATUS_OPTIONS.reduce((a,s)=>({...a,[s]:tasks.filter(t=>t.status===s).length}),{});
  const overdue=(d,s)=>d&&s!=="Concluída"&&new Date(d+"T23:59:59")<new Date();

  return h("div",null,
    /* Toolbar */
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"10px"}},
      h("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}},
        h(Chip,{label:"Todas",count:tasks.length,active:filter==="Todas",onClick:()=>setFilter("Todas")}),
        STATUS_OPTIONS.map(s=>h(Chip,{key:s,label:s,count:counts[s]||0,active:filter===s,onClick:()=>setFilter(s),color:STATUS_COLORS[s]}))
      ),
      h("button",{onClick:()=>{resetForm();setShowForm(true)},style:{background:"#fafafa",color:"#000",border:"none",borderRadius:"8px",padding:"9px 18px",fontSize:"13px",fontWeight:"600",cursor:"pointer"}},"+ Nova")
    ),
    /* Form */
    showForm&&h("div",{style:{background:"#0a0a0a",border:"1px solid #1f1f1f",borderRadius:"12px",padding:"20px",marginBottom:"16px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}},
        h("span",{style:{fontSize:"14px",color:"#a1a1aa",fontWeight:"600"}},editId?"Editar":"Nova Atividade"),
        h("button",{onClick:resetForm,style:{background:"none",border:"none",color:"#52525b",cursor:"pointer",fontSize:"18px"}},"\u00d7")
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}},
        h("div",{style:{gridColumn:"1/-1"}},h(Label,null,"T\u00edtulo *"),h(InputField,{value:form.title,onChange:v=>setForm({...form,title:v}),placeholder:"O que precisa ser feito?",autoFocus:true})),
        h("div",{style:{gridColumn:"1/-1"}},h(Label,null,"Descri\u00e7\u00e3o"),h(InputField,{value:form.description,onChange:v=>setForm({...form,description:v}),placeholder:"Detalhes...",rows:2})),
        h("div",null,h(Label,null,"Prioridade"),h(SelectField,{value:form.priority,onChange:v=>setForm({...form,priority:v}),options:[{value:"alta",label:"Alta"},{value:"media",label:"M\u00e9dia"},{value:"baixa",label:"Baixa"}]})),
        h("div",null,h(Label,null,"Status"),h(SelectField,{value:form.status,onChange:v=>setForm({...form,status:v}),options:STATUS_OPTIONS})),
        h("div",null,h(Label,null,"Prazo"),h(InputField,{value:form.dueDate,onChange:v=>setForm({...form,dueDate:v}),type:"date"})),
        h("div",null,h(Label,null,"Categoria"),h(InputField,{value:form.category,onChange:v=>setForm({...form,category:v}),placeholder:"Algar, i9, MuleSoft..."}))
      ),
      h("div",{style:{display:"flex",gap:"8px",marginTop:"14px",justifyContent:"flex-end"}},
        h(Btn,{onClick:resetForm,ghost:true},"Cancelar"),
        h(Btn,{onClick:handleSave},editId?"Salvar":"Adicionar")
      )
    ),
    /* List */
    filtered.length===0
      ?h(Empty,{msg:tasks.length===0?"Nenhuma atividade cadastrada":"Nenhuma atividade neste filtro",icon:"\u2630"})
      :h("div",{style:{display:"flex",flexDirection:"column",gap:"4px"}},
        filtered.map(t=>{
          const done=t.status==="Conclu\u00edda";
          const late=overdue(t.dueDate,t.status);
          return h("div",{key:t.id,style:{background:"#0a0a0a",border:"1px solid "+(late?"#7f1d1d":"#141414"),borderRadius:"10px",padding:"12px 14px",display:"flex",alignItems:"flex-start",gap:"10px",opacity:done?0.45:1,transition:"opacity .2s"}},
            h("div",{onClick:()=>toggleStatus(t.id),style:{marginTop:"2px",width:"18px",height:"18px",borderRadius:"50%",border:"2px solid "+STATUS_COLORS[t.status],background:done?STATUS_COLORS[t.status]:"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:"#000",fontWeight:"700"}},done&&"\u2713"),
            h("div",{style:{flex:1,minWidth:0}},
              h("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}},
                h("span",{style:{fontSize:"14px",fontWeight:"600",color:done?"#52525b":"#fafafa",textDecoration:done?"line-through":"none"}},t.title),
                h("span",{style:{fontSize:"9px",padding:"2px 7px",borderRadius:"20px",background:PRIORITIES[t.priority]+"18",color:PRIORITIES[t.priority],fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.04em"}},t.priority),
                t.category&&h("span",{style:{fontSize:"9px",padding:"2px 7px",borderRadius:"20px",background:"#18181b",color:"#71717a",border:"1px solid #27272a"}},t.category)
              ),
              t.description&&h("div",{style:{fontSize:"12px",color:"#52525b",marginTop:"3px",lineHeight:"1.4"}},t.description),
              h("div",{style:{display:"flex",gap:"10px",marginTop:"5px",fontSize:"11px",color:"#3f3f46"}},
                h("span",{style:{color:STATUS_COLORS[t.status],fontWeight:"500"}},t.status),
                t.dueDate&&h("span",{style:{color:late?"#ef4444":"#3f3f46"}},(late?"\u26a0 ":"")+"Prazo: "+new Date(t.dueDate+"T12:00:00").toLocaleDateString("pt-BR"))
              )
            ),
            h("div",{style:{display:"flex",gap:"3px",flexShrink:0}},
              h(SmBtn,{onClick:()=>handleEdit(t),title:"Editar"},"\u270e"),
              confirmDel===t.id
                ?h(React.Fragment,null,h(SmBtn,{onClick:()=>handleDelete(t.id),danger:true,title:"Confirmar"},"\u2713"),h(SmBtn,{onClick:()=>setConfirmDel(null),title:"Cancelar"},"\u2715"))
                :h(SmBtn,{onClick:()=>setConfirmDel(t.id),danger:true,title:"Excluir"},"\u2715")
            )
          );
        })
      )
  );
}

/* ════ MEMÓRIAS ════ */
function Memorias({notes,setNotes}){
  const[search,setSearch]=useState("");
  const[selectedId,setSelectedId]=useState(null);
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({title:"",content:"",tags:""});
  const[confirmDel,setConfirmDel]=useState(null);
  const[tagFilter,setTagFilter]=useState(null);

  const allTags=useMemo(()=>{const s=new Set();notes.forEach(n=>(n.tags||[]).forEach(t=>s.add(t)));return[...s].sort()},[notes]);

  const filtered=useMemo(()=>{
    let list=notes;
    if(tagFilter)list=list.filter(n=>(n.tags||[]).includes(tagFilter));
    if(search){const q=search.toLowerCase();list=list.filter(n=>n.title.toLowerCase().includes(q)||(n.content||"").toLowerCase().includes(q)||(n.tags||[]).some(t=>t.toLowerCase().includes(q)))}
    return list;
  },[notes,search,tagFilter]);

  const selected=notes.find(n=>n.id===selectedId);
  const backlinks=useMemo(()=>{if(!selected)return[];const p="[["+selected.title+"]]";return notes.filter(n=>n.id!==selected.id&&(n.content||"").includes(p))},[selected,notes]);

  const openNew=()=>{setForm({title:"",content:"",tags:""});setEditing(true);setSelectedId(null)};
  const openEdit=n=>{setForm({title:n.title,content:n.content||"",tags:(n.tags||[]).join(", ")});setEditing(true);setSelectedId(n.id)};

  const handleSave=()=>{
    if(!form.title.trim())return;
    const tags=form.tags.split(",").map(t=>t.trim()).filter(Boolean);
    const now=new Date().toISOString();
    if(selectedId){setNotes(notes.map(n=>n.id===selectedId?{...n,title:form.title,content:form.content,tags,updatedAt:now}:n))}
    else{const nn={id:genId(),title:form.title,content:form.content,tags,createdAt:now,updatedAt:now};setNotes([nn,...notes]);setSelectedId(nn.id)}
    setEditing(false);
  };

  const handleDelete=id=>{setNotes(notes.filter(n=>n.id!==id));if(selectedId===id){setSelectedId(null);setEditing(false)}setConfirmDel(null)};

  return h("div",{style:{display:"flex",gap:"0",minHeight:"calc(100vh - 160px)"}},
    /* Sidebar */
    h("div",{style:{width:"260px",flexShrink:0,borderRight:"1px solid #141414",paddingRight:"16px"}},
      h("div",{style:{display:"flex",gap:"6px",marginBottom:"12px"}},
        h("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar mem\u00f3rias...",style:{...S.input,fontSize:"12px",padding:"8px 10px",flex:1}}),
        h("button",{onClick:openNew,style:{background:"#fafafa",color:"#000",border:"none",borderRadius:"6px",padding:"0 12px",fontSize:"15px",fontWeight:"700",cursor:"pointer"},title:"Nova mem\u00f3ria"},"+")
      ),
      allTags.length>0&&h("div",{style:{display:"flex",flexWrap:"wrap",gap:"4px",marginBottom:"12px"}},
        tagFilter&&h(TagPill,{tag:"\u2715 limpar",onClick:()=>setTagFilter(null),active:true}),
        allTags.map(t=>h(TagPill,{key:t,tag:t,onClick:()=>setTagFilter(tagFilter===t?null:t),active:tagFilter===t}))
      ),
      h("div",{style:{display:"flex",flexDirection:"column",gap:"2px"}},
        filtered.length===0&&h("div",{style:{color:"#3f3f46",fontSize:"12px",padding:"16px",textAlign:"center"}},"Nenhuma mem\u00f3ria"),
        filtered.map(n=>h("div",{key:n.id,onClick:()=>{setSelectedId(n.id);setEditing(false)},style:{background:selectedId===n.id?"#141414":"transparent",borderRadius:"8px",padding:"10px 12px",cursor:"pointer",borderLeft:selectedId===n.id?"2px solid #38bdf8":"2px solid transparent",transition:"all .15s"}},
          h("div",{style:{fontSize:"13px",fontWeight:"600",color:selectedId===n.id?"#fafafa":"#a1a1aa",marginBottom:"2px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},n.title),
          h("div",{style:{fontSize:"11px",color:"#3f3f46"}},new Date(n.updatedAt).toLocaleDateString("pt-BR"),(n.tags||[]).length>0&&" #"+n.tags[0]+(n.tags.length>1?" +"+(n.tags.length-1):""))
        ))
      )
    ),
    /* Main */
    h("div",{style:{flex:1,paddingLeft:"20px",minWidth:0}},
      !selected&&!editing
        ?h(Empty,{msg:"Selecione ou crie uma mem\u00f3ria",icon:"\u25c6",sub:"Use [[t\u00edtulo]] no conte\u00fado para linkar mem\u00f3rias"})
        :editing
          ?h("div",null,
            h("input",{value:form.title,onChange:e=>setForm({...form,title:e.target.value}),placeholder:"T\u00edtulo da mem\u00f3ria",style:{...S.input,fontSize:"18px",fontWeight:"700",border:"none",borderBottom:"1px solid #1f1f1f",borderRadius:0,padding:"8px 0",marginBottom:"12px",background:"transparent",color:"#fafafa"},autoFocus:true}),
            h("textarea",{value:form.content,onChange:e=>setForm({...form,content:e.target.value}),rows:16,placeholder:"Escreva aqui...\n\n# T\u00edtulo  ## Subt\u00edtulo\n**negrito** *it\u00e1lico* `c\u00f3digo`\n- item de lista\n[[Nome]] para linkar",style:{...S.input,fontSize:"14px",lineHeight:"1.7",fontFamily:"'JetBrains Mono','Fira Code',monospace",resize:"vertical",minHeight:"300px"}}),
            h("div",{style:{marginTop:"10px"}},h(Label,null,"Tags (separadas por v\u00edrgula)"),h("input",{value:form.tags,onChange:e=>setForm({...form,tags:e.target.value}),placeholder:"salesforce, algar, arquitetura...",style:{...S.input,fontSize:"12px"}})),
            h("div",{style:{display:"flex",gap:"8px",marginTop:"14px"}},h(Btn,{onClick:handleSave},"Salvar"),h(Btn,{onClick:()=>{setEditing(false);if(!selectedId)setSelectedId(null)},ghost:true},"Cancelar"))
          )
          :selected&&h("div",null,
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px"}},
              h("div",null,
                h("h2",{style:{margin:0,fontSize:"20px",fontWeight:"700",color:"#fafafa"}},selected.title),
                h("div",{style:{fontSize:"11px",color:"#3f3f46",marginTop:"4px"}},"Atualizado em "+new Date(selected.updatedAt).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}))
              ),
              h("div",{style:{display:"flex",gap:"4px"}},
                h(SmBtn,{onClick:()=>openEdit(selected),title:"Editar"},"\u270e"),
                confirmDel===selected.id
                  ?h(React.Fragment,null,h(SmBtn,{onClick:()=>handleDelete(selected.id),danger:true,title:"Confirmar"},"\u2713"),h(SmBtn,{onClick:()=>setConfirmDel(null),title:"Cancelar"},"\u2715"))
                  :h(SmBtn,{onClick:()=>setConfirmDel(selected.id),danger:true,title:"Excluir"},"\u2715")
              )
            ),
            (selected.tags||[]).length>0&&h("div",{style:{display:"flex",gap:"4px",marginBottom:"16px",flexWrap:"wrap"}},selected.tags.map(t=>h(TagPill,{key:t,tag:t,onClick:()=>{setTagFilter(t);setSelectedId(null)}}))),
            h("div",{onClick:e=>{if(e.target.dataset&&e.target.dataset.link)setSelectedId(e.target.dataset.link)},style:{fontSize:"14px",lineHeight:"1.8",color:"#a1a1aa"},dangerouslySetInnerHTML:{__html:renderMd(selected.content,notes)}}),
            backlinks.length>0&&h("div",{style:{marginTop:"32px",paddingTop:"16px",borderTop:"1px solid #1a1a1a"}},
              h("div",{style:{fontSize:"11px",fontWeight:"600",color:"#52525b",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"8px"}},"Backlinks ("+backlinks.length+")"),
              backlinks.map(b=>h("div",{key:b.id,onClick:()=>{setSelectedId(b.id);setEditing(false)},style:{padding:"8px 10px",background:"#0a0a0a",border:"1px solid #1a1a1a",borderRadius:"6px",marginBottom:"4px",cursor:"pointer",fontSize:"13px",color:"#a1a1aa"}},
                h("span",{style:{color:"#38bdf8",fontWeight:"600"}},b.title),
                h("span",{style:{color:"#3f3f46",marginLeft:"8px",fontSize:"11px"}},"menciona esta mem\u00f3ria")
              ))
            )
          )
    )
  );
}

/* ════ MAIN APP ════ */
function App(){
  const[tab,setTab]=useState("atividades");
  const[tasks,setTasks]=useState([]);
  const[notes,setNotes]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    const t=load("i9-brain-atividades");
    const n=load("i9-brain-memorias");
    if(t)setTasks(t);
    if(n)setNotes(n);
    setLoading(false);
  },[]);

  const persistTasks=useCallback(d=>{setTasks(d);save("i9-brain-atividades",d)},[]);
  const persistNotes=useCallback(d=>{setNotes(d);save("i9-brain-memorias",d)},[]);

  if(loading)return h("div",{style:{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh",background:"#000",color:"#555"}},"Carregando...");

  return h("div",{style:{minHeight:"100vh",background:"#000",color:"#d4d4d8",fontFamily:"'Inter',-apple-system,sans-serif"}},
    /* Header */
    h("div",{style:{background:"#000",padding:"16px 24px 0",borderBottom:"1px solid #141414"}},
      h("div",{style:{maxWidth:"900px",margin:"0 auto"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}},
          h("div",{style:{display:"flex",alignItems:"center",gap:"12px"}},
            h("img",{src:LOGO,alt:"Ever i9",style:{height:"40px",borderRadius:"4px"}}),
            h("h1",{style:{margin:0,fontSize:"18px",fontWeight:"700",color:"#fafafa",letterSpacing:"-0.01em"}},tab==="atividades"?"Atividades":"Mem\u00f3rias")
          ),
          h("button",{onClick:function(){if(window.parent&&window.parent.__closeLabOverlay)window.parent.__closeLabOverlay();else window.location.href="/";},style:{background:"transparent",border:"1px solid #27272a",borderRadius:"8px",padding:"8px 16px",fontSize:"12px",fontWeight:"500",color:"#71717a",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px",transition:"all .15s"},onMouseEnter:function(e){e.currentTarget.style.background="#141414";e.currentTarget.style.color="#fafafa"},onMouseLeave:function(e){e.currentTarget.style.background="transparent";e.currentTarget.style.color="#71717a"}},"\u2190 Ever i9")
        ),
        h("div",{style:{display:"flex",gap:"0"}},
          h(TabBtn,{label:"Atividades",icon:"\u2630",active:tab==="atividades",onClick:()=>setTab("atividades"),count:tasks.filter(t=>t.status!=="Conclu\u00edda").length}),
          h(TabBtn,{label:"Mem\u00f3rias",icon:"\u25c6",active:tab==="memorias",onClick:()=>setTab("memorias"),count:notes.length})
        )
      )
    ),
    h("div",{style:{maxWidth:"900px",margin:"0 auto",padding:"20px 16px 40px"}},
      tab==="atividades"?h(Atividades,{tasks,setTasks:persistTasks}):h(Memorias,{notes,setNotes:persistNotes})
    )
  );
}

function TabBtn({label,icon,active,onClick,count}){
  return h("button",{onClick,style:{background:active?"#0a0a0a":"transparent",border:"1px solid "+(active?"#1f1f1f":"transparent"),borderBottom:active?"1px solid #0a0a0a":"1px solid #141414",marginBottom:"-1px",color:active?"#fafafa":"#52525b",padding:"10px 20px",fontSize:"13px",fontWeight:"600",cursor:"pointer",borderRadius:"8px 8px 0 0",display:"flex",alignItems:"center",gap:"8px"}},
    h("span",{style:{fontSize:"11px"}},icon)," ",label,
    count>0&&h("span",{style:{fontSize:"10px",background:active?"#1f1f1f":"#0a0a0a",color:"#71717a",borderRadius:"10px",padding:"1px 7px"}},count)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
