<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ever i9 — DevTools</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0f0a1a;
    --bg-secondary: #1a1128;
    --bg-tertiary: #241a35;
    --bg-card: #1e1530;
    --bg-input: #160f22;
    --border: #3d2d5c;
    --border-focus: #8b5cf6;
    --accent: #8b5cf6;
    --accent-light: #a78bfa;
    --accent-dim: #6d28d9;
    --accent-glow: rgba(139, 92, 246, 0.15);
    --accent-glow-strong: rgba(139, 92, 246, 0.3);
    --success: #34d399;
    --success-bg: rgba(52, 211, 153, 0.1);
    --error: #f87171;
    --error-bg: rgba(248, 113, 113, 0.1);
    --warning: #fbbf24;
    --warning-bg: rgba(251, 191, 36, 0.1);
    --text-primary: #e8e0f0;
    --text-secondary: #a89bc2;
    --text-muted: #6b5a8a;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-light);
    letter-spacing: -0.5px;
  }
  .header-logo span { color: var(--text-muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .conn-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-secondary);
    background: var(--bg-tertiary); padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border);
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; }
  .conn-dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .conn-dot.err { background: var(--error); box-shadow: 0 0 6px var(--error); }
  .conn-dot.loading { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Layout */
  .app-layout { display: flex; min-height: calc(100vh - 56px); }

  /* Sidebar */
  .sidebar {
    width: 220px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    flex-shrink: 0;
  }
  .sidebar-section { padding: 0 12px; margin-bottom: 8px; }
  .sidebar-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text-muted); padding: 8px 12px;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--text-secondary);
    transition: all 0.15s;
  }
  .sidebar-item:hover { background: var(--accent-glow); color: var(--text-primary); }
  .sidebar-item.active {
    background: var(--accent-glow-strong); color: var(--accent-light);
    font-weight: 500;
  }
  .sidebar-icon { font-size: 16px; width: 20px; text-align: center; }

  /* Main */
  .main { flex: 1; padding: 24px; overflow-y: auto; }
  .page-title {
    font-size: 22px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 4px; letter-spacing: -0.5px;
  }
  .page-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 14px; font-weight: 600; color: var(--accent-light);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }

  /* Forms */
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--text-primary); font-size: 13px; font-family: var(--font-body);
    transition: border-color 0.2s;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .form-textarea {
    font-family: var(--font-mono); font-size: 12px;
    resize: vertical; min-height: 120px; line-height: 1.6;
  }
  .form-select { cursor: pointer; }
  .form-row { display: flex; gap: 12px; }
  .form-row > * { flex: 1; }

  /* Buttons */
  .btn {
    padding: 10px 20px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; border: none;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-body);
  }
  .btn-primary {
    background: var(--accent); color: #fff;
  }
  .btn-primary:hover { background: var(--accent-dim); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: var(--bg-tertiary); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--text-primary); }
  .btn-sm { padding: 6px 14px; font-size: 12px; }

  /* Output */
  .output-panel {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; margin-top: 12px;
    font-family: var(--font-mono); font-size: 12px;
    line-height: 1.6; max-height: 400px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
    color: var(--text-secondary);
  }
  .output-panel.success { border-color: var(--success); background: var(--success-bg); color: var(--success); }
  .output-panel.error { border-color: var(--error); background: var(--error-bg); color: var(--error); }

  /* Status badges */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .badge-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(52,211,153,0.3); }
  .badge-error { background: var(--error-bg); color: var(--error); border: 1px solid rgba(248,113,113,0.3); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(251,191,36,0.3); }

  /* Table */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th {
    text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .data-table td {
    padding: 10px 14px; border-bottom: 1px solid rgba(61,45,92,0.4);
    color: var(--text-secondary);
  }
  .data-table tr:hover td { background: var(--accent-glow); }
  .data-table .mono { font-family: var(--font-mono); font-size: 12px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; margin-bottom: 20px; background: var(--bg-secondary); border-radius: 10px; padding: 3px; }
  .tab {
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    font-weight: 500; cursor: pointer; color: var(--text-muted);
    transition: all 0.15s; border: none; background: none;
    font-family: var(--font-body);
  }
  .tab:hover { color: var(--text-secondary); }
  .tab.active { background: var(--accent-glow-strong); color: var(--accent-light); }

  /* Loading spinner */
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.6s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { padding: 16px; }
    .form-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const BASE = 'https://mcp-sf-provisioning-462dd29c2455.herokuapp.com';

// ─── API Helper ───────────────────────────────────────────────
async function api(path, opts = {}) {
  const url = path.startsWith('http') ? path : `${BASE}${path}`;
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  return res.json();
}

// ─── SIDEBAR ITEMS ────────────────────────────────────────────
const MENU = [
  { id: 'connection', icon: '⚡', label: 'Conexão', section: 'Geral' },
  { id: 'soql', icon: '🔍', label: 'SOQL Query', section: 'Consulta' },
  { id: 'describe', icon: '📋', label: 'Describe Object', section: 'Consulta' },
  { id: 'apex-deploy', icon: '🚀', label: 'Deploy Apex', section: 'Deploy' },
  { id: 'fields', icon: '🏗️', label: 'Criar Campo', section: 'Metadata' },
  { id: 'metadata-read', icon: '📖', label: 'Ler Metadata', section: 'Metadata' },
  { id: 'metadata-update', icon: '✏️', label: 'Atualizar Metadata', section: 'Metadata' },
  { id: 'fls', icon: '🔐', label: 'Field-Level Security', section: 'Metadata' },
  { id: 'layout', icon: '🖼️', label: 'Layouts', section: 'Metadata' },
  { id: 'anonymous', icon: '▶️', label: 'Execute Anonymous', section: 'Apex' },
  { id: 'data', icon: '💾', label: 'Inserir Dados', section: 'Dados' },
];

// ─── CONNECTION PAGE ──────────────────────────────────────────
function ConnectionPage() {
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(true);

  const check = useCallback(async () => {
    setLoading(true);
    try {
      const d = await api('/test-connection');
      setStatus(d);
    } catch (e) {
      setStatus({ status: 'error', message: e.message });
    }
    setLoading(false);
  }, []);

  useEffect(() => { check(); }, []);

  return (
    <div>
      <div className="page-title">Conexão com Org</div>
      <div className="page-subtitle">Status da conexão com a org Salesforce via MCP Server</div>
      <div className="card">
        <div className="card-title">⚡ Status</div>
        {loading ? <div className="spinner"></div> : status?.status === 'connected' ? (
          <div>
            <span className="badge badge-success">● Conectado</span>
            <table className="data-table" style={{marginTop:16}}>
              <tbody>
                <tr><td style={{fontWeight:600,width:150}}>Org ID</td><td className="mono">{status.orgId}</td></tr>
                <tr><td style={{fontWeight:600}}>Username</td><td className="mono">{status.username}</td></tr>
                <tr><td style={{fontWeight:600}}>Display Name</td><td>{status.displayName}</td></tr>
                <tr><td style={{fontWeight:600}}>Instance URL</td><td className="mono">{status.instanceUrl}</td></tr>
              </tbody>
            </table>
          </div>
        ) : (
          <div>
            <span className="badge badge-error">● Desconectado</span>
            <div className="output-panel error" style={{marginTop:12}}>{status?.message || 'Erro desconhecido'}</div>
          </div>
        )}
        <div style={{marginTop:16}}>
          <button className="btn btn-secondary btn-sm" onClick={check} disabled={loading}>
            {loading ? <span className="spinner"></span> : '↻'} Verificar
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── SOQL PAGE ────────────────────────────────────────────────
function SoqlPage() {
  const [query, setQuery] = useState('SELECT Id, Name FROM Lead LIMIT 10');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const run = async () => {
    setLoading(true);
    try {
      const b64 = btoa(unescape(encodeURIComponent(query)));
      const d = await api(`/api/soql-b64/${b64}`);
      setResult(d);
    } catch (e) {
      setResult({ status: 'error', message: e.message });
    }
    setLoading(false);
  };

  const records = result?.records || [];
  const columns = records.length > 0 ? Object.keys(records[0]).filter(k => k !== 'attributes') : [];

  return (
    <div>
      <div className="page-title">SOQL Query</div>
      <div className="page-subtitle">Execute consultas SOQL diretamente na org</div>
      <div className="card">
        <div className="form-group">
          <label className="form-label">Query SOQL</label>
          <textarea className="form-textarea" value={query} onChange={e => setQuery(e.target.value)}
            onKeyDown={e => { if (e.ctrlKey && e.key === 'Enter') run(); }}
            placeholder="SELECT Id, Name FROM Account LIMIT 10" />
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn btn-primary" onClick={run} disabled={loading}>
            {loading ? <span className="spinner"></span> : '🔍'} Executar
          </button>
          <span style={{fontSize:12,color:'var(--text-muted)'}}>Ctrl+Enter para executar</span>
        </div>
      </div>
      {result && (
        <div className="card">
          <div className="card-title">
            Resultado
            {result.totalSize !== undefined && (
              <span className="badge badge-success">{result.totalSize} registros</span>
            )}
            {result.status === 'error' && <span className="badge badge-error">Erro</span>}
          </div>
          {result.status === 'error' ? (
            <div className="output-panel error">{result.message}</div>
          ) : columns.length > 0 ? (
            <div style={{overflowX:'auto'}}>
              <table className="data-table">
                <thead><tr>{columns.map(c => <th key={c}>{c}</th>)}</tr></thead>
                <tbody>
                  {records.map((r, i) => (
                    <tr key={i}>{columns.map(c => (
                      <td key={c} className="mono">{typeof r[c] === 'object' ? JSON.stringify(r[c]) : String(r[c] ?? '')}</td>
                    ))}</tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (
            <div className="output-panel">{JSON.stringify(result, null, 2)}</div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── DESCRIBE PAGE ────────────────────────────────────────────
function DescribePage() {
  const [obj, setObj] = useState('Lead');
  const [result, setResult] = useState(null);
  const [filter, setFilter] = useState('');
  const [loading, setLoading] = useState(false);

  const run = async () => {
    setLoading(true);
    try {
      const d = await api(`/api/describe/${obj}`);
      setResult(d);
    } catch (e) {
      setResult({ error: e.message });
    }
    setLoading(false);
  };

  const fields = (result?.fields || []).filter(f =>
    !filter || f.name.toLowerCase().includes(filter.toLowerCase()) ||
    (f.label || '').toLowerCase().includes(filter.toLowerCase())
  );

  return (
    <div>
      <div className="page-title">Describe Object</div>
      <div className="page-subtitle">Schema completo de qualquer objeto da org</div>
      <div className="card">
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Objeto</label>
            <input className="form-input" value={obj} onChange={e => setObj(e.target.value)}
              placeholder="Account, Lead, Opportunity..." />
          </div>
          <div className="form-group" style={{flex:'0 0 auto',display:'flex',alignItems:'flex-end'}}>
            <button className="btn btn-primary" onClick={run} disabled={loading}>
              {loading ? <span className="spinner"></span> : '📋'} Describe
            </button>
          </div>
        </div>
      </div>
      {result?.fields && (
        <div className="card">
          <div className="card-title">
            Campos de {obj}
            <span className="badge badge-success">{result.fields.length} campos</span>
          </div>
          <div className="form-group">
            <input className="form-input" placeholder="Filtrar campos..." value={filter}
              onChange={e => setFilter(e.target.value)} />
          </div>
          <div style={{overflowX:'auto',maxHeight:500,overflowY:'auto'}}>
            <table className="data-table">
              <thead><tr><th>API Name</th><th>Label</th><th>Tipo</th><th>Custom</th></tr></thead>
              <tbody>
                {fields.map(f => (
                  <tr key={f.name}>
                    <td className="mono">{f.name}</td>
                    <td>{f.label}</td>
                    <td><span className="badge badge-warning">{f.type}</span></td>
                    <td>{f.custom ? '✓' : ''}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {result?.error && <div className="output-panel error">{result.error}</div>}
    </div>
  );
}

// ─── DEPLOY APEX PAGE ─────────────────────────────────────────
function ApexDeployPage() {
  const [tab, setTab] = useState('class');
  const [name, setName] = useState('');
  const [body, setBody] = useState('');
  const [objectName, setObjectName] = useState('');
  const [result, setResult] = useState(null);
  const [deployStatus, setDeployStatus] = useState(null);
  const [loading, setLoading] = useState(false);

  const deploy = async () => {
    if (!name || !body) return;
    setLoading(true);
    setDeployStatus(null);
    try {
      const payload = {};
      if (tab === 'class') {
        payload.apexClasses = [{ name, body }];
      } else {
        payload.apexTriggers = [{ name, body, objectName }];
      }
      const d = await api('/api/deploy-code', { method: 'POST', body: JSON.stringify(payload) });
      setResult(d);
      if (d.deployId) {
        pollStatus(d.deployId);
      }
    } catch (e) {
      setResult({ error: e.message });
    }
    setLoading(false);
  };

  const pollStatus = async (deployId) => {
    let tries = 0;
    const interval = setInterval(async () => {
      tries++;
      try {
        const s = await api(`/api/deploy-status/${deployId}`);
        setDeployStatus(s);
        if (s.done || tries > 20) clearInterval(interval);
      } catch (e) {
        clearInterval(interval);
      }
    }, 3000);
  };

  return (
    <div>
      <div className="page-title">Deploy Apex</div>
      <div className="page-subtitle">Deploy de classes e triggers Apex na org</div>
      <div className="tabs">
        <button className={`tab ${tab==='class'?'active':''}`} onClick={()=>setTab('class')}>Classe Apex</button>
        <button className={`tab ${tab==='trigger'?'active':''}`} onClick={()=>setTab('trigger')}>Trigger</button>
      </div>
      <div className="card">
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Nome</label>
            <input className="form-input" value={name} onChange={e => setName(e.target.value)}
              placeholder={tab === 'class' ? 'MinhaClasse' : 'MeuTrigger'} />
          </div>
          {tab === 'trigger' && (
            <div className="form-group">
              <label className="form-label">Objeto</label>
              <input className="form-input" value={objectName} onChange={e => setObjectName(e.target.value)}
                placeholder="Lead, Account..." />
            </div>
          )}
        </div>
        <div className="form-group">
          <label className="form-label">Código</label>
          <textarea className="form-textarea" style={{minHeight:250}} value={body}
            onChange={e => setBody(e.target.value)}
            placeholder={tab === 'class' ? 'public with sharing class MinhaClasse {\n  // ...\n}' :
              'trigger MeuTrigger on Lead (before insert) {\n  // ...\n}'} />
        </div>
        <button className="btn btn-primary" onClick={deploy} disabled={loading || !name || !body}>
          {loading ? <span className="spinner"></span> : '🚀'} Deployar
        </button>
      </div>
      {result && (
        <div className="card">
          <div className="card-title">Resultado do Deploy</div>
          {result.deployId ? (
            <div>
              <div style={{marginBottom:8}}>Deploy ID: <code className="mono">{result.deployId}</code></div>
              {deployStatus ? (
                <div>
                  <span className={`badge ${deployStatus.success ? 'badge-success' : deployStatus.done ? 'badge-error' : 'badge-warning'}`}>
                    {deployStatus.status || (deployStatus.done ? 'Concluído' : 'Em progresso...')}
                  </span>
                  <div style={{marginTop:8,fontSize:13,color:'var(--text-secondary)'}}>
                    Componentes: {deployStatus.numberComponentsDeployed}/{deployStatus.numberComponentsTotal} |
                    Erros: {deployStatus.numberComponentErrors}
                  </div>
                  {deployStatus.componentFailures?.length > 0 && (
                    <div className="output-panel error" style={{marginTop:8}}>
                      {deployStatus.componentFailures.map((f,i) => (
                        <div key={i}>{f.fullName}: {f.problem}</div>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                <div><span className="spinner"></span> Aguardando status...</div>
              )}
            </div>
          ) : (
            <div className="output-panel error">{JSON.stringify(result, null, 2)}</div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── CREATE FIELD PAGE ────────────────────────────────────────
function CreateFieldPage() {
  const [obj, setObj] = useState('Lead');
  const [fieldName, setFieldName] = useState('');
  const [label, setLabel] = useState('');
  const [type, setType] = useState('Text');
  const [length, setLength] = useState('255');
  const [precision, setPrecision] = useState('10');
  const [scale, setScale] = useState('2');
  const [picklistValues, setPicklistValues] = useState('');
  const [referenceTo, setReferenceTo] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const create = async () => {
    setLoading(true);
    try {
      const meta = {
        fullName: `${obj}.${fieldName}`,
        label: label || fieldName.replace('__c',''),
        type,
        required: false,
      };
      if (['Text'].includes(type)) meta.length = parseInt(length) || 255;
      if (['LongTextArea','RichTextArea'].includes(type)) { meta.length = parseInt(length) || 32768; meta.visibleLines = 4; }
      if (['Number','Currency','Percent'].includes(type)) { meta.precision = parseInt(precision); meta.scale = parseInt(scale); }
      if (['Picklist','MultiselectPicklist'].includes(type) && picklistValues) {
        const vals = picklistValues.split('\n').filter(v=>v.trim());
        meta.valueSet = {
          restricted: false,
          valueSetDefinition: {
            sorted: false,
            value: vals.map(v => ({ fullName: v.trim(), default: false, label: v.trim() }))
          }
        };
      }
      if (type === 'Lookup' && referenceTo) {
        meta.referenceTo = referenceTo;
        meta.relationshipLabel = label || fieldName.replace('__c','');
        meta.relationshipName = fieldName.replace('__c','');
      }
      const d = await api('/api/metadata-create/CustomField', { method: 'POST', body: JSON.stringify(meta) });
      setResult(d);

      // Auto FLS
      if (d.success) {
        await api('/api/metadata-update/Profile', {
          method: 'POST',
          body: JSON.stringify({
            fullName: 'Admin',
            fieldPermissions: [{ field: `${obj}.${fieldName}`, editable: true, readable: true }]
          })
        });
      }
    } catch (e) {
      setResult({ error: e.message });
    }
    setLoading(false);
  };

  const TYPES = ['Text','LongTextArea','RichTextArea','Number','Currency','Percent','Picklist','MultiselectPicklist',
    'Checkbox','Date','DateTime','Email','Phone','Url','TextArea','Lookup'];

  const needsLength = ['Text','LongTextArea','RichTextArea'].includes(type);
  const needsPrecision = ['Number','Currency','Percent'].includes(type);
  const needsPicklist = ['Picklist','MultiselectPicklist'].includes(type);
  const needsRef = type === 'Lookup';

  return (
    <div>
      <div className="page-title">Criar Campo</div>
      <div className="page-subtitle">Criar custom field em qualquer objeto (com FLS automático para Admin)</div>
      <div className="card">
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Objeto</label>
            <input className="form-input" value={obj} onChange={e => setObj(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">API Name (com __c)</label>
            <input className="form-input" value={fieldName} onChange={e => setFieldName(e.target.value)}
              placeholder="Meu_Campo__c" />
          </div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Label</label>
            <input className="form-input" value={label} onChange={e => setLabel(e.target.value)}
              placeholder="Meu Campo" />
          </div>
          <div className="form-group">
            <label className="form-label">Tipo</label>
            <select className="form-select" value={type} onChange={e => setType(e.target.value)}>
              {TYPES.map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
        </div>
        {needsLength && (
          <div className="form-group">
            <label className="form-label">Comprimento</label>
            <input className="form-input" value={length} onChange={e => setLength(e.target.value)} type="number" />
          </div>
        )}
        {needsPrecision && (
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Precision</label>
              <input className="form-input" value={precision} onChange={e => setPrecision(e.target.value)} type="number" />
            </div>
            <div className="form-group">
              <label className="form-label">Scale</label>
              <input className="form-input" value={scale} onChange={e => setScale(e.target.value)} type="number" />
            </div>
          </div>
        )}
        {needsPicklist && (
          <div className="form-group">
            <label className="form-label">Valores (um por linha)</label>
            <textarea className="form-textarea" style={{fontFamily:'var(--font-body)',minHeight:80}}
              value={picklistValues} onChange={e => setPicklistValues(e.target.value)}
              placeholder={"Valor 1\nValor 2\nValor 3"} />
          </div>
        )}
        {needsRef && (
          <div className="form-group">
            <label className="form-label">Reference To (objeto pai)</label>
            <input className="form-input" value={referenceTo} onChange={e => setReferenceTo(e.target.value)}
              placeholder="Account" />
          </div>
        )}
        <button className="btn btn-primary" onClick={create} disabled={loading || !fieldName}>
          {loading ? <span className="spinner"></span> : '🏗️'} Criar Campo
        </button>
      </div>
      {result && (
        <div className={`output-panel ${result.success ? 'success' : 'error'}`}>
          {result.success
            ? `✅ Campo ${result.fullName} criado com sucesso!\nFLS Admin atualizado automaticamente.`
            : JSON.stringify(result, null, 2)}
        </div>
      )}
    </div>
  );
}

// ─── FLS PAGE ─────────────────────────────────────────────────
function FlsPage() {
  const [profile, setProfile] = useState('Admin');
  const [field, setField] = useState('Lead.CNPJ__c');
  const [readable, setReadable] = useState(true);
  const [editable, setEditable] = useState(true);
  const [result, setResult] = useState(null);
  const [currentFls, setCurrentFls] = useState(null);
  const [loading, setLoading] = useState(false);

  const checkFls = async () => {
    setLoading(true);
    try {
      const d = await api(`/api/metadata-read/Profile/${profile}`);
      const fps = (d.fieldPermissions || []).filter(f => f.field === field);
      setCurrentFls(fps.length > 0 ? fps[0] : { field, editable: false, readable: false });
    } catch (e) {
      setCurrentFls({ error: e.message });
    }
    setLoading(false);
  };

  const updateFls = async () => {
    setLoading(true);
    try {
      const d = await api('/api/metadata-update/Profile', {
        method: 'POST',
        body: JSON.stringify({
          fullName: profile,
          fieldPermissions: [{ field, editable, readable }]
        })
      });
      setResult(d);
      if (d.success) checkFls();
    } catch (e) {
      setResult({ error: e.message });
    }
    setLoading(false);
  };

  return (
    <div>
      <div className="page-title">Field-Level Security</div>
      <div className="page-subtitle">Verificar e atualizar permissões de campo por perfil</div>
      <div className="card">
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Perfil</label>
            <input className="form-input" value={profile} onChange={e => setProfile(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Campo (Object.Field__c)</label>
            <input className="form-input" value={field} onChange={e => setField(e.target.value)}
              placeholder="Lead.CNPJ__c" />
          </div>
        </div>
        <button className="btn btn-secondary btn-sm" onClick={checkFls} disabled={loading} style={{marginBottom:16}}>
          {loading ? <span className="spinner"></span> : '🔍'} Verificar FLS Atual
        </button>
        {currentFls && !currentFls.error && (
          <div style={{marginBottom:16,padding:12,background:'var(--bg-tertiary)',borderRadius:8,fontSize:13}}>
            <strong>FLS Atual:</strong> Readable = <span className={`badge ${currentFls.readable?'badge-success':'badge-error'}`}>
              {currentFls.readable ? 'true' : 'false'}</span>{' '}
            Editable = <span className={`badge ${currentFls.editable?'badge-success':'badge-error'}`}>
              {currentFls.editable ? 'true' : 'false'}</span>
          </div>
        )}
        <div className="form-row">
          <div className="form-group">
            <label className="form-label" style={{display:'flex',gap:8,alignItems:'center'}}>
              <input type="checkbox" checked={readable} onChange={e => setReadable(e.target.checked)} /> Readable
            </label>
          </div>
          <div className="form-group">
            <label className="form-label" style={{display:'flex',gap:8,alignItems:'center'}}>
              <input type="checkbox" checked={editable} onChange={e => setEditable(e.target.checked)} /> Editable
            </label>
          </div>
        </div>
        <button className="btn btn-primary" onClick={updateFls} disabled={loading}>
          {loading ? <span className="spinner"></span> : '🔐'} Atualizar FLS
        </button>
      </div>
      {result && (
        <div className={`output-panel ${result.success ? 'success' : 'error'}`}>
          {result.success ? '✅ FLS atualizado com sucesso!' : JSON.stringify(result, null, 2)}
        </div>
      )}
    </div>
  );
}

function AnonymousPage() {
  const [code, setCode] = useState("System.debug('Hello from DevTools!');");

  const [loading, setLoading] = useState(false);

  const run = async () => {
    setLoading(true);
    try {
      const d = await api('/api/execute-anonymous', {
        method: 'POST', body: JSON.stringify({ code })
      });
      setResult(d);
    } catch (e) {
      setResult({ error: e.message });
    }
    setLoading(false);
  };

  return (
    <div>
      <div className="page-title">Execute Anonymous</div>
      <div className="page-subtitle">Executar Apex anônimo diretamente na org</div>
      <div className="card">
        <div className="form-group">
          <label className="form-label">Código Apex</label>
          <textarea className="form-textarea" style={{minHeight:200}} value={code}
            onChange={e => setCode(e.target.value)}
            onKeyDown={e => { if (e.ctrlKey && e.key === 'Enter') run(); }} />
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn btn-primary" onClick={run} disabled={loading}>
            {loading ? <span className="spinner"></span> : '▶️'} Executar
          </button>
          <span style={{fontSize:12,color:'var(--text-muted)'}}>Ctrl+Enter</span>
        </div>
      </div>
      {result && (
        <div className={`output-panel ${result.success ? 'success' : 'error'}`}>
          {result.success
            ? '✅ Executado com sucesso!' + (result.compileProblem ? `\nCompile: ${result.compileProblem}` : '')
            : `❌ ${result.compileProblem || result.exceptionMessage || JSON.stringify(result, null, 2)}`}
        </div>
      )}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('connection');
  const [connStatus, setConnStatus] = useState('loading');

  useEffect(() => {
    api('/test-connection').then(d => {
      setConnStatus(d.status === 'connected' ? 'ok' : 'err');
    }).catch(() => setConnStatus('err'));
  }, []);

  const pages = {
    'connection': ConnectionPage,
    'soql': SoqlPage,
    'describe': DescribePage,
    'apex-deploy': ApexDeployPage,
    'fields': CreateFieldPage,
    'metadata-read': MetadataReadPage,
    'metadata-update': MetadataUpdatePage,
    'fls': FlsPage,
    'layout': LayoutPage,
    'anonymous': AnonymousPage,
    'data': DataPage,
  };
  const PageComponent = pages[page] || ConnectionPage;

  // Group menu items by section
  const sections = {};
  MENU.forEach(m => {
    if (!sections[m.section]) sections[m.section] = [];
    sections[m.section].push(m);
  });

  return (
    <div>
      <div className="header">
        <div className="header-left">
          <div className="header-logo">
            ◇ DevTools <span>Ever i9</span>
          </div>
        </div>
        <div className="conn-status">
          <div className={`conn-dot ${connStatus}`}></div>
          {connStatus === 'ok' ? 'Org conectada' : connStatus === 'err' ? 'Desconectado' : 'Verificando...'}
        </div>
      </div>
      <div className="app-layout">
        <div className="sidebar">
          {Object.entries(sections).map(([section, items]) => (
            <div className="sidebar-section" key={section}>
              <div className="sidebar-label">{section}</div>
              {items.map(m => (
                <div key={m.id} className={`sidebar-item ${page===m.id?'active':''}`}
                  onClick={() => setPage(m.id)}>
                  <span className="sidebar-icon">{m.icon}</span>
                  {m.label}
                </div>
              ))}
            </div>
          ))}
        </div>
        <div className="main">
          <PageComponent />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
