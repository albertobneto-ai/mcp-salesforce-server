<script>
(function(){
  var token = localStorage.getItem('everi9_token');
  var user = null;
  try { user = JSON.parse(localStorage.getItem('everi9_user')||'{}'); } catch(e){}
  
  if(!token || !user || !user.role) {
    document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Outfit,sans-serif;color:#e2e8f0"><div style="font-size:48px;margin-bottom:16px">🔒</div><div style="font-size:20px;font-weight:700;margin-bottom:8px">Acesso Restrito</div><div style="color:#94a3b8;margin-bottom:24px">Faça login no Ever i9 primeiro.</div><a href="/" style="padding:10px 24px;border-radius:10px;background:#6366f1;color:#fff;text-decoration:none;font-weight:600;font-size:14px">Ir para Login</a></div>';
    document.querySelectorAll('script[type="text/babel"]').forEach(function(s){s.remove()});
    return;
  }
  
  if(user.role !== 'admin' && user.role !== 'architect') {
    document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Outfit,sans-serif;color:#e2e8f0"><div style="font-size:48px;margin-bottom:16px">⛔</div><div style="font-size:20px;font-weight:700;margin-bottom:8px">Acesso Não Autorizado</div><div style="color:#94a3b8;margin-bottom:8px">O Data Cloud Sandbox é restrito aos perfis:</div><div style="display:flex;gap:8px;margin-bottom:24px"><span style="padding:4px 12px;border-radius:6px;background:#7c3aed22;color:#7c3aed;font-weight:600;border:1px solid #7c3aed44">Admin</span><span style="padding:4px 12px;border-radius:6px;background:#3b82f622;color:#3b82f6;font-weight:600;border:1px solid #3b82f644">Arquiteto</span></div><div style="color:#64748b;font-size:13px;margin-bottom:24px">Seu perfil atual: <strong style="color:#f59e0b">'+user.role+'</strong></div><a href="/" style="padding:10px 24px;border-radius:10px;background:#6366f1;color:#fff;text-decoration:none;font-weight:600;font-size:14px">Voltar ao Ever i9</a></div>';
    document.querySelectorAll('script[type="text/babel"]').forEach(function(s){s.remove()});
    return;
  }
  
  // Validate token server-side
  fetch('/api/chat/usage', {headers:{Authorization:'Bearer '+token}})
    .then(function(r){if(r.status===401){localStorage.removeItem('everi9_token');localStorage.removeItem('everi9_user');location.href='/';}})
    .catch(function(){});
  
  window.__dcUser = user;
})();
</script>

const Insights=()=>{

});

return <div>

<textarea value={q} onChange={e=>setQ(e.target.value)} className="mono" style={{width:"100%",minHeight:80,padding:"7px 12px",borderRadius:8,border:"1px solid #1e3a5f",background:"#081020",color:"#a5b4fc",resize:"vertical",boxSizing:"border-box"}}/>

</div></div>;
};

const Placeholder=({title})=><div>
<h2 style={{fontSize:22,fontWeight:700,marginBottom:20}}>{title}</h2>
<div className="card" style={{textAlign:"center",padding:40}}><div style={{fontSize:48,marginBottom:12}}>🚧</div><div style={{fontSize:16,color:"#94a3b8"}}>Módulo em construção</div></div>
</div>;

// ═══ MAIN APP ═══
function App(){
const[view,setView]=useState("dashboard");
const[mode,setMode]=useState("offline");

const renderView=()=>{
switch(view){
case"dashboard":return <Dashboard onNav={setView}/>;
case"spaces":return <Placeholder title="📦 Data Spaces"/>;
case"sources":return <Sources/>;
case"dlos":return <DLOs/>;
case"transforms":return <Transforms/>;
case"dmos":return <DMOs/>;
case"identity":return <Identity/>;
case"profiles":return <Profiles/>;
case"insights":return <Insights/>;
case"segments":return <Segments/>;
case"explorer":return <DataExplorer/>;
case"actions":return <DataActions/>;
case"enrichments":return <Enrichments/>;
case"activations":return <Activations/>;
case"shares":return <DataShares/>;
case"graphs":return <DataGraphs/>;
case"einstein":return <Einstein/>;
case"consent":return <Consent/>;
case"governance":return <Governance/>;
default:return <Placeholder title={view}/>;
}};

return <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
{/* TOP BAR */}
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 20px",background:"linear-gradient(135deg,#0a1628,#0f1d32)",borderBottom:"1px solid #1e3a5f",gap:12,flexWrap:"wrap"}}>
<div style={{display:"flex",alignItems:"center",gap:10}}>
<span style={{fontSize:22}}>☁️</span>

<span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:"#1e3a5f",color:"#94a3b8",border:"1px solid #2a4a70"}}>EVER i9</span>
<span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:window.__dcUser?.role==="admin"?"#7c3aed22":"#3b82f622",color:window.__dcUser?.role==="admin"?"#7c3aed":"#3b82f6",border:"1px solid "+(window.__dcUser?.role==="admin"?"#7c3aed44":"#3b82f644")}}>{window.__dcUser?.name||"Usuário"} ({window.__dcUser?.role})</span>
</div>
<div style={{display:"flex",alignItems:"center",gap:12}}>
<div style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:"#1e3a5f",color:"#94a3b8",border:"1px solid #2a4a70"}}>
{mode==="offline"?"🔴 Offline — Dados Simulados":"🟢 Live — Org 00DgK00000PUJwTUAX"}
</div>
<select value={mode} onChange={e=>setMode(e.target.value)} style={{padding:"7px 12px",borderRadius:8,border:"1px solid #1e3a5f",background:"#0f1d32",color:"#e2e8f0",fontSize:11}}>
<option value="offline">Offline (Simulado)</option>
<option value="live">Live (Org Real)</option>
</select>
</div>
</div>
<div style={{display:"flex",flex:1,overflow:"hidden"}}>
{/* SIDEBAR */}
<div style={{width:220,minWidth:220,background:"#0a1628",borderRight:"1px solid #1e3a5f",overflowY:"auto",padding:"12px 0"}}>
{MENU.map(g=><div key={g.group}>
<div style={{padding:"8px 16px 4px",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,color:"#475569"}}>{g.group}</div>
{g.items.map(item=><div key={item.key} className={`sidebar-item ${view===item.key?"active":""}`} onClick={()=>setView(item.key)}>

<div style={{flex:1,overflow:"auto",padding:24}}>{renderView()}</div>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
