<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i9 Connect — Transcrição de Áudio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--surface:#13132b;--card:#1a1a3e;--border:#2a2a5e;--accent:#7c5cfc;--accent2:#a78bfa;--text:#e2e0f0;--muted:#8888aa;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
/* ─── HEADER ─── */
.header{background:linear-gradient(135deg,#1a0a3e 0%,#2d1b69 50%,#1a1a3e 100%);padding:24px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px}
.header svg{width:40px;height:40px;flex-shrink:0}
.header h1{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--accent2),#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--muted);font-size:.85rem;margin-top:2px}
/* ─── MAIN ─── */
.main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px}
/* ─── CONTROLS ─── */
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border:none;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-mic{background:linear-gradient(135deg,var(--accent),#6d4de8)}
.btn-mic:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 20px rgba(124,92,252,.4)}
.btn-screen{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.btn-screen:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 20px rgba(59,130,246,.4)}
.btn-stop{background:linear-gradient(135deg,var(--danger),#dc2626);animation:pulse 1.5s infinite}
.btn-stop:hover:not(:disabled){box-shadow:0 4px 20px rgba(239,68,68,.4)}
.btn-sm{padding:8px 16px;font-size:.8rem;border-radius:8px}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
/* ─── STATUS ─── */
.status-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-radius:12px;border:1px solid var(--border);font-size:.85rem}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-dot.idle{background:var(--muted)}
.status-dot.recording{background:var(--danger);animation:blink 1s infinite}
.status-dot.processing{background:var(--warning);animation:blink .5s infinite}
.status-dot.done{background:var(--success)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.timer{font-family:'JetBrains Mono',monospace;font-size:1.1rem;color:var(--accent2)}
/* ─── SETTINGS ─── */
.settings{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.settings label{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.settings select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:.8rem}
/* ─── TRANSCRIPT ─── */
.transcript-box{flex:1;min-height:300px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;overflow-y:auto;position:relative}
.transcript-box:empty::before{content:'A transcrição aparecerá aqui...';color:var(--muted);font-style:italic}
.transcript-box .chunk{margin-bottom:12px;padding:12px 16px;background:var(--card);border-radius:10px;border-left:3px solid var(--accent);line-height:1.6}
.chunk .ts{font-size:.7rem;color:var(--muted);font-family:monospace;margin-bottom:4px}
.chunk .text{font-size:.95rem}
/* ─── TOOLBAR ─── */
.toolbar{display:flex;gap:8px;justify-content:flex-end}
/* ─── FOOTER ─── */
.footer{text-align:center;padding:12px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border)}
/* ─── RESPONSIVE ─── */
@media(max-width:600px){.controls{flex-direction:column}.controls .btn{width:100%;justify-content:center}}
</style>
</head>
<body>

<div class="header">
  <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#7c5cfc" stroke-width="2"/><path d="M20 10v12M16 14v4M24 14v4M12 16v2M28 16v2M20 26v4" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/></svg>
  <div>
    <h1>i9 Connect</h1>
    <p>Transcrição de áudio em tempo real — powered by xAI Whisper</p>
  </div>
</div>

<div class="main">
  <!-- Status -->
  <div class="status-bar">
    <div class="status-dot idle" id="statusDot"></div>
    <span id="statusText">Aguardando início</span>
    <span style="flex:1"></span>
    <span class="timer" id="timer">00:00</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-mic" id="btnMic" onclick="startRecording('mic')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      Microfone
    </button>
    <button class="btn btn-screen" id="btnScreen" onclick="startRecording('screen')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Áudio do Sistema
    </button>
    <button class="btn btn-stop" id="btnStop" onclick="stopRecording()" style="display:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Parar Gravação
    </button>
  </div>

  <!-- Settings -->
  <div class="settings">
    <label>Idioma:
      <select id="selLang">
        <option value="pt" selected>Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
      </select>
    </label>
    <label>Intervalo:
      <select id="selInterval">
        <option value="15">15s</option>
        <option value="30" selected>30s</option>
        <option value="60">60s</option>
        <option value="0">Manual</option>
      </select>
    </label>
  </div>

  <!-- Transcript -->
  <div class="transcript-box" id="transcript"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-sm btn-ghost" onclick="copyTranscript()">📋 Copiar Texto</button>
    <button class="btn btn-sm btn-ghost" onclick="downloadTranscript()">💾 Baixar .txt</button>
    <button class="btn btn-sm btn-ghost" onclick="clearTranscript()">🗑️ Limpar</button>
  </div>
</div>

<div class="footer">Ever i9 — i9 Connect v1.0 — Transcrição powered by xAI Whisper</div>

<script>
const API = window.location.origin + '/api/i9-connect';
let mediaRecorder = null;
let recordedChunks = [];
let stream = null;
let timerInterval = null;
let startTime = 0;
let chunkIndex = 0;
let autoInterval = null;

/* ─── UI Helpers ─── */
function setStatus(state, text) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusText').textContent = text;
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('timer').textContent = m + ':' + s;
}

function toggleButtons(recording) {
  document.getElementById('btnMic').style.display = recording ? 'none' : '';
  document.getElementById('btnScreen').style.display = recording ? 'none' : '';
  document.getElementById('btnStop').style.display = recording ? '' : 'none';
}

/* ─── Start Recording ─── */
async function startRecording(mode) {
  try {
    let recStream; // stream used for MediaRecorder (audio-only)

    if (mode === 'mic') {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recStream = stream;
    } else {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const audioTracks = stream.getAudioTracks();
      if (audioTracks.length === 0) {
        alert('Nenhuma faixa de áudio detectada.\nAo compartilhar, marque "Compartilhar áudio do sistema" / "Share system audio".');
        stream.getTracks().forEach(t => t.stop());
        return;
      }
      // Extract audio-only stream for MediaRecorder
      recStream = new MediaStream(audioTracks);
      // Stop screen share → stop recording
      stream.getVideoTracks().forEach(vt => vt.addEventListener('ended', () => stopRecording()));
    }

    // Try mimeTypes in order of preference
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'video/webm;codecs=opus',
      'video/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus',
      '' // default — let browser decide
    ];
    let mimeType = '';
    let recorder = null;
    for (const mt of candidates) {
      try {
        const opts = mt ? { mimeType: mt } : {};
        recorder = new MediaRecorder(recStream, opts);
        mimeType = mt || recorder.mimeType || 'audio/webm';
        break;
      } catch (e) { continue; }
    }
    if (!recorder) throw new Error('Nenhum formato de gravação suportado neste navegador.');

    recordedChunks = [];
    chunkIndex = 0;
    mediaRecorder = recorder;

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      if (recordedChunks.length > 0) {
        const blob = new Blob(recordedChunks, { type: mimeType });
        recordedChunks = [];
        sendForTranscription(blob, mimeType);
      }
    };

    mediaRecorder.start();
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    toggleButtons(true);
    setStatus('recording', mode === 'mic' ? 'Gravando microfone...' : 'Gravando áudio do sistema...');

    // Auto-chunk interval
    const intervalSec = parseInt(document.getElementById('selInterval').value);
    if (intervalSec > 0) {
      autoInterval = setInterval(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          // Restart after a tiny delay
          setTimeout(() => {
            if (stream && stream.active) {
              recordedChunks = [];
              mediaRecorder.start();
            }
          }, 200);
        }
      }, intervalSec * 1000);
    }

  } catch (err) {
    console.error('Recording error:', err);
    if (err.name === 'NotAllowedError') {
      alert('Permissão negada. Autorize o acesso ao microfone/tela.');
    } else {
      alert('Erro ao iniciar gravação: ' + err.message);
    }
  }
}

/* ─── Stop Recording ─── */
function stopRecording() {
  if (autoInterval) { clearInterval(autoInterval); autoInterval = null; }
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  toggleButtons(false);
}

/* ─── Send chunk to backend ─── */
async function sendForTranscription(blob, mimeType) {
  setStatus('processing', 'Transcrevendo...');
  chunkIndex++;
  const idx = chunkIndex;

  try {
    // Convert blob to base64
    const base64 = await blobToBase64(blob);
    const lang = document.getElementById('selLang').value;

    const res = await fetch(API + '/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio: base64, mimeType, language: lang })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.details || data.error || 'API error ' + res.status);

    if (data.text && data.text.trim()) {
      appendChunk(idx, data.text.trim(), data.duration);
    }

    // If still recording, set status back
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      setStatus('recording', 'Gravando...');
    } else {
      setStatus('done', 'Transcrição concluída');
    }
  } catch (err) {
    console.error('Transcription error:', err);
    appendError(idx, err.message);
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      setStatus('recording', 'Gravando (erro no chunk anterior)...');
    } else {
      setStatus('idle', 'Erro: ' + err.message);
    }
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const result = reader.result;
      resolve(result.split(',')[1]); // strip data:...;base64,
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/* ─── Transcript UI ─── */
function appendChunk(idx, text, duration) {
  const box = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'chunk';
  const dur = duration ? ` — ${duration.toFixed(1)}s` : '';
  div.innerHTML = `<div class="ts">Bloco #${idx}${dur} — ${new Date().toLocaleTimeString('pt-BR')}</div><div class="text">${escHtml(text)}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function appendError(idx, msg) {
  const box = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'chunk';
  div.style.borderLeftColor = 'var(--danger)';
  div.innerHTML = `<div class="ts" style="color:var(--danger)">Bloco #${idx} — ERRO</div><div class="text" style="color:var(--danger)">${escHtml(msg)}</div>`;
  box.appendChild(div);
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ─── Toolbar ─── */
function getFullText() {
  return [...document.querySelectorAll('#transcript .chunk .text')].map(e => e.textContent).join('\n\n');
}

function copyTranscript() {
  const text = getFullText();
  if (!text) return alert('Nenhuma transcrição para copiar.');
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target.closest('button');
    const orig = btn.textContent;
    btn.textContent = '✅ Copiado!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

function downloadTranscript() {
  const text = getFullText();
  if (!text) return alert('Nenhuma transcrição para baixar.');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `transcricao_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function clearTranscript() {
  if (!confirm('Limpar toda a transcrição?')) return;
  document.getElementById('transcript').innerHTML = '';
  chunkIndex = 0;
  setStatus('idle', 'Aguardando início');
  document.getElementById('timer').textContent = '00:00';
}
</script>
</body>
</html>
