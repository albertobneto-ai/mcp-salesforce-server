<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Agentes SF — Ever i9</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,-apple-system,sans-serif;background:#f7f7fa;color:#1e293b;overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:root{--sidebar:210px;--header:58px;--accent:#7c3aed;--accent-light:#8b5cf6;--border:#e5e7eb;--surface:#ffffff;--bg:#f7f7fa;--text:#1e293b;--muted:#6b7280;--subtle:#fafafb;--radius:10px}
@media(max-width:768px){:root{--sidebar:0px}}

/* Sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--surface);display:flex;flex-direction:column;z-index:10;border-right:1px solid var(--border)}
.sidebar .logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar .logo .icon{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.sidebar .logo .text{color:var(--text);font-weight:700;font-size:14.5px;letter-spacing:-.2px}
.sidebar .logo .sub{color:var(--muted);font-size:11px;font-weight:400;letter-spacing:.1px}
.sidebar .close-btn{margin-left:auto;background:none;border:none;color:#9ca3af;cursor:pointer;font-size:18px;transition:color .15s}
.sidebar .close-btn:hover{color:var(--text)}
.sidebar .nav{padding:10px 10px 0;flex:1}
.sidebar .nav-item{padding:9px 12px;border-radius:8px;margin-bottom:2px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500;transition:all .15s;letter-spacing:-.1px}
.sidebar .nav-item.active{background:#1e293b;color:#fff;font-weight:600}
.sidebar .nav-item:hover:not(.active){background:#f3f4f6;color:var(--text)}
.sidebar .stats{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:#9ca3af;font-weight:400;letter-spacing:.1px}

/* Main */
.main{margin-left:var(--sidebar);height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.header{height:var(--header);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;flex-shrink:0}
.header h1{font-size:17px;font-weight:700;color:var(--text);flex:1;letter-spacing:-.3px}
.header .mode-toggle{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;border:1px solid var(--border)}
.header .mode-btn{padding:6px 14px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s;letter-spacing:-.1px}
.header .mode-btn.active{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(124,58,237,.25)}
.header .mode-btn:not(.active){background:transparent;color:var(--muted)}
.header .add-btn{padding:9px 18px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:5px;letter-spacing:-.1px;box-shadow:0 1px 3px rgba(124,58,237,.2);transition:all .15s}
.header .add-btn:hover{filter:brightness(1.08);box-shadow:0 2px 8px rgba(124,58,237,.3)}

/* Board */
.board{flex:1;display:flex;gap:0;overflow-x:auto;overflow-y:hidden}
.column{flex:0 0 calc(100%/6);min-width:210px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--subtle)}
.column:last-child{border-right:none}
.column-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--surface)}
.column-header .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.column-header .label{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9ca3af;flex:1}
.column-header .count{font-size:10.5px;font-weight:700;color:#9ca3af;background:var(--bg);padding:2px 7px;border-radius:5px;min-width:20px;text-align:center}
.column-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.column-body.drag-over{background:rgba(124,58,237,.04);outline:2px dashed rgba(124,58,237,.25);outline-offset:-4px;border-radius:6px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:grab;transition:all .18s;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card:hover{border-color:#c4b5fd;box-shadow:0 3px 12px rgba(124,58,237,.07);transform:translateY(-2px)}
.card.dragging{opacity:.4;transform:rotate(2deg)}
.card .card-priority{position:absolute;top:0;left:16px;font-size:7.5px;font-weight:800;padding:2.5px 8px;border-radius:0 0 5px 5px;text-transform:uppercase;letter-spacing:.6px}
.card .card-priority.high{background:#ef4444;color:#fff}
.card .card-priority.medium{background:#f59e0b;color:#fff}
.card .card-priority.low{background:#6366f1;color:#fff}
.card .card-title{font-size:13.5px;font-weight:600;color:var(--text);margin-top:10px;line-height:1.35;letter-spacing:-.15px}
.card .card-desc{font-size:11.5px;color:#9ca3af;margin-top:5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400;letter-spacing:.05px}
.card .card-meta{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .card-meta .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:-.1px}
.card .card-actions{position:absolute;top:10px;right:10px;display:none;gap:3px}
.card:hover .card-actions{display:flex}
.card .card-actions button{width:24px;height:24px;border-radius:6px;border:none;background:var(--bg);color:#9ca3af;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.card .card-actions button:hover{background:#fee2e2;color:#ef4444}

/* Agent badge */
.agent-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:4px 10px;border-radius:6px;margin-top:8px;letter-spacing:-.1px}
.agent-badge.idle{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe}
.agent-badge.running{background:#fef9c3;color:#a16207;border:1px solid #fde047;animation:pulse 1.5s infinite}
.agent-badge.done{background:#f0fdf4;color:#15803d;border:1px solid #86efac}
.agent-badge.error{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(15,15,26,.4);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.1)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-header h2{font-size:16px;font-weight:700;flex:1;color:var(--text);letter-spacing:-.2px}
.modal-header .close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:none;color:#9ca3af;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-header .close:hover{background:#f3f4f6;color:var(--text)}
.modal-body{padding:20px 24px}
.modal-body label{display:block;font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;margin-top:16px}
.modal-body label:first-child{margin-top:0}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:13.5px;font-family:'Outfit',sans-serif;background:var(--subtle);color:var(--text);outline:none;font-weight:400;letter-spacing:-.05px;transition:border-color .15s,box-shadow .15s}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.08)}
.modal-body textarea{resize:vertical;min-height:80px;line-height:1.6}
.modal-body input::placeholder,.modal-body textarea::placeholder{color:#c4c8cf;font-weight:400}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.modal-footer .btn{padding:9px 22px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:-.1px;transition:all .15s}
.modal-footer .btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(124,58,237,.2)}
.modal-footer .btn-primary:hover{filter:brightness(1.08)}
.modal-footer .btn-cancel{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.modal-footer .btn-cancel:hover{background:#f3f4f6}
.modal-footer .btn-primary:disabled{opacity:.45;cursor:not-allowed}

/* Agent confirm modal */
.agent-modal{border:1px solid rgba(124,58,237,.25);box-shadow:0 20px 60px rgba(124,58,237,.08)}
.agent-modal .modal-header{background:rgba(124,58,237,.03);border-bottom:1px solid rgba(124,58,237,.12)}
.agent-info{background:var(--subtle);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.agent-info .label{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.agent-info .value{font-size:13.5px;color:var(--text);margin-bottom:12px;font-weight:500;letter-spacing:-.1px}
.agent-info .value:last-child{margin-bottom:0}
.preview-box{background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;max-height:200px;overflow-y:auto;font-size:12px;color:var(--muted);line-height:1.65;white-space:pre-wrap;font-weight:400}

/* Spinner */
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Detail panel */
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:450px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);z-index:50;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.06);animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.dp-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.dp-body{flex:1;overflow-y:auto;padding:20px}
.dp-section{margin-bottom:22px}
.dp-section-title{font-size:10.5px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}

/* Mobile */
.mobile-menu{display:none;position:fixed;top:12px;left:12px;z-index:20;width:38px;height:38px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform .2s;z-index:100}.sidebar.open{transform:translateX(0)}.mobile-menu{display:flex}.column{min-width:280px}.detail-panel{width:100%}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#9ca3af}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const e=React.createElement,{useState:S,useEffect:E,useRef:R,useCallback:C}=React;
const API='/api/squad';
function H(){const t=localStorage.getItem('everi9_token');return{'Content-Type':'application/json','Authorization':'Bearer '+(t||'')};}
async function api(path,opts={}){
  const t=localStorage.getItem('everi9_token');
  if(!t)return {_authError:true};
  const r=await fetch(API+path,{headers:H(),...opts});
  if(r.status===401||r.status===403){window.parent?.postMessage('squad-auth-fail','*');return {_authError:true,_code:r.status};}
  return r.json();
}

const STAGES=[
  {key:'analise',label:'ANÁLISE REQUISITO',color:'#94a3b8',hasAgent:false},
  {key:'hf',label:'HISTÓRIA FUNCIONAL',color:'#22c55e',hasAgent:true},
  {key:'spec',label:'ESPEC. TÉCNICA',color:'#8b5cf6',hasAgent:true},
  {key:'dev',label:'DESENVOLVIMENTO',color:'#3b82f6',hasAgent:true},
  {key:'refinamento',label:'REFINAMENTO TÉC.',color:'#f97316',hasAgent:true},
  {key:'done',label:'CONCLUÍDO',color:'#15803d',hasAgent:false},
];

function Card({card,onDragStart,onDetail,onDelete,runningCards}){
  const isRunning=runningCards.has(card.id);
  return e('div',{className:'card',draggable:!isRunning,
    onDragStart:ev=>{ev.dataTransfer.setData('cardId',String(card.id));onDragStart(card.id)},
    onDragEnd:()=>onDragStart(null),onClick:()=>onDetail(card.id)},
    card.priority&&e('div',{className:'card-priority '+card.priority},card.priority),
    !isRunning&&e('div',{className:'card-actions'},
      e('button',{onClick:ev=>{ev.stopPropagation();onDelete(card.id)},title:'Excluir'},'×')),
    card.story_number&&e('div',{style:{fontSize:10,fontWeight:700,color:'#7c3aed',letterSpacing:.5,marginTop:6}},card.story_number),
    e('div',{className:'card-title'},card.title),
    card.description&&e('div',{className:'card-desc'},card.description),
    e('div',{className:'card-meta'},
      card.assignee&&e('span',{className:'badge',style:{background:'#ede9fe',color:'#a78bfa'}},card.assignee),
      card.artifact_count>0&&e('span',{className:'badge',style:{background:'#f0fdf4',color:'#22c55e'}},card.artifact_count+' artefato'+(card.artifact_count>1?'s':'')),
    ),
    isRunning
      ?e('div',{className:'agent-badge running'},'◈ Agente executando...')
      :STAGES.find(s=>s.key===card.stage)?.hasAgent&&e('div',{className:'agent-badge idle'},'◈ Agente disponível'),
  );
}

function Column({stage,cards,onMove,onDragStart,onDetail,onDelete,runningCards}){
  const[over,setOver]=S(false);
  const filtered=cards.filter(c=>c.stage===stage.key);
  return e('div',{className:'column'},
    e('div',{className:'column-header'},
      e('div',{className:'dot',style:{background:stage.color}}),
      e('span',{className:'label'},stage.label),
      e('span',{className:'count'},filtered.length)),
    e('div',{className:'column-body'+(over?' drag-over':''),
      onDragOver:ev=>{ev.preventDefault();setOver(true)},onDragLeave:()=>setOver(false),
      onDrop:ev=>{ev.preventDefault();setOver(false);const id=ev.dataTransfer.getData('cardId');if(id)onMove(Number(id),stage.key)}},
      filtered.map(c=>e(Card,{key:c.id,card:c,onDragStart,onDetail,onDelete,runningCards})),
      filtered.length===0&&e('div',{style:{padding:'20px 10px',textAlign:'center',color:'#94a3b8',fontSize:11}},'Arraste cards aqui'),
    ));
}

function CreateModal({onClose,onCreate}){
  const[f,setF]=S({title:'',description:'',priority:'medium',assignee:'',mode:'manual',story_number:''});
  const u=(k,v)=>setF(p=>({...p,[k]:v}));
  const canCreate=f.title.trim()&&f.story_number.trim();
  return e('div',{className:'modal-overlay',onClick:ev=>{if(ev.target===ev.currentTarget)onClose()}},
    e('div',{className:'modal'},
      e('div',{className:'modal-header'},e('h2',null,'Novo card'),e('button',{className:'close',onClick:onClose},'×')),
      e('div',{className:'modal-body'},
        e('label',null,'Número da História *'),
        e('input',{value:f.story_number,onChange:ev=>u('story_number',ev.target.value),placeholder:'Ex: HF-001, US-042, ALGAR-123...',autoFocus:true,style:{borderColor:!f.story_number.trim()?'#f59e0b':'#e2e8f0'}}),
        e('label',null,'Título *'),
        e('input',{value:f.title,onChange:ev=>u('title',ev.target.value),placeholder:'Descreva a necessidade de negócio...'}),
        e('label',null,'Descrição'),
        e('textarea',{value:f.description,onChange:ev=>u('description',ev.target.value),placeholder:'Detalhes, contexto, critérios de aceite...'}),
        e('label',null,'Prioridade'),
        e('select',{value:f.priority,onChange:ev=>u('priority',ev.target.value)},
          e('option',{value:'high'},'Alta'),e('option',{value:'medium'},'Média'),e('option',{value:'low'},'Baixa')),
        e('label',null,'Responsável'),
        e('input',{value:f.assignee,onChange:ev=>u('assignee',ev.target.value),placeholder:'Nome'}),
        e('label',null,'Modo'),
        e('div',{style:{display:'flex',gap:6}},
          ['manual','auto'].map(m=>e('button',{key:m,onClick:()=>u('mode',m),style:{flex:1,padding:'10px',borderRadius:8,border:f.mode===m?'2px solid #8b5cf6':'1px solid #2a2a3e',background:f.mode===m?'rgba(139,92,246,.1)':'#f8f9fc',color:f.mode===m?'#a78bfa':'#64748b',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Outfit'}},m==='manual'?'▤ Manual':'▶ Automático'))),
      ),
      e('div',{className:'modal-footer'},
        e('button',{className:'btn btn-cancel',onClick:onClose},'Cancelar'),
        e('button',{className:'btn btn-primary',onClick:()=>{if(canCreate)onCreate(f)},disabled:!canCreate},'Criar card')),
    ));
}

function InputModal({card,onConfirm,onCancel}){
  const[txt,setTxt]=S(card?.description||'');
  const[uploading,setUploading]=S(false);
  const[fileName,setFileName]=S('');
  const handleFile=async(file)=>{
    if(!file)return;
    setUploading(true);setFileName(file.name);
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='txt'||ext==='md'){
      const reader=new FileReader();
      reader.onload=()=>{setTxt(reader.result);setUploading(false);};
      reader.readAsText(file);
    }else if(ext==='docx'||ext==='pdf'){
      const reader=new FileReader();
      reader.onload=async()=>{
        const b64=reader.result.split(',')[1];
        try{
          const r=await api('/extract-text',{method:'POST',body:JSON.stringify({file_name:file.name,content_base64:b64})});
          if(r?.text)setTxt(r.text);
          else alert('Não foi possível extrair texto do arquivo');
        }catch(err){alert('Erro: '+err.message);}
        setUploading(false);
      };
      reader.readAsDataURL(file);
    }else{alert('Formato não suportado. Use .txt, .docx ou .pdf');setUploading(false);}
  };
  return e('div',{className:'modal-overlay',onClick:ev=>{if(ev.target===ev.currentTarget)onCancel()}},
    e('div',{className:'modal agent-modal',style:{maxWidth:620}},
      e('div',{className:'modal-header'},
        e('h2',null,'◇ Requisito — '+card?.title),
        e('button',{className:'close',onClick:onCancel},'×')),
      e('div',{className:'modal-body'},
        e('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:12,lineHeight:1.5}},
          'Cole ou escreva o requisito de negócio que será transformado pelo agente. Você também pode fazer upload de um arquivo.'),
        e('textarea',{value:txt,onChange:ev=>setTxt(ev.target.value),placeholder:'Descreva o requisito de negócio em detalhes...\n\nExemplo: Como gerente comercial, preciso que o sistema permita registrar visitas presenciais aos clientes, com check-in por geolocalização...',
          style:{width:'100%',minHeight:200,border:'1px solid #2a2a3e',borderRadius:8,padding:12,fontSize:13,fontFamily:'Outfit,sans-serif',background:'#f8f9fc',color:'#1a1a2e',outline:'none',resize:'vertical',lineHeight:1.6,boxSizing:'border-box'}}),
        e('div',{style:{display:'flex',alignItems:'center',gap:10,marginTop:12}},
          e('label',{style:{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',borderRadius:8,border:'1px dashed #3a3a5e',cursor:uploading?'wait':'pointer',color:'#64748b',fontSize:12,fontWeight:600,transition:'all .15s',background:fileName?'rgba(139,92,246,.08)':'transparent'}},
            uploading?e('div',{className:'spinner',style:{width:14,height:14,borderWidth:2}}):null,
            uploading?'Extraindo texto...':fileName?('✓ '+fileName):'⬆ Upload arquivo (.txt, .docx, .pdf)',
            e('input',{type:'file',accept:'.txt,.md,.docx,.pdf',style:{position:'absolute',width:0,height:0,opacity:0,overflow:'hidden'},onChange:ev=>{if(ev.target.files[0])handleFile(ev.target.files[0]);ev.target.value='';}})),
          txt.length>0&&e('span',{style:{fontSize:10,color:'#475569',marginLeft:'auto'}},txt.length.toLocaleString()+' caracteres'),
        ),
      ),
      e('div',{className:'modal-footer'},
        e('button',{className:'btn btn-cancel',onClick:onCancel},'Cancelar'),
        e('button',{className:'btn btn-primary',onClick:()=>{if(txt.trim())onConfirm(txt.trim())},disabled:!txt.trim()||uploading},
          'Prosseguir →')),
    ));
}

function AgentConfirmModal({preview,onConfirm,onCancel,loading}){
  if(!preview)return null;
  const ag=preview.agent||{};
  return e('div',{className:'modal-overlay',onClick:ev=>{if(ev.target===ev.currentTarget&&!loading)onCancel()}},
    e('div',{className:'modal agent-modal'},
      e('div',{className:'modal-header'},
        e('h2',null,'◈ '+ag.label),
        !loading&&e('button',{className:'close',onClick:onCancel},'×')),
      e('div',{className:'modal-body'},
        e('div',{className:'agent-info'},
          e('div',{className:'label'},'Modelo'),e('div',{className:'value'},ag.model),
          e('div',{className:'label'},'Ação'),e('div',{className:'value'},ag.description),
        ),
        preview.missingArtifact
          ?e('div',{style:{marginTop:12,padding:12,background:'#fffbeb',border:'1px solid #f59e0b40',borderRadius:8,color:'#fbbf24',fontSize:12}},
            '⚠ '+preview.missingArtifact+'. O agente usará a descrição do card como input.')
          :null,
        e('div',{className:'label',style:{marginTop:14,fontSize:10,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'.5px'}},'Preview do input'),
        e('div',{className:'preview-box'},preview.inputPreview||'(sem conteúdo)'),
        loading&&e('div',{style:{display:'flex',alignItems:'center',gap:10,marginTop:14,padding:12,background:'rgba(139,92,246,.1)',borderRadius:8,border:'1px solid rgba(139,92,246,.2)'}},
          e('div',{className:'spinner',style:{width:20,height:20,borderWidth:2}}),

        e('button',{className:'btn btn-cancel',onClick:onCancel,disabled:loading},'Cancelar'),
        e('button',{className:'btn btn-primary',onClick:onConfirm,disabled:loading},loading?'Executando...':'Confirmar e executar')),
    ));
}

function DetailPanel({card,artifacts,runs,attachments,onClose,onRefresh}){
  if(!card)return null;
  const stg=STAGES.find(s=>s.key===card.stage);
  const isAnalise=card.stage==='analise';
  const[editDesc,setEditDesc]=S(card.description||'');
  const[saving,setSaving]=S(false);
  const[uploading,setUploading]=S(false);
  const atts=attachments||[];
  E(()=>{setEditDesc(card.description||'')},[card.id,card.description]);
  const saveDesc=async()=>{setSaving(true);await api('/cards/'+card.id,{method:'PATCH',body:JSON.stringify({description:editDesc})});setSaving(false);if(onRefresh)onRefresh();};
  const uploadFile=async(file)=>{if(!file)return;setUploading(true);const reader=new FileReader();reader.onload=async()=>{const b64=reader.result.split(',')[1];await api('/cards/'+card.id+'/attachments',{method:'POST',body:JSON.stringify({file_name:file.name,content_base64:b64})});setUploading(false);if(onRefresh)onRefresh();};reader.readAsDataURL(file);};
  const deleteAtt=async(attId)=>{await api('/cards/'+card.id+'/attachments/'+attId,{method:'DELETE'});if(onRefresh)onRefresh();};
  const downloadArt=(id)=>{window.open(API+'/artifacts/'+id+'/download?token='+encodeURIComponent(localStorage.getItem('everi9_token')||''))};
  return e('div',{className:'detail-panel'},
    e('div',{className:'dp-header'},
      e('div',{style:{flex:1}},
        e('div',{style:{fontSize:10,color:'#64748b',fontWeight:600,textTransform:'uppercase',letterSpacing:.8}},stg?.label),
        card.story_number&&e('div',{style:{fontSize:11,fontWeight:700,color:'#7c3aed',marginTop:2,letterSpacing:.5}},card.story_number),
        e('div',{style:{fontSize:17,fontWeight:700,color:'#1a1a2e',marginTop:4}},card.title),
        e('div',{style:{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}},
          card.priority&&e('span',{style:{padding:'3px 8px',borderRadius:6,background:card.priority==='high'?'#fef2f2':'#eff6ff',color:card.priority==='high'?'#dc2626':'#3b82f6',fontSize:10,fontWeight:600}},card.priority.toUpperCase()),
          card.mode&&e('span',{style:{padding:'3px 8px',borderRadius:6,background:'#ede9fe',color:'#7c3aed',fontSize:10,fontWeight:600}},card.mode==='auto'?'AUTO':'MANUAL'),
        )),
      e('button',{onClick:onClose,style:{background:'none',border:'1px solid #e2e8f0',borderRadius:8,width:32,height:32,color:'#9ca3af',cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}},'×')),
    e('div',{className:'dp-body'},
      // DESCRIÇÃO/REQUISITO
      e('div',{className:'dp-section'},
        e('div',{className:'dp-section-title'},isAnalise?'REQUISITO (editável)':'DESCRIÇÃO'),
        isAnalise
          ?e('div',null,
            e('textarea',{value:editDesc,onChange:ev=>setEditDesc(ev.target.value),placeholder:'Descreva o requisito de negócio aqui...',style:{width:'100%',minHeight:120,border:'1px solid #e2e8f0',borderRadius:8,padding:12,fontSize:13,fontFamily:'Outfit,sans-serif',background:'#f8f9fc',color:'#1a1a2e',outline:'none',resize:'vertical',lineHeight:1.6,boxSizing:'border-box'}}),
            e('div',{style:{display:'flex',justifyContent:'flex-end',marginTop:8}},
              e('button',{onClick:saveDesc,disabled:saving,style:{padding:'6px 16px',borderRadius:6,border:'none',background:'#7c3aed',color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'Outfit',opacity:saving?.5:1}},saving?'Salvando...':'Salvar')))
          :card.description?e('div',{style:{fontSize:13,color:'#374151',lineHeight:1.6,background:'#f8f9fc',borderRadius:8,padding:12,border:'1px solid #e2e8f0',whiteSpace:'pre-wrap'}},card.description):null,
      ),
      // ANEXOS
      e('div',{className:'dp-section'},
        e('div',{className:'dp-section-title'},'ANEXOS ('+atts.length+')'),
        atts.map(a=>e('div',{key:a.id,style:{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'#f8f9fc',border:'1px solid #e2e8f0',borderRadius:8,marginBottom:6}},
          e('span',{style:{fontSize:14}},{xlsx:'📊',xls:'📊',pdf:'📕',docx:'📄',txt:'📝',csv:'📊',md:'📝'}[a.file_type]||'📎'),
          e('span',{style:{fontSize:12,fontWeight:500,color:'#1a1a2e',flex:1}},a.file_name),
          e('span',{style:{fontSize:10,color:'#9ca3af'}},Math.round((a.file_size||0)/1024)+'KB'),
          isAnalise&&e('button',{onClick:()=>deleteAtt(a.id),style:{background:'none',border:'none',color:'#ef4444',cursor:'pointer',fontSize:14,padding:'2px'}},'×'),
        )),
        isAnalise&&e('label',{style:{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',borderRadius:8,border:'1px dashed #d1d5db',cursor:uploading?'wait':'pointer',color:'#9ca3af',fontSize:12,fontWeight:500,marginTop:4}},
          uploading?e('div',{className:'spinner',style:{width:14,height:14,borderWidth:2}}):null,
          uploading?'Extraindo texto...':'⬆ Adicionar arquivo (.txt, .docx, .pdf, .xlsx)',
          e('input',{type:'file',accept:'.txt,.md,.docx,.pdf,.xlsx,.xls,.csv',style:{position:'absolute',width:0,height:0,opacity:0,overflow:'hidden'},onChange:ev=>{if(ev.target.files[0])uploadFile(ev.target.files[0]);ev.target.value='';}})),
        !isAnalise&&!atts.length&&e('div',{style:{color:'#9ca3af',fontSize:12,fontStyle:'italic'}},'Nenhum anexo'),
      ),
      // PIPELINE
      e('div',{className:'dp-section'},
        e('div',{className:'dp-section-title'},'PIPELINE'),
        e('div',{style:{display:'flex',gap:4,flexWrap:'wrap'}},
          STAGES.map(s=>{const idx=STAGES.findIndex(x=>x.key===s.key);const ci=STAGES.findIndex(x=>x.key===card.stage);const past=idx<ci;const active=s.key===card.stage;
            return e('div',{key:s.key,style:{padding:'6px 10px',borderRadius:6,fontSize:9,fontWeight:700,letterSpacing:.5,border:'1px solid '+(active?s.color+'80':'#e2e8f0'),background:active?s.color+'15':past?'#f0fdf4':'#f8f9fc',color:active?s.color:past?'#15803d':'#9ca3af'}},
              past?'✓ ':active?'● ':'○ ',s.label);}))),
      // ARTEFATOS
      e('div',{className:'dp-section'},
        e('div',{className:'dp-section-title'},'ARTEFATOS ('+artifacts.length+')'),
        artifacts.length===0?e('div',{style:{color:'#9ca3af',fontSize:12,fontStyle:'italic'}},'Nenhum artefato'):
        artifacts.map(a=>e('div',{key:a.id,style:{background:'#f8f9fc',border:'1px solid #e2e8f0',borderRadius:8,padding:10,marginBottom:6}},
          e('div',{style:{display:'flex',alignItems:'center',gap:6}},
            e('span',{style:{color:'#15803d'}},'◆'),
            e('span',{style:{fontSize:12,fontWeight:600,color:'#1e293b',flex:1}},a.artifact_type.toUpperCase()),
            e('button',{onClick:()=>downloadArt(a.id),style:{background:'#ede9fe',border:'1px solid #c4b5fd',borderRadius:6,padding:'4px 10px',color:'#7c3aed',fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'Outfit'}},'⬇ Download')),
          e('div',{style:{fontSize:10,color:'#9ca3af',marginTop:4}},a.model_used+' · '+new Date(a.created_at).toLocaleString('pt-BR')),
          a.content&&e('details',{style:{marginTop:6}},
            e('summary',{style:{fontSize:10,color:'#9ca3af',cursor:'pointer'}},'Ver conteúdo'),
            e('pre',{style:{fontSize:10,color:'#6b7280',background:'#f0f0f5',padding:8,borderRadius:6,marginTop:4,maxHeight:300,overflow:'auto',whiteSpace:'pre-wrap',lineHeight:1.5}},a.content.slice(0,3000)+(a.content.length>3000?'\n\n... (truncado)':''))),
        ))),
      // RUNS
      e('div',{className:'dp-section'},
        e('div',{className:'dp-section-title'},'EXECUÇÕES ('+runs.length+')'),
        runs.map(r=>e('div',{key:r.id,style:{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid #e8e8ef'}},
          e('div',{style:{width:8,height:8,borderRadius:'50%',background:r.status==='done'?'#15803d':r.status==='running'?'#b45309':'#dc2626'}}),
          e('span',{style:{fontSize:11,color:'#374151',flex:1}},r.stage+' — '+r.status+(r.error_msg?' — '+r.error_msg:'')),
          e('span',{style:{fontSize:10,color:'#9ca3af'}},new Date(r.started_at).toLocaleString('pt-BR')),
        ))),
    ));
}

function App(){
  const[cards,setCards]=S([]);const[view,setView]=S('board');const[showCreate,setShowCreate]=S(false);
  const[dragging,setDragging]=S(null);const[detailId,setDetailId]=S(null);const[detailData,setDetailData]=S({card:null,artifacts:[],runs:[],attachments:[]});
  const[stats,setStats]=S(null);const[sidebarOpen,setSidebarOpen]=S(false);
  const[agentPreview,setAgentPreview]=S(null);const[agentLoading,setAgentLoading]=S(false);
  const[pendingMove,setPendingMove]=S(null);const[runningCards,setRunningCards]=S(new Set());
  const[showInputModal,setShowInputModal]=S(null);

  const[authError,setAuthError]=S(false);
  const load=C(async()=>{
    const r=await api('/cards');
    if(r?._authError){
      setAuthError(true);
      setTimeout(async()=>{const r2=await api('/cards');if(!r2?._authError){setAuthError(false);setCards(r2.cards||[]);}},3000);
    }else if(r){setAuthError(false);setCards(r.cards||[]);}
  },[]);
  const loadStats=C(async()=>{const r=await api('/stats');if(r)setStats(r);},[]);
  E(()=>{load();loadStats();},[]);

  const createCard=async(data)=>{const r=await api('/cards',{method:'POST',body:JSON.stringify(data)});if(r?.card){setCards(p=>[r.card,...p]);setShowCreate(false);loadStats();}};

  const moveCard=async(id,stage)=>{
    const stageConfig=STAGES.find(s=>s.key===stage);
    if(stageConfig?.hasAgent){
      setPendingMove({id,stage});
      if(stage==='hf'){
        // Verificar se card já tem conteúdo ou anexos
        const card=cards.find(c=>c.id===id);
        const attResp=await api('/cards/'+id+'/attachments');
        const hasContent=(card?.description||'').trim().length>0;
        const hasAttachments=(attResp?.attachments||[]).length>0;
        if(hasContent||hasAttachments){
          // Já tem conteúdo — perguntar se mantém ou substitui
          const attCount=(attResp?.attachments||[]).length;
          const msg=hasAttachments
            ?`Este card já possui ${hasContent?'requisito escrito':''}${hasContent&&hasAttachments?' e ':''}${hasAttachments?attCount+' arquivo(s) anexado(s)':''}.\n\nDeseja manter o conteúdo atual e gerar a HF, ou abrir o editor para modificar?`
            :`Este card já possui requisito escrito.\n\nDeseja manter e gerar a HF, ou abrir o editor para modificar?`;
          const keep=confirm(msg+'\n\nOK = Manter e gerar\nCancelar = Abrir editor');
          if(keep){
            // Ir direto para preview do agente
            const preview=await api('/cards/'+id+'/agent-preview?stage=hf');
            if(preview)setAgentPreview(preview);
          }else{
            // Abrir InputModal para editar
            setShowInputModal(card||{id,title:'Card',description:''});
          }
        }else{
          // Sem conteúdo — abrir InputModal
          setShowInputModal(card||{id,title:'Card',description:''});
        }
      }else{
        // Spec/Dev/Refinamento: ir direto para preview
        const preview=await api('/cards/'+id+'/agent-preview?stage='+stage);
        if(preview)setAgentPreview(preview);
      }
      return;
    }
    setCards(p=>p.map(c=>c.id===id?{...c,stage}:c));
    await api('/cards/'+id+'/move',{method:'POST',body:JSON.stringify({stage})});
    loadStats();
  };

  // Etapa 1→2: após input do requisito, salvar e mostrar preview do agente
  const onInputConfirm=async(inputText)=>{
    if(!pendingMove)return;
    const{id,stage}=pendingMove;
    // Salvar texto como descrição do card
    await api('/cards/'+id,{method:'PATCH',body:JSON.stringify({description:inputText})});
    setCards(p=>p.map(c=>c.id===id?{...c,description:inputText}:c));
    setShowInputModal(null);
    // Etapa 2: mostrar preview do agente
    const preview=await api('/cards/'+id+'/agent-preview?stage='+stage);
    if(preview)setAgentPreview({...preview,inputPreview:inputText.slice(0,500)+(inputText.length>500?'...':'')});
  };

  const cancelInput=()=>{setShowInputModal(null);setPendingMove(null);};

  const confirmAgent=async()=>{
    if(!pendingMove)return;
    const{id,stage}=pendingMove;
    setAgentLoading(true);
    setRunningCards(p=>new Set([...p,id]));
    // Move o card primeiro
    setCards(p=>p.map(c=>c.id===id?{...c,stage}:c));
    try{
      const r=await api('/cards/'+id+'/run-agent',{method:'POST',body:JSON.stringify({stage})});
      if(r?.success){
        await load();loadStats();
        if(detailId===id)openDetail(id);
      }else{
        alert('Erro no agente: '+(r?.erro||'desconhecido'));
      }
    }catch(err){alert('Erro: '+err.message);}
    setAgentLoading(false);setAgentPreview(null);setPendingMove(null);
    setRunningCards(p=>{const n=new Set(p);n.delete(id);return n;});
  };

  const cancelAgent=()=>{setAgentPreview(null);setPendingMove(null);setAgentLoading(false);};

  const deleteCard=async(id)=>{if(!confirm('Excluir card e artefatos?'))return;setCards(p=>p.filter(c=>c.id!==id));await api('/cards/'+id,{method:'DELETE'});if(detailId===id)closeDetail();loadStats();};

  const openDetail=async(id)=>{setDetailId(id);const r=await api('/cards/'+id);if(r)setDetailData(r);};
  const closeDetail=()=>{setDetailId(null);setDetailData({card:null,artifacts:[],runs:[],attachments:[]});};
  const closePanel=()=>{
    // Se standalone (não iframe): logout e redirecionar para login
    if(window===window.parent||!window.parent){
      if(confirm('Deseja sair do Squad e encerrar a sessão?')){
        localStorage.removeItem('everi9_token');
        localStorage.removeItem('everi9_user');
        window.location.href='/';
      }
    }else{
      window.parent.postMessage('squad-closed','*');
    }
  };

  // Auth check: se não tem token, redirecionar para login (standalone)
  E(()=>{
    if(window===window.parent&&!localStorage.getItem('everi9_token')){
      window.location.href='/';
    }
  },[]);

  return e('div',null,
    e('button',{className:'mobile-menu',onClick:()=>setSidebarOpen(!sidebarOpen)},sidebarOpen?'×':'☰'),
    e('div',{className:'sidebar'+(sidebarOpen?' open':'')},
      e('div',{className:'logo'},
        e('div',{className:'icon'},'◈'),
        e('div',null,e('div',{className:'text'},'Squad Agentes'),e('div',{className:'sub'},'Salesforce AI Pipeline')),
        e('button',{className:'close-btn',onClick:closePanel,title:'Sair'},window===window.parent?'Sair':'×')),
      e('div',{className:'nav'},
        e('div',{className:'nav-item'+(view==='board'?' active':''),onClick:()=>{setView('board');setSidebarOpen(false)}},'▣ Board'),
        e('div',{className:'nav-item'+(view==='list'?' active':''),onClick:()=>{setView('list');setSidebarOpen(false)}},'▤ Lista'),
        e('div',{style:{height:1,background:'#e2e8f0',margin:'8px 0'}}),
        e('div',{style:{color:'#94a3b8',fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:1.2,padding:'4px 8px'}},'Pipeline'),
        STAGES.map(s=>{const cnt=cards.filter(c=>c.stage===s.key).length;
          return e('div',{key:s.key,style:{padding:'5px 10px',fontSize:11,color:'#64748b',display:'flex',alignItems:'center',gap:6}},
            e('div',{style:{width:6,height:6,borderRadius:'50%',background:s.color}}),
            e('span',{style:{flex:1}},s.label),
            cnt>0&&e('span',{style:{fontSize:9,color:'#475569',background:'#e8e8ef',padding:'1px 5px',borderRadius:3}},cnt));})),
      stats&&e('div',{className:'stats'},stats.total_cards+' cards · '+stats.total_artifacts+' artefatos')),
    e('div',{className:'main'},
      e('div',{className:'header'},
        e('h1',null,'Squad Agentes SF'),
        e('div',{className:'mode-toggle'},
          e('button',{className:'mode-btn'+(view==='board'?' active':''),onClick:()=>setView('board')},'Board'),
          e('button',{className:'mode-btn'+(view==='list'?' active':''),onClick:()=>setView('list')},'Lista')),
        e('button',{className:'add-btn',onClick:()=>setShowCreate(true)},'+ NOVO CARD')),
      authError&&e('div',{style:{margin:'12px 20px',padding:'14px 18px',background:'#fef3c7',border:'1px solid #fbbf24',borderRadius:10,display:'flex',alignItems:'center',gap:10}},
        e('span',{style:{fontSize:20}},'⚠'),
        e('div',null,
          e('div',{style:{fontSize:13,fontWeight:600,color:'#92400e'}},'Sessão expirada ou não autenticado'),
          e('div',{style:{fontSize:12,color:'#a16207',marginTop:2}},'Faça login novamente no Ever i9 para visualizar os cards.'),
        ),
        e('button',{onClick:()=>{load()},style:{marginLeft:'auto',padding:'6px 14px',borderRadius:6,border:'1px solid #fbbf24',background:'#fff',color:'#92400e',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'Outfit'}},'Tentar novamente'),
      ),
      view==='board'&&e('div',{className:'board'},STAGES.map(s=>e(Column,{key:s.key,stage:s,cards,onMove:moveCard,onDragStart:setDragging,onDetail:openDetail,onDelete:deleteCard,runningCards}))),
      view==='list'&&e('div',{style:{flex:1,overflow:'auto',padding:20}},
        e('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12}},
          e('thead',null,e('tr',{style:{borderBottom:'1px solid #2a2a3e',textAlign:'left'}},
            ['Título','Estágio','Prior.','Responsável','Artefatos','Atualizado'].map(h=>
              e('th',{key:h,style:{padding:'8px 12px',color:'#64748b',fontWeight:600,fontSize:10,textTransform:'uppercase'}},h)))),
          e('tbody',null,cards.map(c=>{const stg=STAGES.find(s=>s.key===c.stage);
            return e('tr',{key:c.id,style:{borderBottom:'1px solid #1e1e32',cursor:'pointer'},onClick:()=>openDetail(c.id)},
              e('td',{style:{padding:'10px 12px',fontWeight:700,color:'#7c3aed',fontSize:11}},c.story_number||'—'),
              e('td',{style:{padding:'10px 12px',fontWeight:600,color:'#1e293b'}},c.title),
              e('td',{style:{padding:'10px 12px'}},e('span',{style:{padding:'3px 8px',borderRadius:4,fontSize:9,fontWeight:700,background:(stg?.color||'#475569')+'20',color:stg?.color,border:'1px solid '+(stg?.color||'#475569')+'40'}},stg?.label)),
              e('td',{style:{padding:'10px 12px',color:c.priority==='high'?'#fca5a5':'#94a3b8',fontWeight:600,fontSize:11}},c.priority),
              e('td',{style:{padding:'10px 12px',color:'#94a3b8'}},c.assignee||'—'),
              e('td',{style:{padding:'10px 12px',color:'#22c55e',fontWeight:600}},c.artifact_count||0),
              e('td',{style:{padding:'10px 12px',color:'#475569',fontSize:11}},new Date(c.updated_at).toLocaleString('pt-BR')));})),
        ),
        cards.length===0&&e('div',{style:{textAlign:'center',padding:60,color:'#94a3b8'}},
          e('div',{style:{fontSize:40,marginBottom:12}},'◈'),
          e('div',{style:{fontSize:14,fontWeight:600}},'Nenhum card ainda')))),
    showCreate&&e(CreateModal,{onClose:()=>setShowCreate(false),onCreate:createCard}),
    showInputModal&&e(InputModal,{card:showInputModal,onConfirm:onInputConfirm,onCancel:cancelInput}),
    agentPreview&&e(AgentConfirmModal,{preview:agentPreview,onConfirm:confirmAgent,onCancel:cancelAgent,loading:agentLoading}),
    detailId&&e(DetailPanel,{card:detailData.card,artifacts:detailData.artifacts||[],runs:detailData.runs||[],attachments:detailData.attachments||[],onClose:closeDetail,onRefresh:()=>openDetail(detailId)}),
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(e(App));

</script>
