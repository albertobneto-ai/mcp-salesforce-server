<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ever i9 — HF Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;overflow:hidden;height:100vh;background:#e8dff5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c9b8d8;border-radius:3px}

/* ══ LAYOUT ══ */
.app{display:flex;height:100vh;width:100vw}

/* ── SIDEBAR ── */
.sidebar{width:56px;min-width:56px;background:linear-gradient(180deg,#1a0a3e 0%,#2d1b69 40%,#4a2d8a 100%);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;z-index:10}
.sidebar-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.5);font-size:18px}
.sidebar-icon:hover{background:rgba(255,255,255,.12);color:#fff}
.sidebar-icon.active{background:rgba(255,255,255,.18);color:#fff;box-shadow:0 0 12px rgba(138,100,220,.4)}
.sidebar-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6c44a0,#9b6dd7);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;margin-bottom:12px;letter-spacing:-0.5px}
.sidebar-spacer{flex:1}

/* ── MAIN AREA ── */
.main{flex:1;display:flex;gap:0;background:linear-gradient(135deg,#e8dff5 0%,#d4c8e8 50%,#c9b8d8 100%);padding:16px;overflow:hidden}

/* ── PANEL LEFT: Manage Data ── */
.panel-left{width:380px;min-width:320px;display:flex;flex-direction:column;gap:12px}
.panel-card{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border-radius:16px;border:1px solid rgba(255,255,255,.4);box-shadow:0 4px 24px rgba(90,61,138,.08);overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid rgba(200,184,216,.3)}
.panel-title{font-weight:700;font-size:16px;color:#1a0a3e}
.panel-close{width:28px;height:28px;border-radius:8px;border:none;background:rgba(90,61,138,.08);color:#5a3d8a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.panel-close:hover{background:rgba(90,61,138,.18)}
.panel-body{padding:16px 20px}

/* Select / Dropdown */
.select-wrap{position:relative;margin-bottom:14px}
.select-label{font-size:11px;font-weight:700;color:#5a3d8a;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.select-box{width:100%;padding:10px 14px;border:1px solid #c9b8d8;border-radius:10px;background:#fff;font-family:inherit;font-size:13px;color:#1a0a3e;cursor:pointer;appearance:none;outline:none;transition:border .2s}
.select-box:focus{border-color:#6c44a0;box-shadow:0 0 0 3px rgba(108,68,160,.12)}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid #e8dff5;margin-bottom:14px}
.tab{padding:8px 18px;font-size:13px;font-weight:600;color:#7868a0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:#1a0a3e;border-bottom-color:#6c44a0}
.tab .count{background:#e8dff5;color:#5a3d8a;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:6px}

/* Session list */
.session-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.session-item{padding:10px 14px;border-radius:10px;background:rgba(232,223,245,.5);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.session-item:hover{background:rgba(108,68,160,.1)}
.session-item.active{background:rgba(108,68,160,.15);border:1px solid rgba(108,68,160,.25)}
.session-title{font-size:13px;font-weight:500;color:#2d1f48;display:flex;align-items:center;gap:5px}
.session-title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.session-phase{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.phase-discovery{background:#e8dff5;color:#6c44a0}
.phase-confirmation{background:#fef3c7;color:#d97706}
.phase-generated{background:#dcfce7;color:#16a34a}
.session-delete{width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:#c9b8d8;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.session-delete:hover{background:rgba(239,68,68,.1);color:#ef4444}

/* Settings accordion */
.settings-section{border-top:1px solid rgba(200,184,216,.2);padding-top:12px;margin-top:8px}
.settings-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:#5a3d8a}
.settings-toggle svg{transition:transform .2s}
.field-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.field-label{font-size:12px;color:#2d1f48}
.field-bar{height:6px;border-radius:3px;flex:1;margin-left:12px;max-width:120px}

/* ── PANEL RIGHT: Conversation ── */
.panel-right{flex:1;display:flex;flex-direction:column;margin-left:16px}
.conv-card{flex:1;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-radius:16px;border:1px solid rgba(255,255,255,.5);box-shadow:0 4px 24px rgba(90,61,138,.08);display:flex;flex-direction:column;overflow:hidden}
.conv-header{padding:16px 20px 12px;border-bottom:1px solid rgba(200,184,216,.2);display:flex;align-items:center;justify-content:space-between}
.conv-title{font-weight:700;font-size:16px;color:#1a0a3e}
.conv-actions{display:flex;gap:8px}
.conv-btn{padding:6px 14px;border-radius:8px;border:1px solid #c9b8d8;background:#fff;font-family:inherit;font-size:12px;font-weight:600;color:#5a3d8a;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.conv-btn:hover{background:#f3eef9;border-color:#6c44a0}
.conv-btn.primary{background:linear-gradient(135deg,#5a3d8a,#6c44a0);color:#fff;border:none}
.conv-btn.primary:hover{opacity:.9}
.conv-btn:disabled{opacity:.4;cursor:not-allowed}

/* Chat messages */
.chat-area{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg-bubble{padding:12px 16px;border-radius:14px;font-size:13px;line-height:1.65;color:#1a0a3e}
.msg.user .msg-bubble{background:linear-gradient(135deg,#5a3d8a,#6c44a0);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .msg-bubble{background:rgba(232,223,245,.6);border:1px solid rgba(200,184,216,.3);border-bottom-left-radius:4px}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{margin:12px 0 6px;color:inherit}
.msg-bubble h1{font-size:16px}.msg-bubble h2{font-size:14px}.msg-bubble h3{font-size:13px}
.msg-bubble table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.msg-bubble th{background:#2d1f48;color:#fff;padding:6px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.msg-bubble td{padding:5px 8px;border-bottom:1px solid #e8dff5}
.msg-bubble tr:nth-child(even) td{background:rgba(232,223,245,.3)}
.msg-bubble code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}
.msg-bubble pre{background:#1a0a3e;color:#e0d4f5;padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.msg-bubble pre code{background:transparent;color:inherit;padding:0}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin:4px 0}
.msg-bubble blockquote{border-left:3px solid #6c44a0;padding-left:12px;margin:6px 0;font-style:italic;color:#5a3d8a}
.msg-time{font-size:9px;color:#a89bc2;margin-top:4px;text-align:right}
.msg.assistant .msg-time{text-align:left}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:12px 16px}
.typing span{width:6px;height:6px;border-radius:50%;background:#7868a0;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* Chat input */
.chat-input-wrap{padding:12px 16px;border-top:1px solid rgba(200,184,216,.2);display:flex;gap:10px;align-items:flex-end}
.chat-input{flex:1;border:1px solid #d4c8e8;border-radius:12px;padding:10px 14px;font-family:inherit;font-size:13px;color:#1a0a3e;resize:none;outline:none;min-height:42px;max-height:120px;transition:border .2s;background:#fff}
.chat-input:focus{border-color:#6c44a0;box-shadow:0 0 0 3px rgba(108,68,160,.1)}
.chat-input::placeholder{color:#b8a8d0}
.send-btn{width:40px;height:40px;border-radius:10px;border:none;background:linear-gradient(135deg,#5a3d8a,#6c44a0);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.send-btn:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(90,61,138,.3)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#7868a0}
.empty-icon{font-size:48px;opacity:.4}
.empty-text{font-size:14px;font-weight:500;text-align:center;max-width:280px;line-height:1.5}
.new-btn{padding:10px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#5a3d8a,#6c44a0);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.new-btn:hover{transform:scale(1.03);box-shadow:0 4px 16px rgba(90,61,138,.3)}

/* ── RESPONSIVE ── */
@media(max-width:900px){.panel-left{display:none}.main{padding:8px}}

/* ── EDIT BUTTON ── */
.edit-btn{width:20px;height:20px;border-radius:5px;border:none;background:transparent;color:#c9b8d8;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;padding:0}
.edit-btn:hover{background:rgba(108,68,160,.12);color:#6c44a0}
.edit-title-input{width:100%;padding:4px 8px;border:1px solid #6c44a0;border-radius:6px;font-family:inherit;font-size:13px;color:#1a0a3e;outline:none;background:#fff}

/* ── DISCOVERY MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(26,10,62,.55);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:680px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(26,10,62,.3);animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid #e8dff5;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:16px;font-weight:700;color:#1a0a3e;display:flex;align-items:center;gap:8px}
.modal-body{flex:1;padding:20px 24px;overflow-y:auto}
.modal-footer{padding:14px 24px;border-top:1px solid #e8dff5;display:flex;gap:10px;justify-content:flex-end}
.modal-textarea{width:100%;min-height:280px;border:1px solid #d4c8e8;border-radius:12px;padding:16px;font-family:'Outfit',sans-serif;font-size:13px;line-height:1.7;color:#1a0a3e;resize:vertical;outline:none;transition:border .2s}
.modal-textarea:focus{border-color:#6c44a0;box-shadow:0 0 0 3px rgba(108,68,160,.1)}
.modal-textarea::placeholder{color:#b8a8d0}
.modal-hint{font-size:11px;color:#a89bc2;margin-top:8px;line-height:1.4}
.modal-btn{padding:8px 20px;border-radius:8px;border:1px solid #c9b8d8;background:#fff;font-family:inherit;font-size:12px;font-weight:600;color:#5a3d8a;cursor:pointer;transition:all .15s}
.modal-btn:hover{background:#f3eef9}
.modal-btn.primary{background:linear-gradient(135deg,#5a3d8a,#6c44a0);color:#fff;border:none}
.modal-btn.primary:hover{opacity:.9}
.modal-btn.secondary{background:#e8dff5;border-color:#d4c8e8;color:#5a3d8a}
.modal-btn:disabled{opacity:.4;cursor:not-allowed}
.draft-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#22c55e;background:rgba(34,197,94,.1);padding:2px 10px;border-radius:10px;margin-left:auto}

/* ── MIC MODAL ── */
.mic-modal{background:#fff;border-radius:16px;width:500px;max-width:92vw;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(26,10,62,.3);animation:slideUp .25s ease}
.mic-modal-body{padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.mic-circle{width:80px;height:80px;border-radius:50%;border:3px solid #d4c8e8;background:#f3eef9;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.mic-circle:hover{border-color:#6c44a0}
.mic-circle.recording{border-color:#ef4444;background:linear-gradient(135deg,#fce4ec,#fdf2ff);animation:micPulse 1.2s infinite}
.mic-transcript{width:100%;min-height:120px;max-height:200px;overflow-y:auto;border:1px solid #e8dff5;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;color:#1a0a3e;background:#faf8ff;resize:none;font-family:'Outfit',sans-serif;outline:none}
.mic-transcript:focus{border-color:#6c44a0}
.mic-interim-text{font-size:12px;color:#a89bc2;font-style:italic;text-align:center;min-height:18px}
.mic-status{font-size:12px;font-weight:600;color:#7868a0;text-align:center}
.mic-status.on{color:#ef4444}

/* ── OPTIMIZE BTN ── */
.optimize-btn{padding:7px 14px;border-radius:8px;border:1px solid #c9b8d8;background:linear-gradient(135deg,#f3eef9,#e8dff5);font-family:inherit;font-size:12px;font-weight:600;color:#5a3d8a;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.optimize-btn:hover{background:linear-gradient(135deg,#e8dff5,#d4c8e8);border-color:#6c44a0}
.optimize-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── MIC BUTTON ── */
.mic-btn{width:36px;height:36px;border-radius:50%;border:2px solid #d4c8e8;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.mic-btn:hover{border-color:#6c44a0;background:#f3eef9}
.mic-btn.recording{border-color:#ef4444;background:linear-gradient(135deg,#fce4ec,#fdf2ff);animation:micPulse 1.2s infinite}
.mic-interim{font-size:12px;color:#a89bc2;font-style:italic;min-height:18px;margin-top:6px;padding:0 4px}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

/* ── ANALYZE POPUP ── */
.analyze-float{position:fixed;z-index:200;background:linear-gradient(135deg,#5a3d8a,#6c44a0);color:#fff;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(90,61,138,.4);animation:popIn .15s ease;white-space:nowrap;display:flex;align-items:center;gap:5px}
.analyze-float:hover{transform:scale(1.05)}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.analyze-modal{position:fixed;z-index:200;background:#fff;border-radius:14px;width:460px;max-width:90vw;max-height:50vh;box-shadow:0 12px 40px rgba(26,10,62,.25);animation:slideUp .2s ease;overflow:hidden;display:flex;flex-direction:column}
.analyze-modal-header{padding:14px 18px;border-bottom:1px solid #e8dff5;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#f3eef9,#e8dff5)}
.analyze-modal-header h3{font-size:13px;font-weight:700;color:#1a0a3e}
.analyze-modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.analyze-modal-body .quote{font-size:12px;color:#7868a0;font-style:italic;border-left:3px solid #6c44a0;padding-left:10px;margin-bottom:12px;max-height:60px;overflow:hidden}
.analyze-content{font-size:13px;line-height:1.6;color:#1a0a3e}
.analyze-content strong{color:#5a3d8a}
.analyze-spinner{display:flex;align-items:center;gap:8px;color:#7868a0;font-size:13px;padding:12px 0}

/* ── MODAL Discovery Notes ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:90%;max-width:720px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(90,61,138,.2);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 14px;border-bottom:1px solid #e8dff5}
.modal-title{font-size:17px;font-weight:700;color:#1a0a3e}
.modal-subtitle{font-size:11px;color:#7868a0;margin-top:2px}
.modal-body{flex:1;padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-footer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid #e8dff5;justify-content:flex-end}
.modal-textarea{width:100%;min-height:200px;border:1px solid #d4c8e8;border-radius:12px;padding:14px 16px;font-family:'Outfit',sans-serif;font-size:13px;color:#1a0a3e;resize:vertical;outline:none;line-height:1.7;transition:border .2s}
.modal-textarea:focus{border-color:#6c44a0;box-shadow:0 0 0 3px rgba(108,68,160,.1)}
.modal-textarea::placeholder{color:#b8a8d0}
.modal-hint{font-size:11px;color:#a89bc2;line-height:1.5}
.draft-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#d97706;background:#fef3c7;padding:3px 10px;border-radius:8px;border:1px solid #fde68a}

/* ── EDITABLE TITLE ── */

.edit-title-input{border:1px solid #6c44a0;border-radius:6px;padding:3px 8px;font-family:inherit;font-size:13px;font-weight:500;color:#2d1f48;outline:none;width:100%;background:#fff;box-shadow:0 0 0 3px rgba(108,68,160,.12)}

/* ── ANALYZE POPUP ── */
.analyze-float{position:fixed;z-index:90;background:linear-gradient(135deg,#5a3d8a,#6c44a0);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(90,61,138,.35);display:flex;align-items:center;gap:5px;animation:popIn .15s ease}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.analyze-float:hover{transform:scale(1.04)}
.analyze-result{position:fixed;z-index:95;background:#fff;border-radius:14px;border:1px solid #d4c8e8;box-shadow:0 8px 32px rgba(90,61,138,.15);width:420px;max-height:360px;overflow-y:auto;padding:16px 18px;animation:slideUp .2s ease}
.analyze-result h3{font-size:13px;font-weight:700;color:#1a0a3e;margin:10px 0 4px}
.analyze-result h3:first-child{margin-top:0}
.analyze-result p,.analyze-result li{font-size:12px;color:#2d1f48;line-height:1.6}
.analyze-close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:16px;color:#a89bc2;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;
const API = window.location.origin;
function getToken(){ return localStorage.getItem('everi9_token')||''; }
function getUser(){ try{return JSON.parse(localStorage.getItem('everi9_user')||'{}')}catch{return{}} }

// ── Markdown renderer ──
function renderMd(text){
  try {
    marked.setOptions({breaks:true,gfm:true});
    return marked.parse(text||'');
  } catch { return text; }
}

// ══════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════
function App(){
  const [sessions, setSessions] = useState([]);
  const [activeSession, setActiveSession] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [streaming, setStreaming] = useState('');
  const [tab, setTab] = useState('sessions');
  const [showDiscovery, setShowDiscovery] = useState(false);
  const [discoveryNotes, setDiscoveryNotes] = useState('');
  const [editingTitle, setEditingTitle] = useState(null);
  const [editTitleVal, setEditTitleVal] = useState('');
  const [analyzePos, setAnalyzePos] = useState(null);
  const [analyzeText, setAnalyzeText] = useState('');
  const [analyzeResult, setAnalyzeResult] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [recording, setRecording] = useState(false);
  const [micInterim, setMicInterim] = useState('');
  const [micTranscript, setMicTranscript] = useState('');
  const [showMicModal, setShowMicModal] = useState(false);
  const [optimizing, setOptimizing] = useState(false);
  const micRecRef = useRef(null);
  const chatRef = useRef(null);
  const inputRef = useRef(null);

  // ── Mic: start/stop ──
  const toggleMic = useCallback(()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ alert('Web Speech API não suportada. Use Chrome ou Edge.'); return; }
    if(recording){
      try{ micRecRef.current?.stop(); }catch(e){}
      micRecRef.current = null;
      setRecording(false); setMicInterim('');
      return;
    }
    const rec = new SR();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
    rec.onresult = (e) => {
      let interim = '', final = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim = e.results[i][0].transcript;
      }
      if(final) setMicTranscript(prev => prev ? prev + ' ' + final.trim() : final.trim());
      setMicInterim(interim);
    };
    rec.onend = () => { if(micRecRef.current) try{ rec.start(); }catch(e){} };
    rec.onerror = (e) => { if(e.error!=='no-speech'&&e.error!=='aborted'){ setRecording(false); setMicInterim(''); } };
    micRecRef.current = rec;
    rec.start();
    setRecording(true);
  },[recording]);

  // ── Fechar mic modal ──
  const closeMicModal = useCallback(()=>{
    if(recording){ try{ micRecRef.current?.stop(); }catch(e){} micRecRef.current=null; setRecording(false); setMicInterim(''); }
    setShowMicModal(false);
  },[recording]);

  // ── Merge transcript → Discovery ──
  const mergeTranscript = useCallback(()=>{
    if(!micTranscript.trim()) return;
    setDiscoveryNotes(prev => prev ? prev + '\n\n' + micTranscript.trim() : micTranscript.trim());
    setMicTranscript('');
    closeMicModal();
  },[micTranscript, closeMicModal]);

  // ── Otimizar Discovery com DeepSeek ──
  const optimizeDiscovery = useCallback(async ()=>{
    if(!discoveryNotes.trim()) return;
    setOptimizing(true);
    try {
      const r = await fetch(API+'/api/hf-studio/optimize',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},
        body: JSON.stringify({text: discoveryNotes})
      });
      const data = await r.json();
      if(data.optimized) setDiscoveryNotes(data.optimized);
      else alert(data.error||'Erro ao otimizar');
    } catch(e){ alert('Erro: '+e.message); }
    setOptimizing(false);
  },[discoveryNotes]);

  // ── Parar mic ao fechar Discovery ──
  const closeDiscovery = useCallback(()=>{
    if(recording){ try{ micRecRef.current?.stop(); }catch(e){} micRecRef.current=null; setRecording(false); setMicInterim(''); }
    setShowDiscovery(false);
  },[recording]);

  // Load sessions
  const loadSessions = useCallback(async ()=>{
    try {
      const r = await fetch(API+'/api/hf-studio/sessions',{headers:{'Authorization':'Bearer '+getToken()}});
      const data = await r.json();
      if(Array.isArray(data)) setSessions(data);
    } catch(e){ console.error(e); }
  },[]);

  useEffect(()=>{loadSessions()},[loadSessions]);

  // Load session messages
  const loadSession = useCallback(async (id)=>{
    try {
      const r = await fetch(API+'/api/hf-studio/sessions/'+id,{headers:{'Authorization':'Bearer '+getToken()}});
      const data = await r.json();
      setActiveSession(data);
      setMessages(data.messages||[]);
    } catch(e){ console.error(e); }
  },[]);

  // Create new session
  const createSession = async ()=>{
    try {
      const r = await fetch(API+'/api/hf-studio/sessions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()}});
      const data = await r.json();
      await loadSessions();
      await loadSession(data.id);
    } catch(e){ console.error(e); }
  };

  // Delete session
  const deleteSession = async (id,e)=>{
    e.stopPropagation();
    if(!confirm('Deletar esta sessão?')) return;
    await fetch(API+'/api/hf-studio/sessions/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+getToken()}});
    if(activeSession?.id===id){setActiveSession(null);setMessages([]);}
    loadSessions();
  };

  // Rename session
  const renameSession = async (id, newTitle)=>{
    if(!newTitle?.trim()) return;
    await fetch(API+'/api/hf-studio/sessions/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({title:newTitle.trim()})});
    setEditingTitle(null);
    if(activeSession?.id===id) setActiveSession(prev=>({...prev,title:newTitle.trim()}));
    loadSessions();
  };

  // Save discovery notes
  const saveDiscoveryNotes = async ()=>{
    if(!activeSession) return;
    await fetch(API+'/api/hf-studio/sessions/'+activeSession.id,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({discovery_notes:discoveryNotes})});
    loadSessions();
  };

  // Open discovery modal
  const openDiscovery = ()=>{
    setDiscoveryNotes(activeSession?.discovery_notes||'');
    setShowDiscovery(true);
  };

  // Send discovery notes to chat
  const sendDiscoveryToChat = async ()=>{
    if(!discoveryNotes.trim()||!activeSession) return;
    setShowDiscovery(false);
    setInput(discoveryNotes);
  };

  // Analyze selected text
  const doAnalyze = async ()=>{
    if(!analyzeText.trim()) return;
    setAnalyzing(true);
    setAnalyzeResult(null);
    try {
      const r = await fetch(API+'/api/hf-studio/analyze',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({text:analyzeText})});
      const data = await r.json();
      setAnalyzeResult(data.analysis||data.error||'Erro');
    } catch(e){ setAnalyzeResult('Erro: '+e.message); }
    setAnalyzing(false);
    setAnalyzePos(null);
  };

  // Text selection listener for analyze
  useEffect(()=>{
    const onSelect = ()=>{
      const sel = window.getSelection();
      const text = sel?.toString()?.trim();
      if(text && text.length > 10 && chatRef.current?.contains(sel.anchorNode)){
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        setAnalyzeText(text);
        setAnalyzePos({x:rect.left+rect.width/2-40, y:rect.top-40});
      } else {
        setTimeout(()=>{if(!window.getSelection()?.toString()?.trim()) setAnalyzePos(null);},200);
      }
    };
    document.addEventListener('mouseup', onSelect);
    return ()=>document.removeEventListener('mouseup', onSelect);
  },[]);

  // Send message (SSE streaming)
  const sendMessage = async ()=>{
    if(!input.trim()||!activeSession||loading) return;
    const userMsg = input.trim();
    setInput('');
    setMessages(prev=>[...prev,{role:'user',content:userMsg}]);
    setLoading(true);
    setStreaming('');

    try {
      const r = await fetch(API+'/api/hf-studio/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},
        body:JSON.stringify({session_id:activeSession.id,message:userMsg})
      });
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';

      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value,{stream:true});
        const lines = buffer.split('\n');
        buffer = lines.pop()||'';
        for(const line of lines){
          if(!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if(data==='[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            if(parsed.content){ fullText += parsed.content; setStreaming(fullText); }
            if(parsed.error){ fullText += '\n\n⚠️ Erro: '+parsed.error; setStreaming(fullText); }
          } catch{}
        }
      }

      if(fullText){
        setMessages(prev=>[...prev,{role:'assistant',content:fullText}]);
        // Refresh session metadata
        loadSessions();
      }
    } catch(e){
      setMessages(prev=>[...prev,{role:'assistant',content:'⚠️ Erro de conexão: '+e.message}]);
    }
    setStreaming('');
    setLoading(false);
  };

  // Export DOCX
  const exportDocx = async ()=>{
    if(!activeSession) return;
    try {
      const r = await fetch(API+'/api/hf-studio/export-docx',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},
        body:JSON.stringify({session_id:activeSession.id})
      });

      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');a.href=url;a.download='HF_export.docx';a.click();
      URL.revokeObjectURL(url);
    } catch(e){ alert('Erro: '+e.message); }
  };

  useEffect(()=>{
    if(chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  },[messages,streaming]);

      React.createElement('div',{className:'sidebar-icon',title:'Spec Técnica',dangerouslySetInnerHTML:{__html:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'}}),

        React.createElement('div',{className:'panel-card',style:{flex:1,display:'flex',flexDirection:'column'}},
          React.createElement('div',{className:'panel-header'},
            React.createElement('span',{className:'panel-title'},'Manage Data'),
            React.createElement('button',{className:'panel-close',onClick:createSession,title:'Nova sessão'},'＋')
          ),
          React.createElement('div',{className:'panel-body',style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},

            // Select library → Cloud filter
            React.createElement('div',{className:'select-wrap'},
              React.createElement('div',{className:'select-label'},'Select Library'),
              React.createElement('select',{className:'select-box',defaultValue:'all'},
                React.createElement('option',{value:'all'},'Todas as Clouds'),
                React.createElement('option',{value:'sales'},'Sales Cloud'),
                React.createElement('option',{value:'service'},'Service Cloud'),
                React.createElement('option',{value:'revenue'},'Revenue Cloud / RLM'),
                React.createElement('option',{value:'data'},'Data Cloud')
              )
            ),

            // Tabs
            React.createElement('div',{className:'tabs'},
              React.createElement('div',{className:'tab'+(tab==='sessions'?' active':''),onClick:()=>setTab('sessions')},
                'Sessions',
                React.createElement('span',{className:'count'},sessions.length)
              ),
              React.createElement('div',{className:'tab'+(tab==='drafts'?' active':''),onClick:()=>setTab('drafts')},
                'Rascunhos',
                React.createElement('span',{className:'count'},sessions.filter(s=>s.discovery_notes?.trim()).length||0)
              ),
              React.createElement('div',{className:'tab'+(tab==='knowledge'?' active':''),onClick:()=>setTab('knowledge')},
                'Knowledge',
                React.createElement('span',{className:'count'},'KB')
              )
            ),

            // Tab content
            tab==='sessions' ?
              React.createElement('div',{className:'session-list'},
                sessions.length===0 ?
                  React.createElement('div',{style:{textAlign:'center',padding:24,color:'#a89bc2',fontSize:13}},'Nenhuma sessão. Clique + para criar.')
                :
                sessions.map(s=>
                  React.createElement('div',{key:s.id,className:'session-item'+(activeSession?.id===s.id?' active':''),onClick:()=>loadSession(s.id)},
                    React.createElement('div',{style:{flex:1,minWidth:0}},
                      editingTitle===s.id ?
                        React.createElement('input',{
                          className:'edit-title-input',
                          value:editTitleVal,
                          onChange:e=>setEditTitleVal(e.target.value),
                          onKeyDown:e=>{if(e.key==='Enter')renameSession(s.id,editTitleVal);if(e.key==='Escape')setEditingTitle(null)},
                          onBlur:()=>renameSession(s.id,editTitleVal),
                          autoFocus:true,
                          onClick:e=>e.stopPropagation()
                        })
                      :
                        React.createElement('div',{className:'session-title'},React.createElement('span',{className:'session-title-text'},s.title||'Nova HF'),editingTitle!==s.id&&React.createElement('button',{className:'edit-btn',onClick:(e)=>{e.stopPropagation();setEditingTitle(s.id);setEditTitleVal(s.title||'Nova HF')},title:'Renomear'},'✏')),
                      React.createElement('div',{style:{fontSize:10,color:'#a89bc2',marginTop:2}},new Date(s.updated_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}))
                    ),
                    React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6}},
                      React.createElement('span',{className:'session-phase phase-'+s.phase},s.phase==='generated'?'✓ Gerada':s.phase==='confirmation'?'Confirmar':'Discovery'),
                      React.createElement('button',{className:'session-delete',onClick:(e)=>deleteSession(s.id,e)},'✕')
                    )
                  )
                )
              )
            : tab==='drafts' ?
              // ── Aba Rascunhos ──
              React.createElement('div',{className:'session-list'},
                (()=>{
                  const drafts = sessions.filter(s=>s.discovery_notes?.trim());
                  return drafts.length===0 ?
                    React.createElement('div',{style:{textAlign:'center',padding:24,color:'#a89bc2',fontSize:13}},'Nenhum rascunho salvo. Use o botão 📝 Discovery para escrever.')
                  :
                  drafts.map(s=>
                    React.createElement('div',{key:s.id,className:'session-item'+(activeSession?.id===s.id?' active':''),onClick:()=>{loadSession(s.id).then(()=>{
                      setDiscoveryNotes(s.discovery_notes||'');
                      setShowDiscovery(true);

                      React.createElement('div',{style:{flex:1,minWidth:0}},
                        editingTitle===s.id ?
                          React.createElement('input',{
                            className:'edit-title-input',
                            value:editTitleVal,
                            onChange:e=>setEditTitleVal(e.target.value),
                            onKeyDown:e=>{if(e.key==='Enter')renameSession(s.id,editTitleVal);if(e.key==='Escape')setEditingTitle(null)},
                            onBlur:()=>renameSession(s.id,editTitleVal),
                            autoFocus:true,
                            onClick:e=>e.stopPropagation()
                          })
                        :
                          React.createElement('div',{className:'session-title'},React.createElement('span',{className:'session-title-text'},s.title||'Nova HF'),editingTitle!==s.id&&React.createElement('button',{className:'edit-btn',onClick:(e)=>{e.stopPropagation();setEditingTitle(s.id);setEditTitleVal(s.title||'Nova HF')},title:'Renomear'},'✏')),
                        React.createElement('div',{style:{fontSize:11,color:'#7868a0',marginTop:4,lineHeight:1.3,maxHeight:36,overflow:'hidden',textOverflow:'ellipsis'}},
                          (s.discovery_notes||'').slice(0,80) + ((s.discovery_notes||'').length>80?'...':'')
                        ),
                        React.createElement('div',{style:{fontSize:10,color:'#a89bc2',marginTop:3}},new Date(s.updated_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}))
                      ),
                      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6}},
                        React.createElement('span',{style:{fontSize:10,fontWeight:700,color:'#f59e0b',background:'rgba(245,158,11,.1)',padding:'2px 8px',borderRadius:10}},'RASCUNHO'),

              onClick:()=>{setMicTranscript('');setShowMicModal(true);},
              title:'Gravar por voz'
            },
              React.createElement('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'#6c44a0',strokeWidth:2},
                React.createElement('path',{d:'M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z'}),
                React.createElement('path',{d:'M19 10v2a7 7 0 0 1-14 0v-2'}),
                React.createElement('line',{x1:12,y1:19,x2:12,y2:23}),
                React.createElement('line',{x1:8,y1:23,x2:16,y2:23})
              )
            ),
            React.createElement('button',{className:'panel-close',onClick:closeDiscovery},'✕')
          )
        ),
        React.createElement('div',{className:'modal-body'},
          React.createElement('textarea',{
            className:'modal-textarea',
            placeholder:'Escreva aqui suas notas de Discovery...\n\nDescreva a necessidade de negócio, contexto, processos atuais, dores, personas envolvidas, volumes, regras de negócio, etc.\n\nUse o 🎤 para gravar por voz e depois fazer Merge aqui.',
            value:discoveryNotes,
            onChange:e=>setDiscoveryNotes(e.target.value)
          }),
          React.createElement('div',{className:'modal-hint'},'Dica: Selecione qualquer trecho e clique "Analisar", ou use ✨ Otimizar para a AI estruturar tudo.')
        ),
        React.createElement('div',{className:'modal-footer'},
          React.createElement('button',{className:'modal-btn',onClick:()=>{
            const ta = document.querySelector('.modal-textarea');
            if(ta && ta.selectionStart !== ta.selectionEnd){
              const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
              if(sel.length > 5){
                setAnalyzeText(sel); setAnalyzing(true); setAnalyzeResult(null);
                fetch(API+'/api/hf-studio/analyze',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({text:sel})})
                  .then(r=>r.json()).then(d=>{setAnalyzeResult(d.analysis||d.error||'Erro');setAnalyzing(false)})
                  .catch(e=>{setAnalyzeResult('Erro: '+e.message);setAnalyzing(false)});
              }
            }
          }},'🔍 Analisar Seleção'),
          React.createElement('button',{
            className:'optimize-btn',
            onClick:optimizeDiscovery,
            disabled:optimizing||!discoveryNotes.trim()
          }, optimizing ? '⏳ Otimizando...' : '✨ Otimizar'),
          React.createElement('button',{className:'modal-btn secondary',onClick:()=>{saveDiscoveryNotes();closeDiscovery();}},'💾 Salvar Rascunho'),
          React.createElement('button',{className:'modal-btn primary',onClick:()=>{saveDiscoveryNotes();sendDiscoveryToChat()},disabled:!discoveryNotes.trim()},'▶ Enviar para Chat')
        )
      )
    ),

    // ── MIC MODAL ──
    showMicModal && React.createElement('div',{className:'modal-backdrop'},
      React.createElement('div',{className:'mic-modal'},
        React.createElement('div',{className:'modal-header'},
          React.createElement('h2',null,'🎤 Gravação por Voz'),
          React.createElement('button',{className:'panel-close',onClick:closeMicModal},'✕')
        ),
        React.createElement('div',{className:'mic-modal-body'},
          React.createElement('div',{
            className:'mic-circle'+(recording?' recording':''),
            onClick:toggleMic,
            title:recording?'Parar':'Iniciar gravação'
          },
            recording
              ? React.createElement('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'#ef4444'},React.createElement('rect',{x:6,y:6,width:12,height:12,rx:2}))
              : React.createElement('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'none',stroke:'#6c44a0',strokeWidth:2},
                  React.createElement('path',{d:'M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z'}),
                  React.createElement('path',{d:'M19 10v2a7 7 0 0 1-14 0v-2'}),
                  React.createElement('line',{x1:12,y1:19,x2:12,y2:23}),
                  React.createElement('line',{x1:8,y1:23,x2:16,y2:23})
                )
          ),
          React.createElement('div',{className:'mic-status'+(recording?' on':'')}, recording ? '🔴 Gravando em pt-BR...' : 'Clique para iniciar'),
          React.createElement('textarea',{
            className:'mic-transcript',
            value:micTranscript,
            onChange:e=>setMicTranscript(e.target.value),
            placeholder:'O texto transcrito aparecerá aqui...\nVocê pode editar antes de fazer Merge.'
          }),
          micInterim && React.createElement('div',{className:'mic-interim-text'},'...'+micInterim)
        ),
        React.createElement('div',{className:'modal-footer'},
          React.createElement('button',{className:'modal-btn secondary',onClick:()=>setMicTranscript('')},'🗑 Limpar'),
          React.createElement('button',{
            className:'modal-btn primary',
            onClick:mergeTranscript,
            disabled:!micTranscript.trim()
          },'⤵ Merge no Discovery')
        )
      )
    ),

    // ── ANALYZE FLOAT BUTTON ──
    analyzePos && !analyzeResult && React.createElement('div',{
      className:'analyze-float',
      style:{left:analyzePos.x,top:analyzePos.y},
      onClick:doAnalyze
    },'🔍 Analisar'),

    // ── ANALYZE RESULT MODAL ──
    (analyzing || analyzeResult) && React.createElement('div',{className:'modal-backdrop',onClick:()=>{setAnalyzeResult(null);setAnalyzing(false);setAnalyzePos(null)}},
      React.createElement('div',{className:'analyze-modal',onClick:e=>e.stopPropagation()},
        React.createElement('div',{className:'analyze-modal-header'},
          React.createElement('h3',null,'🔍 Análise AI'),
          React.createElement('button',{className:'panel-close',onClick:()=>{setAnalyzeResult(null);setAnalyzing(false);setAnalyzePos(null)}},'✕')
        ),
        React.createElement('div',{className:'analyze-modal-body'},
          React.createElement('div',{className:'quote'},'"',analyzeText.slice(0,150),analyzeText.length>150?'...':'','"'),
          analyzing ?
            React.createElement('div',{className:'analyze-spinner'},
              React.createElement('div',{className:'typing',style:{padding:0}},React.createElement('span'),React.createElement('span'),React.createElement('span')),
              'Analisando com DeepSeek...'
            )
          :
          React.createElement('div',{className:'analyze-content',dangerouslySetInnerHTML:{__html:renderMd(analyzeResult||'')}})
        )
      )
    )

  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
