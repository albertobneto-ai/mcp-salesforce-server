<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ever i9 — HF Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   HF STUDIO — NIMBUS DESIGN SYSTEM v2
   Radical visual overhaul: white-first, bold typography
   ═══════════════════════════════════════════════════ */
:root {
  --accent: #6C44A0;
  --accent-deep: #430098;
  --accent-bright: #9B7BD4;
  --accent-surface: #F0EAFF;
  --bg: #F7FBFD;
  --surface: #ffffff;
  --border: #E2EEF4;
  --border-accent: #D4C8E8;
  --text: #0C2433;
  --text-secondary: #56707F;
  --text-muted: #7C93A1;
  --success: #28C840;
  --success-bg: #E9F8EF;
  --warning: #FEBC2E;
  --warning-bg: #FEF3C7;
  --danger: #FF5F57;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);overflow:hidden;height:100vh;background:var(--bg)}
::selection{background:rgba(108,68,160,.15)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-accent);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent-bright)}

/* ═══ LAYOUT ═══ */
.app{display:flex;height:100vh;width:100vw}

/* ═══ SIDEBAR — Nimbus vertical nav ═══ */
.sidebar{
  width:62px;min-width:62px;
  background:linear-gradient(180deg,var(--accent-deep) 0%,#3a1a7a 40%,var(--accent) 100%);
  display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;z-index:10;
}
.sidebar-icon{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;color:rgba(255,255,255,.4);font-size:18px;position:relative;
}
.sidebar-icon:hover{background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);transform:scale(1.06)}
.sidebar-icon.active{
  background:rgba(255,255,255,.18);color:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);
}
.sidebar-icon.active::after{
  content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:3px 0 0 3px;background:#fff;
}
.sidebar-logo{
  width:40px;height:40px;border-radius:12px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:var(--accent-deep);font-size:15px;
  margin-bottom:16px;letter-spacing:-0.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.sidebar-spacer{flex:1}

/* ═══ MAIN AREA — clean white canvas ═══ */
.main{
  flex:1;display:flex;gap:0;
  background:var(--bg);
  padding:0;overflow:hidden;
}

/* ═══ PANEL LEFT — white card flush ═══ */
.panel-left{
  width:340px;min-width:300px;display:flex;flex-direction:column;
  border-right:1px solid var(--border);background:var(--surface);
}
.panel-card{
  background:var(--surface);
  border-radius:0;border:none;box-shadow:none;
  overflow:hidden;display:flex;flex-direction:column;
}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 24px 18px;border-bottom:1px solid var(--border);
}
.panel-title{
  font-family:var(--font-display);font-weight:700;font-size:18px;
  color:var(--text);letter-spacing:-.02em;
}
.panel-close{
  width:32px;height:32px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--accent);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:600;transition:all .15s;
}
.panel-close:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.05)}
.panel-body{padding:20px 24px;flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ═══ SELECT ═══ */
.select-wrap{position:relative;margin-bottom:16px}
.select-label{
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:block;
}
.select-box{
  width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);font-family:var(--font-body);font-size:13.5px;color:var(--text);
  cursor:pointer;appearance:none;outline:none;transition:all .2s;font-weight:500;
}
.select-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,68,160,.08)}

/* ═══ TABS — Nimbus style ═══ */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;gap:0}
.tab{
  padding:10px 20px;font-family:var(--font-body);font-size:13.5px;font-weight:600;
  color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .2s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{
  background:var(--bg);color:var(--text-secondary);
  font-family:var(--font-mono);font-size:10px;font-weight:600;
  padding:2px 8px;border-radius:999px;margin-left:8px;
}
.tab.active .count{background:var(--accent-surface);color:var(--accent)}

/* ═══ SESSION LIST ═══ */
.session-list{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto;padding-right:4px}
.session-item{
  padding:12px 16px;border-radius:12px;background:transparent;
  cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:space-between;
  border:1px solid transparent;
}
.session-item:hover{background:var(--bg)}
.session-item.active{background:var(--accent-surface);border-color:var(--border-accent)}
.session-title{font-size:13.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.session-title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.session-phase{
  font-family:var(--font-mono);font-size:9px;font-weight:600;
  padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;
}
.phase-discovery{background:var(--accent-surface);color:var(--accent)}
.phase-confirmation{background:var(--warning-bg);color:#D97706}
.phase-generated{background:var(--success-bg);color:#1B9E5A}
.session-delete{
  width:24px;height:24px;border-radius:8px;border:none;background:transparent;
  color:var(--text-muted);cursor:pointer;font-size:12px;
  display:flex;align-items:center;justify-content:center;transition:all .12s;opacity:.5;
}
.session-item:hover .session-delete{opacity:1}
.session-delete:hover{background:rgba(255,95,87,.08);color:var(--danger)}

/* ═══ SETTINGS ═══ */
.settings-section{border-top:1px solid var(--border);padding-top:14px;margin-top:10px}
.settings-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-secondary)}
.settings-toggle svg{transition:transform .2s}
.field-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0}
.field-label{font-size:12.5px;color:var(--text);font-weight:500}
.field-bar{height:5px;border-radius:3px;flex:1;margin-left:14px;max-width:120px}

/* ═══ PANEL RIGHT — conversation canvas ═══ */
.panel-right{flex:1;display:flex;flex-direction:column;margin-left:0}
.conv-card{
  flex:1;background:var(--surface);
  border-radius:0;border:none;box-shadow:none;
  display:flex;flex-direction:column;overflow:hidden;
}
.conv-header{
  padding:20px 28px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);
}
.conv-title{
  font-family:var(--font-display);font-weight:700;font-size:19px;
  color:var(--text);letter-spacing:-.02em;
}
.conv-actions{display:flex;gap:10px}
.conv-btn{
  padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--text-secondary);
  cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;
}
.conv-btn:hover{background:var(--bg);border-color:var(--border-accent);color:var(--text)}
.conv-btn.primary{
  background:var(--accent);
  color:#fff;border:none;
}
.conv-btn.primary:hover{background:var(--accent-deep);box-shadow:0 6px 20px rgba(67,0,152,.25)}
.conv-btn:disabled{opacity:.35;cursor:not-allowed}

/* ═══ CHAT MESSAGES — clean Nimbus cards ═══ */
.chat-area{flex:1;padding:28px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.msg{max-width:78%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg-bubble{padding:16px 20px;border-radius:16px;font-size:14px;line-height:1.7;color:var(--text)}
.msg.user .msg-bubble{
  background:var(--accent);color:#fff;border-bottom-right-radius:4px;
}
.msg.assistant .msg-bubble{
  background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;
}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{margin:14px 0 6px;font-family:var(--font-display);letter-spacing:-.02em}
.msg-bubble h1{font-size:18px;font-weight:700}.msg-bubble h2{font-size:16px;font-weight:700}.msg-bubble h3{font-size:14px;font-weight:600}
.msg-bubble table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px;border-radius:8px;overflow:hidden}
.msg-bubble th{background:var(--text);color:#fff;padding:8px 12px;text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.msg-bubble td{padding:7px 12px;border-bottom:1px solid var(--border)}
.msg-bubble tr:nth-child(even) td{background:var(--bg)}
.msg-bubble code{background:rgba(108,68,160,.07);padding:2px 7px;border-radius:6px;font-family:var(--font-mono);font-size:12px;color:var(--accent-deep)}
.msg-bubble pre{background:#0B1C28;color:#C7D7E0;padding:16px;border-radius:12px;overflow-x:auto;margin:12px 0;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}
.msg-bubble pre code{background:transparent;color:inherit;padding:0}
.msg-bubble ul,.msg-bubble ol{padding-left:20px;margin:6px 0}
.msg-bubble blockquote{border-left:3px solid var(--accent);padding-left:14px;margin:8px 0;font-style:italic;color:var(--text-secondary)}
.msg-time{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px;text-align:right;letter-spacing:.02em}
.msg.assistant .msg-time{text-align:left}

/* ═══ TYPING ═══ */
.typing{display:flex;gap:5px;padding:14px 18px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--accent-bright);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ═══ CHAT INPUT — clean bottom bar ═══ */
.chat-input-wrap{
  padding:16px 28px;border-top:1px solid var(--border);
  display:flex;gap:12px;align-items:flex-end;background:var(--surface);
}
.chat-input{
  flex:1;border:1px solid var(--border);border-radius:14px;padding:13px 18px;
  font-family:var(--font-body);font-size:14px;color:var(--text);resize:none;outline:none;
  min-height:48px;max-height:120px;transition:all .2s;background:var(--bg);font-weight:500;
}
.chat-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,68,160,.06);background:var(--surface)}
.chat-input::placeholder{color:var(--text-muted);font-weight:400}
.send-btn{
  width:48px;height:48px;border-radius:14px;border:none;
  background:var(--accent);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.send-btn:hover{background:var(--accent-deep);transform:scale(1.04)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

/* ═══ EMPTY STATE ═══ */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--text-muted)}
.empty-icon{font-size:56px;opacity:.3}
.empty-text{
  font-size:15px;font-weight:500;text-align:center;max-width:320px;line-height:1.6;
  color:var(--text-secondary);
}
.new-btn{
  padding:13px 30px;border-radius:12px;border:none;
  background:var(--accent);
  color:#fff;font-family:var(--font-body);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .15s;letter-spacing:-.01em;
}
.new-btn:hover{background:var(--accent-deep);transform:translateY(-1px);box-shadow:0 8px 24px rgba(67,0,152,.2)}

/* ═══ EDIT ═══ */
.edit-btn{
  width:22px;height:22px;border-radius:6px;border:none;background:transparent;
  color:var(--text-muted);cursor:pointer;font-size:11px;
  display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;padding:0;
}
.edit-btn:hover{background:rgba(108,68,160,.08);color:var(--accent)}
.edit-title-input{
  width:100%;padding:5px 10px;border:1.5px solid var(--accent);border-radius:8px;
  font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--text);outline:none;
  background:var(--surface);box-shadow:0 0 0 3px rgba(108,68,160,.08);
}

/* ═══ MODALS ═══ */
.modal-backdrop,.modal-overlay{
  position:fixed;inset:0;background:rgba(12,36,51,.5);
  backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:20px;width:700px;max-width:92vw;max-height:85vh;
  display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(12,36,51,.25),0 0 0 1px rgba(0,0,0,.05);
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 28px 18px;border-bottom:1px solid var(--border);
}
.modal-header h2{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.modal-title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text)}
.modal-subtitle{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:3px}
.modal-body{flex:1;padding:24px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-footer{display:flex;gap:10px;padding:18px 28px;border-top:1px solid var(--border);justify-content:flex-end;flex-wrap:wrap}
.modal-textarea{
  width:100%;min-height:260px;border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--text);
  resize:vertical;outline:none;transition:all .2s;background:var(--bg);
}
.modal-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,68,160,.06);background:var(--surface)}
.modal-textarea::placeholder{color:var(--text-muted)}
.modal-hint{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.modal-btn{
  padding:10px 22px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--text-secondary);
  cursor:pointer;transition:all .12s;
}
.modal-btn:hover{background:var(--bg);color:var(--text)}
.modal-btn.primary{background:var(--accent);color:#fff;border:none}
.modal-btn.primary:hover{background:var(--accent-deep)}
.modal-btn.secondary{background:var(--bg);border-color:var(--border);color:var(--text-secondary)}
.modal-btn.secondary:hover{background:var(--border)}
.modal-btn:disabled{opacity:.35;cursor:not-allowed}
.draft-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-mono);font-size:10px;font-weight:600;
  color:#D97706;background:var(--warning-bg);padding:3px 10px;border-radius:999px;
}

/* ═══ MIC MODAL ═══ */
.mic-modal{
  background:var(--surface);border-radius:20px;width:520px;max-width:92vw;
  display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(12,36,51,.25);animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
.mic-modal-body{padding:32px;display:flex;flex-direction:column;align-items:center;gap:20px}
.mic-circle{
  width:88px;height:88px;border-radius:50%;border:2px solid var(--border);
  background:var(--bg);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .3s;
}
.mic-circle:hover{border-color:var(--accent);transform:scale(1.06);background:var(--surface)}
.mic-circle.recording{border-color:var(--danger);background:rgba(255,95,87,.06);animation:micPulse 1.4s infinite}
.mic-transcript{
  width:100%;min-height:120px;max-height:200px;overflow-y:auto;
  border:1px solid var(--border);border-radius:14px;padding:16px 18px;
  font-size:14px;line-height:1.7;color:var(--text);background:var(--bg);
  resize:none;font-family:var(--font-body);outline:none;
}
.mic-transcript:focus{border-color:var(--accent);background:var(--surface)}
.mic-interim-text{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);font-style:italic;text-align:center;min-height:18px}
.mic-status{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-muted);text-align:center}
.mic-status.on{color:var(--danger)}
.mic-btn{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;
}
.mic-btn:hover{border-color:var(--accent);background:var(--accent-surface);transform:scale(1.06)}
.mic-btn.recording{border-color:var(--danger);background:rgba(255,95,87,.06);animation:micPulse 1.4s infinite}
.mic-interim{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);font-style:italic;min-height:18px;margin-top:6px;padding:0 4px}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,95,87,.25)}50%{box-shadow:0 0 0 12px rgba(255,95,87,0)}}

/* ═══ OPTIMIZE ═══ */
.optimize-btn{
  padding:10px 20px;border-radius:10px;border:1px solid var(--border-accent);
  background:var(--accent-surface);
  font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--accent);
  cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px;
}
.optimize-btn:hover{background:var(--border-accent);border-color:var(--accent)}
.optimize-btn:disabled{opacity:.35;cursor:not-allowed}

/* ═══ ANALYZE ═══ */
.analyze-float{
  position:fixed;z-index:200;
  background:var(--accent);color:#fff;
  padding:8px 18px;border-radius:10px;
  font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 24px rgba(67,0,152,.35);animation:popIn .15s ease;
  white-space:nowrap;display:flex;align-items:center;gap:6px;border:none;
}
.analyze-float:hover{transform:scale(1.05);background:var(--accent-deep)}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.analyze-modal{
  position:fixed;z-index:200;background:var(--surface);border-radius:18px;
  width:480px;max-width:90vw;max-height:50vh;
  box-shadow:0 20px 60px rgba(12,36,51,.2);animation:slideUp .25s ease;

// ── Markdown renderer ──
function renderMd(text){
  try {
    marked.setOptions({breaks:true,gfm:true});
    return marked.parse(text||'');
  } catch { return text; }
}

// MAIN APP

function App(){
  const [sessions, setSessions] = useState([]);

  const [micInterim, setMicInterim] = useState('');
  const [micTranscript, setMicTranscript] = useState('');
  const [showMicModal, setShowMicModal] = useState(false);

  const micRecRef = useRef(null);
  const chatRef = useRef(null);
  const inputRef = useRef(null);

  // ── Mic: start/stop ──
  const toggleMic = useCallback(()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ alert('Web Speech API não suportada. Use Chrome ou Edge.'); return; }
    if(recording){
      try{ micRecRef.current?.stop(); }catch(e){}
      micRecRef.current = null;
      setRecording(false); setMicInterim('');
      return;
    }
    const rec = new SR();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
    rec.onresult = (e) => {
      let interim = '', final = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim = e.results[i][0].transcript;
      }
      if(final) setMicTranscript(prev => prev ? prev + ' ' + final.trim() : final.trim());
      setMicInterim(interim);
    };
    rec.onend = () => { if(micRecRef.current) try{ rec.start(); }catch(e){} };
    rec.onerror = (e) => { if(e.error!=='no-speech'&&e.error!=='aborted'){ setRecording(false); setMicInterim(''); } };
    micRecRef.current = rec;
    rec.start();
    setRecording(true);
  },[recording]);

  // ── Fechar mic modal ──
  const closeMicModal = useCallback(()=>{
    if(recording){ try{ micRecRef.current?.stop(); }catch(e){} micRecRef.current=null; setRecording(false); setMicInterim(''); }
    setShowMicModal(false);
  },[recording]);

  // ── Merge transcript → Discovery ──
  const mergeTranscript = useCallback(()=>{
    if(!micTranscript.trim()) return;
    setDiscoveryNotes(prev => prev ? prev + '\n\n' + micTranscript.trim() : micTranscript.trim());
    setMicTranscript('');
    closeMicModal();
  },[micTranscript, closeMicModal]);

  // ── Otimizar Discovery com DeepSeek ──
  const optimizeDiscovery = useCallback(async ()=>{
    if(!discoveryNotes.trim()) return;
    setOptimizing(true);
    try {
      const r = await fetch(API+'/api/hf-studio/optimize',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},
        body: JSON.stringify({text: discoveryNotes})
      });
      const data = await r.json();
      if(data.optimized) setDiscoveryNotes(data.optimized);
      else alert(data.error||'Erro ao otimizar');
    } catch(e){ alert('Erro: '+e.message); }
    setOptimizing(false);
  },[discoveryNotes]);

  // ── Parar mic ao fechar Discovery ──
  const closeDiscovery = useCallback(()=>{
    if(recording){ try{ micRecRef.current?.stop(); }catch(e){} micRecRef.current=null; setRecording(false); setMicInterim(''); }
    setShowDiscovery(false);
  },[recording]);

  // Load sessions
  const loadSessions = useCallback(async ()=>{
    try {
      const r = await fetch(API+'/api/hf-studio/sessions',{headers:{'Authorization':'Bearer '+getToken()}});
      const data = await r.json();
      if(Array.isArray(data)) setSessions(data);
    } catch(e){ console.error(e); }
  },[]);

  useEffect(()=>{loadSessions()},[loadSessions]);

  // Load session messages
  const loadSession = useCallback(async (id)=>{
    try {
      const r = await fetch(API+'/api/hf-studio/sessions/'+id,{headers:{'Authorization':'Bearer '+getToken()}});
      const data = await r.json();
      setActiveSession(data);
      setMessages(data.messages||[]);
    } catch(e){ console.error(e); }
  },[]);

  // Create new session
  const createSession = async ()=>{
    try {
      const r = await fetch(API+'/api/hf-studio/sessions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()}});
      const data = await r.json();
      await loadSessions();
      await loadSession(data.id);
    } catch(e){ console.error(e); }
  };

  const deleteSession = async (id,e)=>{
    e.stopPropagation();
    if(!confirm('Deletar esta sessão?')) return;
    await fetch(API+'/api/hf-studio/sessions/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+getToken()}});

    loadSessions();

  const renameSession = async (id, newTitle)=>{

    await fetch(API+'/api/hf-studio/sessions/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({title:newTitle.trim()})});

    setAnalyzing(false);
    setAnalyzePos(null);
  };

  useEffect(()=>{

      const sel = window.getSelection();
      const text = sel?.toString()?.trim();
      if(text && text.length > 10 && chatRef.current?.contains(sel.anchorNode)){
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        setAnalyzeText(text);
        setAnalyzePos({x:rect.left+rect.width/2-40, y:rect.top-40});
      } else {
        setTimeout(()=>{if(!window.getSelection()?.toString()?.trim()) setAnalyzePos(null);},200);
      }
    };
    document.addEventListener('mouseup', onSelect);
    return ()=>document.removeEventListener('mouseup', onSelect);
  },[]);

  // Send message (SSE streaming)
  const sendMessage = async ()=>{
    if(!input.trim()||!activeSession||loading) return;
    const userMsg = input.trim();
    setInput('');
    setMessages(prev=>[...prev,{role:'user',content:userMsg}]);
    setLoading(true);
    setStreaming('');

    try {
      const r = await fetch(API+'/api/hf-studio/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},
        body:JSON.stringify({session_id:activeSession.id,message:userMsg})
      });
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';

      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value,{stream:true});
        const lines = buffer.split('\n');
        buffer = lines.pop()||'';
        for(const line of lines){
          if(!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if(data==='[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            if(parsed.content){ fullText += parsed.content; setStreaming(fullText); }
            if(parsed.error){ fullText += '\n\n⚠️ Erro: '+parsed.error; setStreaming(fullText); }
          } catch{}
        }
      }

      if(fullText){
        setMessages(prev=>[...prev,{role:'assistant',content:fullText}]);
        // Refresh session metadata
        loadSessions();
      }
    } catch(e){
      setMessages(prev=>[...prev,{role:'assistant',content:'⚠️ Erro de conexão: '+e.message}]);
    }
    setStreaming('');
    setLoading(false);
  };

      URL.revokeObjectURL(url);
    } catch(e){ alert('Erro: '+e.message); }
  };

  // Auto-scroll
  useEffect(()=>{
    if(chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  },[messages,streaming]);

  // Handle Enter
  const handleKey = (e)=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
  };

      React.createElement('div',{className:'sidebar-logo'},'i9'),

      React.createElement('div',{className:'sidebar-icon',title:'Chat Principal',onClick:()=>window.parent?.postMessage('hf-closed','*'),dangerouslySetInnerHTML:{__html:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'}}),
      React.createElement('div',{className:'sidebar-icon',title:'Spec Técnica',dangerouslySetInnerHTML:{__html:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'}}),

            )
          :
          React.createElement(React.Fragment,null,
            React.createElement('div',{className:'chat-area',ref:chatRef},
              messages.length===0 && !streaming &&
                React.createElement('div',{className:'empty-state'},
                  React.createElement('div',{className:'empty-icon'},'💬'),
                  React.createElement('div',{className:'empty-text'},'Descreva sua necessidade de negócio Salesforce. O DeepSeek vai conduzir o Discovery e gerar a História Funcional.')
                ),
              messages.map((m,i)=>
                React.createElement('div',{key:i,className:'msg '+m.role},
                  React.createElement('div',{className:'msg-bubble',
                    ...(m.role==='assistant' ? {dangerouslySetInnerHTML:{__html:renderMd(m.content)}} : {children:m.content})
                  }),
                  React.createElement('div',{className:'msg-time'},
                    m.role==='user'?'Você':'DeepSeek'
                  )
                )
              ),
              streaming &&
                React.createElement('div',{className:'msg assistant'},
                  React.createElement('div',{className:'msg-bubble',dangerouslySetInnerHTML:{__html:renderMd(streaming)}}),
                  React.createElement('div',{className:'msg-time'},'DeepSeek • digitando...')
                ),
              loading && !streaming &&
                React.createElement('div',{className:'msg assistant'},
                  React.createElement('div',{className:'typing'},
                    React.createElement('span'),React.createElement('span'),React.createElement('span')
                  )
                )
            ),

            // Input
            React.createElement('div',{className:'chat-input-wrap'},
              React.createElement('textarea',{
                ref:inputRef,
                className:'chat-input',
                placeholder:'Describe your task or ask your question...',
                value:input,
                onChange:e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'},
                onKeyDown:handleKey,
                disabled:loading,
                rows:1
              }),
              React.createElement('button',{className:'send-btn',onClick:sendMessage,disabled:loading||!input.trim()},
                React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'currentColor'},
                  React.createElement('path',{d:'M2.01 21L23 12 2.01 3 2 10l15 2-15 2z'})
                )
              )
            )
          )
        )
      )
    ),

    // ── DISCOVERY MODAL ──
    showDiscovery && React.createElement('div',{className:'modal-backdrop'},
      React.createElement('div',{className:'modal'},
        React.createElement('div',{className:'modal-header'},
          React.createElement('h2',null,'📝 Discovery — Notas e Contexto'),
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,marginLeft:'auto'}},
            React.createElement('button',{
              className:'mic-btn',
              onClick:()=>{setMicTranscript('');setShowMicModal(true);},
              title:'Gravar por voz'
            },
              React.createElement('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'#6c44a0',strokeWidth:2},
                React.createElement('path',{d:'M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z'}),
                React.createElement('path',{d:'M19 10v2a7 7 0 0 1-14 0v-2'}),
                React.createElement('line',{x1:12,y1:19,x2:12,y2:23}),
                React.createElement('line',{x1:8,y1:23,x2:16,y2:23})
              )
            ),
            React.createElement('button',{className:'panel-close',onClick:closeDiscovery},'✕')
          )
        ),
        React.createElement('div',{className:'modal-body'},
          React.createElement('textarea',{
            className:'modal-textarea',
            placeholder:'Escreva aqui suas notas de Discovery...\n\nDescreva a necessidade de negócio, contexto, processos atuais, dores, personas envolvidas, volumes, regras de negócio, etc.\n\nUse o 🎤 para gravar por voz e depois fazer Merge aqui.',
            value:discoveryNotes,
            onChange:e=>setDiscoveryNotes(e.target.value)
          }),
          React.createElement('div',{className:'modal-hint'},'Dica: Selecione qualquer trecho e clique "Analisar", ou use ✨ Otimizar para a AI estruturar tudo.')
        ),
        React.createElement('div',{className:'modal-footer'},
          React.createElement('button',{className:'modal-btn',onClick:()=>{
            const ta = document.querySelector('.modal-textarea');
            if(ta && ta.selectionStart !== ta.selectionEnd){
              const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
              if(sel.length > 5){
                setAnalyzeText(sel); setAnalyzing(true); setAnalyzeResult(null);
                fetch(API+'/api/hf-studio/analyze',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({text:sel})})
                  .then(r=>r.json()).then(d=>{setAnalyzeResult(d.analysis||d.error||'Erro');setAnalyzing(false)})
                  .catch(e=>{setAnalyzeResult('Erro: '+e.message);setAnalyzing(false)});
              }
            }
          }},'🔍 Analisar Seleção'),
          React.createElement('button',{
            className:'optimize-btn',
            onClick:optimizeDiscovery,
            disabled:optimizing||!discoveryNotes.trim()
          }, optimizing ? '⏳ Otimizando...' : '✨ Otimizar'),
          React.createElement('button',{className:'modal-btn secondary',onClick:()=>{saveDiscoveryNotes();closeDiscovery();}},'💾 Salvar Rascunho'),
          React.createElement('button',{className:'modal-btn primary',onClick:()=>{saveDiscoveryNotes();sendDiscoveryToChat()},disabled:!discoveryNotes.trim()},'▶ Enviar para Chat')
        )
      )
    ),

    // ── MIC MODAL ──
    showMicModal && React.createElement('div',{className:'modal-backdrop'},
      React.createElement('div',{className:'mic-modal'},
        React.createElement('div',{className:'modal-header'},
          React.createElement('h2',null,'🎤 Gravação por Voz'),
          React.createElement('button',{className:'panel-close',onClick:closeMicModal},'✕')
        ),
        React.createElement('div',{className:'mic-modal-body'},
          React.createElement('div',{
            className:'mic-circle'+(recording?' recording':''),
            onClick:toggleMic,
            title:recording?'Parar':'Iniciar gravação'
          },
            recording
              ? React.createElement('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'#ef4444'},React.createElement('rect',{x:6,y:6,width:12,height:12,rx:2}))
              : React.createElement('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'none',stroke:'#6c44a0',strokeWidth:2},
                  React.createElement('path',{d:'M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z'}),
                  React.createElement('path',{d:'M19 10v2a7 7 0 0 1-14 0v-2'}),
                  React.createElement('line',{x1:12,y1:19,x2:12,y2:23}),
                  React.createElement('line',{x1:8,y1:23,x2:16,y2:23})
                )
          ),
          React.createElement('div',{className:'mic-status'+(recording?' on':'')}, recording ? '🔴 Gravando em pt-BR...' : 'Clique para iniciar'),
          React.createElement('textarea',{
            className:'mic-transcript',
            value:micTranscript,
            onChange:e=>setMicTranscript(e.target.value),
            placeholder:'O texto transcrito aparecerá aqui...\nVocê pode editar antes de fazer Merge.'
          }),
          micInterim && React.createElement('div',{className:'mic-interim-text'},'...'+micInterim)
        ),
        React.createElement('div',{className:'modal-footer'},
          React.createElement('button',{className:'modal-btn secondary',onClick:()=>setMicTranscript('')},'🗑 Limpar'),
          React.createElement('button',{
            className:'modal-btn primary',
            onClick:mergeTranscript,
            disabled:!micTranscript.trim()
          },'⤵ Merge no Discovery')
        )
      )
    ),

    // ── ANALYZE FLOAT BUTTON ──
    analyzePos && !analyzeResult && React.createElement('div',{
      className:'analyze-float',
      style:{left:analyzePos.x,top:analyzePos.y},
      onClick:doAnalyze
    },'🔍 Analisar'),

    // ── ANALYZE RESULT MODAL ──
    (analyzing || analyzeResult) && React.createElement('div',{className:'modal-backdrop',onClick:()=>{setAnalyzeResult(null);setAnalyzing(false);setAnalyzePos(null)}},
      React.createElement('div',{className:'analyze-modal',onClick:e=>e.stopPropagation()},
        React.createElement('div',{className:'analyze-modal-header'},
          React.createElement('h3',null,'🔍 Análise AI'),
          React.createElement('button',{className:'panel-close',onClick:()=>{setAnalyzeResult(null);setAnalyzing(false);setAnalyzePos(null)}},'✕')
        ),
        React.createElement('div',{className:'analyze-modal-body'},
          React.createElement('div',{className:'quote'},'"',analyzeText.slice(0,150),analyzeText.length>150?'...':'','"'),
          analyzing ?
            React.createElement('div',{className:'analyze-spinner'},
              React.createElement('div',{className:'typing',style:{padding:0}},React.createElement('span'),React.createElement('span'),React.createElement('span')),
              'Analisando com DeepSeek...'
            )
          :
          React.createElement('div',{className:'analyze-content',dangerouslySetInnerHTML:{__html:renderMd(analyzeResult||'')}})
        )
      )
    )

  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
