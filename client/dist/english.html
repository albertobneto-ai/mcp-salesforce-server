<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechEnglish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e10;
  --bg-2: #16161a;
  --bg-3: #1e1e24;
  --border: #2a2a32;
  --accent: #7c6dfa;
  --accent-dim: #3d3580;
  --text: #e8e8f0;
  --text-2: #9090a8;
  --text-3: #55556a;
  --green: #4ade80;
  --red: #f87171;
  --mono: 'DM Mono', monospace;
  --sans: 'Syne', sans-serif;
  --radius: 10px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

#app { height: 100%; display: flex; flex-direction: column; }

.screen { flex: 1; }
.hidden { display: none !important; }

/* LOGIN */
#login-screen {
  display: flex; align-items: center; justify-content: center; height: 100vh;
  background: var(--bg);
}

.login-box {
  width: 100%; max-width: 360px; padding: 2.5rem;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px;
  display: flex; flex-direction: column; gap: 1rem;
}

.logo {
  display: flex; align-items: center; gap: 10px;
}
.logo-icon { font-size: 24px; }
.logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
.logo.small .logo-text { font-size: 16px; }
.logo.small .logo-icon { font-size: 18px; }

.login-sub { font-size: 13px; color: var(--text-2); margin-top: -4px; }

input[type="password"], textarea {
  width: 100%; padding: 12px 14px;
  background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-family: var(--mono); font-size: 14px;
  outline: none; transition: border-color 0.2s;
  resize: none;
}
input[type="password"]:focus, textarea:focus { border-color: var(--accent); }

.btn-primary {
  padding: 12px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius); font-family: var(--sans);
  font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.85; }

.error-msg { font-size: 12px; color: var(--red); min-height: 16px; }

/* HEADER */
#main-screen { display: flex; flex-direction: column; height: 100vh; }

.header {
  display: flex; align-items: center; gap: 1.5rem;
  padding: 0 1.5rem; height: 56px; border-bottom: 1px solid var(--border);
  background: var(--bg-2); flex-shrink: 0;
}

.nav { display: flex; gap: 4px; flex: 1; }
.nav-btn {
  padding: 6px 14px; background: none; border: none; border-radius: 6px;
  color: var(--text-2); font-family: var(--sans); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.nav-btn:hover { color: var(--text); background: var(--bg-3); }
.nav-btn.active { color: var(--accent); background: var(--bg-3); }

.btn-ghost {
  padding: 6px 12px; background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-2); font-family: var(--sans); font-size: 13px; cursor: pointer;
  transition: all 0.15s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text-3); }

/* VIEWS */
.view { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* SCENARIO SELECT */
.scenario-select {
  flex: 1; overflow-y: auto; padding: 3rem 2rem;
  display: flex; flex-direction: column; align-items: center;
}

.page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.page-sub { font-size: 14px; color: var(--text-2); margin-bottom: 2.5rem; }

.scenario-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem; width: 100%; max-width: 720px;
}

.scenario-card {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.5rem; cursor: pointer; transition: all 0.2s; text-align: left;
}
.scenario-card:hover {
  border-color: var(--accent); background: var(--bg-3);
  transform: translateY(-2px);
}

.scenario-icon { font-size: 28px; margin-bottom: 12px; display: block; }
.scenario-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.scenario-desc { font-size: 13px; color: var(--text-2); line-height: 1.5; }

/* CHAT */
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 1.5rem; border-bottom: 1px solid var(--border);
  background: var(--bg-2); flex-shrink: 0;
}

.chat-meta { display: flex; align-items: center; gap: 12px; }

.scenario-badge {
  font-size: 12px; font-weight: 600; color: var(--accent);
  background: var(--accent-dim); padding: 4px 10px; border-radius: 100px;
}

.timer {
  font-family: var(--mono); font-size: 13px; color: var(--text-2);
}

.btn-end {
  padding: 7px 14px; background: none; border: 1px solid var(--accent);
  border-radius: 7px; color: var(--accent); font-family: var(--sans);
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.btn-end:hover { background: var(--accent); color: #fff; }

/* MESSAGES */
.messages {
  flex: 1; overflow-y: auto; padding: 1.5rem;
  display: flex; flex-direction: column; gap: 1rem;
}

.message {
  max-width: 75%; display: flex; flex-direction: column; gap: 4px;
  animation: fadeUp 0.2s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message.assistant { align-self: flex-start; }
.message.user { align-self: flex-end; }

.message-role {
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-3); padding: 0 4px;
}
.message.user .message-role { text-align: right; }

.message-bubble {
  padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.65;
}
.message.assistant .message-bubble {
  background: var(--bg-3); border: 1px solid var(--border); color: var(--text);
  border-radius: 4px 12px 12px 12px;
}
.message.user .message-bubble {
  background: var(--accent); color: #fff;
  border-radius: 12px 4px 12px 12px;
}

.message.feedback .message-bubble {
  background: var(--bg-2); border: 1px solid var(--accent-dim);
  color: var(--text); border-radius: 12px; max-width: 100%;
}
.message.feedback { max-width: 100%; }
.message.feedback .message-role { color: var(--accent); }

.message-bubble strong { color: var(--accent); font-weight: 600; }

.typing-indicator .message-bubble {
  color: var(--text-3); font-style: italic; font-size: 13px;
}

/* INPUT */
.input-area {
  padding: 1rem 1.5rem; border-top: 1px solid var(--border);
  background: var(--bg-2); flex-shrink: 0;
}

textarea {
  display: block; margin-bottom: 10px;
}

.input-actions { display: flex; align-items: center; justify-content: space-between; }

.input-hint { font-size: 12px; color: var(--text-3); }
kbd {
  font-family: var(--mono); font-size: 11px; background: var(--bg-3);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--text-2);
}

.btn-send {
  padding: 9px 20px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; font-family: var(--sans);
  font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.btn-send:hover { opacity: 0.85; }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* HISTORY */
#view-history { overflow-y: auto; padding: 2rem; }
#view-history .page-title { margin-bottom: 1.5rem; }

.history-list { display: flex; flex-direction: column; gap: 10px; max-width: 640px; }

.history-item {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: border-color 0.15s;
}
.history-item:hover { border-color: var(--accent); }

.history-meta { display: flex; flex-direction: column; gap: 4px; }
.history-scenario { font-size: 14px; font-weight: 600; }
.history-date { font-size: 12px; color: var(--text-2); font-family: var(--mono); }
.history-stats { font-size: 12px; color: var(--text-3); }

.history-empty { color: var(--text-2); font-size: 14px; padding: 2rem 0; }


/* MIC & TTS */
.btn-mic {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg-3); font-size: 18px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.btn-mic:hover { border-color: var(--accent); }
.btn-mic.recording {
  background: var(--red); border-color: var(--red); animation: pulse-mic 1s infinite;
}
@keyframes pulse-mic {
  0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(248,113,113,0); }
}
.tts-on { color: var(--accent) !important; border-color: var(--accent) !important; }
.btn-mic.unsupported { opacity: 0.3; cursor: not-allowed; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

</style>
</head>
<body>
  <div id="app">
    <div id="login-screen" class="screen">
      <div class="login-box">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">TechEnglish</span>
        </div>
        <p class="login-sub">IT English conversation simulator</p>
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
        <button id="login-btn" class="btn-primary">Enter</button>
        <p id="login-error" class="error-msg"></p>
      </div>
    </div>

    <div id="main-screen" class="screen hidden">
      <header class="header">
        <div class="logo small">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">TechEnglish</span>
        </div>
        <nav class="nav">
          <button class="nav-btn active" data-view="practice">Practice</button>
          <button class="nav-btn" data-view="history">History</button>
        </nav>
        <button id="logout-btn" class="btn-ghost">Logout</button>
      </header>

      <div id="view-practice" class="view">
        <div id="scenario-select" class="scenario-select">
          <h1 class="page-title">Choose your scenario</h1>
          <p class="page-sub">10–15 minute conversation session</p>
          <div id="scenario-cards" class="scenario-cards"></div>
        </div>

        <div id="chat-area" class="chat-area hidden">
          <div class="chat-header">
            <button id="back-btn" class="btn-ghost">← Back</button>
            <div class="chat-meta">
              <span id="scenario-label" class="scenario-badge"></span>
              <span id="session-timer" class="timer">00:00</span>
            </div>
            <button id="tts-toggle" class="btn-ghost tts-on" title="Toggle voice">🔊</button>
            <button id="end-session-btn" class="btn-end">End & Get Feedback</button>
          </div>

          <div id="messages" class="messages"></div>

          <div class="input-area">
            <textarea
              id="user-input"
              placeholder="Type your response in English... (Enter to send, Shift+Enter for new line)"
              rows="3"
            ></textarea>
            <div class="input-actions">
              <span class="input-hint">Or type <kbd>feedback</kbd> to get feedback anytime</span>
              <button id="mic-btn" class="btn-mic" title="Hold to speak">🎤</button>
              <button id="send-btn" class="btn-send">Send →</button>
            </div>
          </div>
        </div>
      </div>

      <div id="view-history" class="view hidden">
        <h1 class="page-title">Session history</h1>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>
  </div>

  <script>
'use strict';

const App = {
  currentScenario: null,
  messages: [],
  timerInterval: null,
  secondsElapsed: 0,
  sessionStartTime: null,



  // --- Speech ---
  ttsEnabled: true,
  recognition: null,
  synth: window.speechSynthesis,

  initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      this.recognition = new SpeechRecognition();
      this.recognition.lang = 'en-US';
      this.recognition.interimResults = true;
      this.recognition.continuous = false;

      this.recognition.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        this.$('user-input').value = transcript;
      };
      this.recognition.onend = () => {
        this.$('mic-btn').classList.remove('recording');
      };
      this.recognition.onerror = (e) => {
        console.error('Speech error:', e.error);
        this.$('mic-btn').classList.remove('recording');
      };
    } else {
      this.$('mic-btn').classList.add('unsupported');
      this.$('mic-btn').title = 'Speech not supported in this browser';
    }

    // TTS toggle
    this.$('tts-toggle').addEventListener('click', () => {
      this.ttsEnabled = !this.ttsEnabled;
      this.$('tts-toggle').classList.toggle('tts-on', this.ttsEnabled);
      this.$('tts-toggle').textContent = this.ttsEnabled ? '🔊' : '🔇';
      if (!this.ttsEnabled) this.synth.cancel();
    });

    // Mic button
    const micBtn = this.$('mic-btn');
    if (this.recognition) {
      micBtn.addEventListener('click', () => {
        if (micBtn.classList.contains('recording')) {
          this.recognition.stop();
        } else {
          this.$('user-input').value = '';
          micBtn.classList.add('recording');
          this.recognition.start();
        }
      });
    }
  },

  speak(text) {
    if (!this.ttsEnabled || !this.synth) return;
    this.synth.cancel();
    // Clean markdown
    const clean = text.replace(/\*\*/g, '').replace(/<[^>]+>/g, '');
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = 'en-US';
    utterance.rate = 0.95;
    // Try to pick a good English voice
    const voices = this.synth.getVoices();
    const english = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) 
                 || voices.find(v => v.lang.startsWith('en-US'))
                 || voices.find(v => v.lang.startsWith('en'));
    if (english) utterance.voice = english;
    this.synth.speak(utterance);
  },

  // --- DOM refs ---
  $: id => document.getElementById(id),

  init() {
    this.checkAuth();
    this.bindEvents();
    this.initSpeech();
  },

  async checkAuth() {
    this.token = localStorage.getItem('te_token');
    if (this.token) {
      const res = await fetch('/english/api/auth/check', { headers: { 'Authorization': 'Bearer ' + this.token }});
      const data = await res.json();
      if (data.authenticated) { this.showMain(); return; }
      localStorage.removeItem('te_token');
    }
    this.showLogin();
  },

  bindEvents() {
    // Login
    this.$('login-btn').addEventListener('click', () => this.login());
    this.$('password-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') this.login();
    });

    // Logout
    this.$('logout-btn').addEventListener('click', () => this.logout());

    // Nav
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => this.switchView(btn.dataset.view));
    });

    // Chat controls
    this.$('back-btn').addEventListener('click', () => this.backToScenarios());
    this.$('end-session-btn').addEventListener('click', () => this.requestFeedback());
    this.$('send-btn').addEventListener('click', () => this.sendMessage());
    this.$('user-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.sendMessage();
      }
    });
  },

  async login() {
    const pw = this.$('password-input').value;
    const res = await fetch('/english/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
      const data = await res.json();
      this.token = data.token;
      localStorage.setItem('te_token', this.token);
      this.showMain();
    } else {
      this.$('login-error').textContent = 'Wrong password.';
    }
  },

  async logout() {
    await fetch('/english/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + this.token }}); localStorage.removeItem('te_token'); this.token = null;
    this.showLogin();
  },

  showLogin() {
    this.$('login-screen').classList.remove('hidden');
    this.$('main-screen').classList.add('hidden');
  },

  showMain() {
    this.$('login-screen').classList.add('hidden');
    this.$('main-screen').classList.remove('hidden');
    this.loadScenarios();
  },

  switchView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    this.$(`view-${view}`).classList.remove('hidden');
    document.querySelector(`.nav-btn[data-view="${view}"]`).classList.add('active');
    if (view === 'history') this.loadHistory();
  },

  async loadScenarios() {
    const res = await fetch('/english/api/chat/scenarios', { headers: { 'Authorization': 'Bearer ' + this.token }});
    const scenarios = await res.json();
    const container = this.$('scenario-cards');
    container.innerHTML = '';
    scenarios.forEach(s => {
      const card = document.createElement('div');
      card.className = 'scenario-card';
      card.innerHTML = `
        <span class="scenario-icon">${s.icon}</span>
        <div class="scenario-name">${s.label}</div>
        <div class="scenario-desc">${s.description}</div>
      `;
      card.addEventListener('click', () => this.startSession(s));
      container.appendChild(card);
    });
  },

  startSession(scenario) {
    this.currentScenario = scenario;
    this.messages = [];
    this.secondsElapsed = 0;
    this.sessionStartTime = Date.now();

    this.$('scenario-label').textContent = scenario.label;
    this.$('messages').innerHTML = '';
    this.$('user-input').value = '';

    this.$('scenario-select').classList.add('hidden');
    this.$('chat-area').classList.remove('hidden');

    this.startTimer();
    this.getAssistantOpening();
  },

  startTimer() {
    clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      this.secondsElapsed++;
      const m = String(Math.floor(this.secondsElapsed / 60)).padStart(2, '0');
      const s = String(this.secondsElapsed % 60).padStart(2, '0');
      this.$('session-timer').textContent = `${m}:${s}`;
    }, 1000);
  },

  async getAssistantOpening() {
    this.showTyping();
    const reply = await this.callAPI([]);
    this.hideTyping();
    if (!reply) return;

    this.messages.push({ role: 'user', content: '[Session started]' });
    this.messages.push({ role: 'assistant', content: reply });
    this.renderMessage('assistant', reply);
  },

  async sendMessage() {
    const input = this.$('user-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    this.$('send-btn').disabled = true;

    this.messages.push({ role: 'user', content: text });
    this.renderMessage('user', text);

    if (text.toLowerCase() === 'feedback') {
      await this.requestFeedback();
      this.$('send-btn').disabled = false;
      return;
    }

    this.showTyping();
    const reply = await this.callAPI(this.messages);
    this.hideTyping();

    if (reply) {
      this.messages.push({ role: 'assistant', content: reply });
      this.renderMessage('assistant', reply);
    }

    this.$('send-btn').disabled = false;
    input.focus();
  },

  async requestFeedback() {
    clearInterval(this.timerInterval);

    const feedbackMessages = [
      ...this.messages,
      { role: 'user', content: 'feedback' }
    ];

    this.showTyping();
    const feedback = await this.callAPI(feedbackMessages);
    this.hideTyping();

    if (feedback) {
      this.renderMessage('assistant', feedback, 'feedback');
      await this.saveSession(feedback);
    }

    this.$('end-session-btn').disabled = true;
    this.$('end-session-btn').textContent = 'Session saved ✓';
  },

  async callAPI(messages) {
    try {
      const res = await fetch('/english/api/chat/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
        body: JSON.stringify({
          scenario: this.currentScenario.id,
          messages: messages.length ? messages : [{ role: 'user', content: 'Begin the session.' }]
        })
      });
      const data = await res.json();
      return data.reply || null;
    } catch (err) {
      console.error('API error:', err);
      return null;
    }
  },

  async saveSession(feedback) {
    await fetch('/english/api/sessions/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
      body: JSON.stringify({
        scenario: this.currentScenario.id,
        messages: this.messages,
        feedback,
        duration_seconds: this.secondsElapsed
      })
    });
  },

  renderMessage(role, text, extraClass = '') {
    const container = this.$('messages');
    const div = document.createElement('div');
    div.className = `message ${role} ${extraClass}`.trim();

    const roleLabel = role === 'user' ? 'You' : this.currentScenario?.label || 'Assistant';
    div.innerHTML = `
      <div class="message-role">${roleLabel}</div>
      <div class="message-bubble">${this.formatText(text)}</div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    if (role === 'assistant') this.speak(text);
  },

  formatText(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  },

  showTyping() {
    const container = this.$('messages');
    const div = document.createElement('div');
    div.className = 'message assistant typing-indicator';
    div.id = 'typing';
    div.innerHTML = `
      <div class="message-role">${this.currentScenario?.label || 'Assistant'}</div>
      <div class="message-bubble">typing...</div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  },

  hideTyping() {
    const el = this.$('typing');
    if (el) el.remove();
  },

  backToScenarios() {
    clearInterval(this.timerInterval);
    this.$('chat-area').classList.add('hidden');
    this.$('scenario-select').classList.remove('hidden');
    this.$('end-session-btn').disabled = false;
    this.$('end-session-btn').textContent = 'End & Get Feedback';
    this.currentScenario = null;
    this.messages = [];
  },

  async loadHistory() {
    const res = await fetch('/english/api/sessions/history', { headers: { 'Authorization': 'Bearer ' + this.token }});
    const sessions = await res.json();
    const list = this.$('history-list');

    if (!sessions.length) {
      list.innerHTML = '<p class="history-empty">No sessions yet. Start practicing!</p>';
      return;
    }

    list.innerHTML = '';
    sessions.forEach(s => {
      const date = new Date(s.created_at).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      const duration = s.duration_seconds
        ? `${Math.floor(s.duration_seconds / 60)}m ${s.duration_seconds % 60}s`
        : '—';

      const labels = { interview: '🎯 Interview', stakeholder: '📊 Stakeholder', technical: '⚙️ Tech Team' };
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="history-meta">
          <div class="history-scenario">${labels[s.scenario] || s.scenario}</div>
          <div class="history-date">${date}</div>
          <div class="history-stats">${s.message_count} messages · ${duration}</div>
        </div>
        <span style="color: var(--text-3); font-size: 18px;">→</span>
      `;
      list.appendChild(item);
    });
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
</body>
</html>
